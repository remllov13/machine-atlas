<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Machine Atlas</title>
<style>
  :root{
    --ink:#0A0C10; --panel:#12161C; --panel2:#1A1F27; --line:#262C34;
    --text:#E9E7E0; --muted:#8A9099; --dim:#59606A; --lime:#C6F24E; --amber:#E4A93A; --blue:#5B8BD4;
    --serif:Georgia,"Times New Roman",serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(1300px 900px at 50% 40%,#151B24 0%,#0A0C10 72%);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  button{font-family:inherit}
  #hud{position:fixed;top:0;left:0;right:0;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 16px;z-index:30;pointer-events:none;flex-wrap:wrap}
  .hl{display:flex;align-items:center;gap:12px;pointer-events:auto;min-width:0}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--muted);white-space:nowrap}
  .brand b{color:var(--text);font-weight:600}.brand .dot{color:var(--lime)}
  #back{display:none;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink);background:var(--lime);border:none;border-radius:7px;padding:6px 10px;cursor:pointer}
  .crumb-sub{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--dim);margin-left:8px}
  #crumb{font-family:var(--serif);font-size:18px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .counter{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);pointer-events:auto}
  .counter b{color:var(--lime)} .counter a{color:var(--dim);margin-left:10px}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;
    letter-spacing:1.5px;color:var(--dim);z-index:20;text-align:center;pointer-events:none;width:min(720px,90vw)}
  #stage{position:fixed;inset:0;cursor:grab}#stage:active{cursor:grabbing}
  svg{display:block;width:100%;height:100%}
  .hit{cursor:pointer;outline:none}
  .hit:hover .f,.hit:focus .f{filter:brightness(1.25)}
  .lbl{font-family:var(--mono);font-size:calc(10px * var(--lk,1));fill:var(--text);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0A0C10;stroke-width:3px;stroke-linejoin:round}
  .lbl-sub{font-size:calc(8.5px * var(--lk,1));fill:var(--muted)}
  svg.far .lbl-sub{display:none}
  .lbl-prod{fill:#B9A27A}
  .lbl-big{font-size:calc(12px * var(--lk,1))}
  .lbl-ghost{fill:var(--dim)}
  svg.far .lbl-ghost{display:none}
  .rd{fill:none;transition:stroke-opacity .15s}
  .rd-in{stroke:#C6F24E;stroke-width:3;stroke-opacity:.45}
  .rd-x{stroke:#C6F24E;stroke-width:1.4;stroke-opacity:.10;stroke-dasharray:6 6}
  .rd.hot{stroke-opacity:.9;stroke-width:3}
  @media(prefers-reduced-motion:reduce){.rd{transition:none}}
  .row-lbl{font-family:var(--mono);font-size:calc(13px * var(--lk,1));letter-spacing:4px;text-transform:uppercase;text-anchor:end;pointer-events:none;paint-order:stroke;stroke:#0A0C10;stroke-width:4px;opacity:.9}
  .plaza-lbl{font-family:var(--mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;text-anchor:middle;pointer-events:none;fill:var(--dim)}

  #legend{position:fixed;right:14px;bottom:40px;background:rgba(18,22,28,.9);border:1px solid var(--line);border-radius:10px;padding:9px 11px;z-index:20;font-size:11px;color:var(--muted);display:grid;gap:5px}
  #legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}

  #panel{position:fixed;top:0;right:0;height:100%;width:min(520px,100vw);background:var(--panel);
    border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:transform .28s ease;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
  #panel.open{transform:translateX(0)}
  @media(prefers-reduced-motion:reduce){#panel{transition:none}}
  .pwrap{padding:20px 22px 70px}
  .pclose{position:sticky;top:0;float:right;font-family:var(--mono);font-size:18px;color:var(--muted);background:var(--panel);border:none;cursor:pointer;padding:4px 8px;margin:-6px -8px 0 0}
  .pclose:hover{color:var(--lime)}
  .plink{font-family:var(--mono);font-size:11px;color:var(--blue);background:none;border:none;cursor:pointer;padding:0;margin-bottom:8px}
  .peyebrow{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .ptitle{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.08;margin:7px 0 10px}
  .poneline{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--amber);line-height:1.4;margin:4px 0 10px}
  .psec{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--lime);margin:20px 0 10px;padding-top:15px;border-top:1px solid var(--line)}
  .pcell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:8px;line-height:1.45}
  .pcell .k{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  .pcell .big{font-family:var(--serif);font-size:22px;color:var(--text)}
  .note{color:var(--muted);font-size:12px;margin-top:5px}
  .src{font-size:11.5px;margin-top:5px}.src a{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}}
  .co{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;width:100%;text-align:left;color:var(--text)}
  .co:hover,.co:focus{border-color:var(--lime);outline:none}
  .co .n{font-size:14px}.co .prod{display:block;font-size:11px;color:var(--muted);margin-top:2px}.co .v{font-family:var(--mono);font-size:12px;color:var(--amber)}
  .bar{grid-column:1 / -1;height:5px;background:var(--panel);border-radius:3px;overflow:hidden}
  .bar span{display:block;height:100%;background:var(--amber)}
  .badge{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:1px}
  .badge.lit{color:var(--ink);background:var(--lime);border-color:var(--lime)}
  .badge.ord{color:var(--amber);border-color:rgba(228,169,58,.5)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;background:var(--lime);color:var(--ink);border:none;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600}
  .btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
  .toggle{display:inline-flex;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:12px}
  .tbtn{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);background:none;border:none;border-radius:6px;padding:7px 12px;cursor:pointer}
  .tbtn.active{background:var(--lime);color:var(--ink);font-weight:600}
  .road{font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
  .road b{font-weight:600}.road .w{color:var(--muted);font-size:11.5px}
  .pecon{background:linear-gradient(180deg,rgba(140,131,224,.1),transparent);border:1px solid rgba(140,131,224,.35);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.5}
  /* teardown renderer (carried over from v2) */
  .pmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px}
  .pband{background:linear-gradient(90deg,rgba(228,169,58,.13),rgba(228,169,58,.03));border:1px solid rgba(228,169,58,.4);border-radius:12px;padding:14px 16px}
  .pband .eq{font-family:var(--serif);font-size:18px;color:var(--amber)}.pband .lev{font-size:12px;color:var(--muted);margin-top:6px}
  .pplay{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:9px}
  .pplay .nm{font-family:var(--serif);font-size:17px}.pplay .tg{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:5px}
  .pplay .mv{font-size:13px}
  .pmech{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .pill{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .stk{display:grid;grid-template-columns:1.4fr .8fr;gap:8px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line)}
  .stk .sl{font-weight:600}.stk .sr{font-family:var(--serif);color:var(--amber);text-align:right}
  .mv-item{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin:6px 0}
  .mv-n{flex:none;width:19px;height:19px;border-radius:50%;background:var(--lime);color:var(--ink);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
  .pglyph{background:linear-gradient(180deg,rgba(198,242,78,.08),transparent);border:1px solid rgba(198,242,78,.3);border-radius:12px;padding:14px}
  .pglyph p{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.5}

  #queuebox{position:fixed;left:14px;bottom:40px;width:316px;max-width:calc(100vw - 28px);background:rgba(18,22,28,.94);border:1px solid var(--line);border-radius:12px;padding:11px 12px;z-index:30;backdrop-filter:blur(6px)}
  .qhead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:none;border:none;width:100%;color:inherit;padding:0}
  .qh{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--lime)}
  .qh span{color:var(--dim)}
  #qbody{margin-top:9px}
  #queuebox.collapsed #qbody{display:none}
  .qmode{display:flex;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:7px}
  .qmode button{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:none;border:none;border-radius:5px;padding:6px;cursor:pointer}
  .qmode button.active{background:var(--lime);color:var(--ink);font-weight:600}
  .qrow{display:flex;gap:6px}
  .qinput,#qind{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 9px;font-size:13px;font-family:inherit}
  #qind{width:100%;margin-bottom:6px}
  .qinput:focus,#qind:focus{outline:1px solid var(--lime)}
  .qrow .btn{padding:7px 11px}
  .qlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .qchip{font-family:var(--mono);font-size:10px;color:var(--amber);background:rgba(228,169,58,.1);border:1px solid rgba(228,169,58,.4);border-radius:20px;padding:3px 8px}
  .qempty{font-size:11px;color:var(--dim)}
  .qnote{font-size:9.5px;color:var(--dim);margin-top:7px;line-height:1.4}
  @media(max-width:700px){#legend{display:none}.hint{display:none}#queuebox{bottom:12px}}
</style>
</head>
<body>
<div id="hud">
  <div class="hl">
    <div class="brand"><span class="dot">&#9670;</span> THE MACHINE <b>ATLAS</b></div>
    <button id="back" onclick="goCity()">&larr; City</button>
    <div id="crumb"></div>
  </div>
  <div class="counter" id="counter"></div>
</div>
<div id="stage"><svg id="svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of industries"></svg></div>
<div class="hint" id="hint"></div>
<div id="legend">
  <div><i style="background:#F2C15A"></i>Lit windows: studied (teardown done)</div>
  <div><i style="background:#3A414C"></i>Plain: known, not studied yet</div>
  <div><i style="background:none;border:1.5px solid #E4A93A"></i>Crane: teardown ordered</div>
  <div><i style="background:none;border:1.5px dashed #59606A"></i>Dashed: locked, or no size data</div>
</div>
<div id="queuebox">
  <button class="qhead" onclick="toggleQueueBox()" aria-expanded="true" id="qtoggle"><span class="qh">Queue <span>&middot; builds next run</span></span><span class="qh" id="qcaret">&minus;</span></button>
  <div id="qbody">
    <div class="qmode" role="tablist">
      <button id="qm-ind" class="active" onclick="setQMode('industry')">Industry</button>
      <button id="qm-co" onclick="setQMode('company')">Company</button>
    </div>
    <select id="qind" style="display:none" aria-label="Industry for this company"></select>
    <div class="qrow"><input id="qinput" class="qinput" placeholder="e.g. Electric power" aria-label="Name to queue"><button class="btn" onclick="submitQueueBox()">Queue</button></div>
    <div id="qlist" class="qlist"></div>
    <div class="qnote" id="qnote"></div>
  </div>
</div>
<aside id="panel" aria-live="polite"><div class="pwrap" id="pwrap"></div></aside>

<script>
/* ===================== data ===================== */
const REPO='remllov13/machine-atlas';
let CITY=null, IND={}, TEARDOWNS=new Set(), TEAR_CACHE={}, QUEUE=[];
const CHAIN_COLORS={
  'AI stack': {top:'#2B4A74',l:'#1E3657',r:'#13223A',zone:'#111D2E',lbl:'#5B8BD4',icon:'chip'},
  'Money':    {top:'#2E6E54',l:'#1F5540',r:'#143827',zone:'#11261E',lbl:'#4FB386',icon:'vault'},
  'Media':    {top:'#8C2E58',l:'#6B2242',r:'#47152B',zone:'#26111B',lbl:'#D45B8F',icon:'play'},
  'Community':{top:'#6A4E8C',l:'#4E3869',r:'#2F2448',zone:'#1D1729',lbl:'#A285CF',icon:'podium'},
  'Online work':{top:'#8A6A2E',l:'#6B5022',r:'#473515',zone:'#231C10',lbl:'#D4A65B',icon:'laptop'}
};
const SPARE=[{top:'#2E6E6E',l:'#1F5555',r:'#143838',zone:'#112424',lbl:'#4FB3B3',icon:'chip'},{top:'#7A3E2E',l:'#5E2F22',r:'#3E1F16',zone:'#221310',lbl:'#D4795B',icon:'chip'},{top:'#4E6A2E',l:'#3B5022',r:'#263515',zone:'#181F10',lbl:'#9BC75B',icon:'chip'}];
const PLAIN={top:'#3A414C',l:'#2A3038',r:'#1C2128'};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const chainColor=c=>{if(CHAIN_COLORS[c])return CHAIN_COLORS[c];let x=0;for(const ch of String(c))x=(x*31+ch.charCodeAt(0))>>>0;return SPARE[x%SPARE.length];};
const fmtHHI=h=>h==null?'—':h.toLocaleString('en-US');

async function getJSON(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.json();}
async function loadAll(){
  CITY=await getJSON('data/industries/city.json');
  const list=await Promise.all(CITY.industries.map(id=>getJSON('data/industries/'+id+'.json').catch(()=>null)));
  list.filter(Boolean).forEach(i=>IND[i.id]=i);
  try{const m=await getJSON('data/manifest.json');(m.entries||[]).forEach(s=>TEARDOWNS.add(s));}catch(_){}
}
async function getTeardown(slug){
  if(TEAR_CACHE[slug])return TEAR_CACHE[slug];
  const e=await getJSON('data/'+slug+'.json'); TEAR_CACHE[slug]=e; return e;
}
const studied=c=>!!(c.teardown&&TEARDOWNS.has(c.teardown));

/* ===================== geometry ===================== */
const TW=58, TH=29, ROWGAP=5;
const iso=(gx,gy)=>({x:(gx-gy)*TW,y:(gx+gy)*TH});
function heightUSD(v){ // city: height from revenue, fixed $1T reference (10x revenue ~ 2x height)
  if(!(v>0))return 50;
  return Math.round(50+0.95*Math.min(1,Math.pow(v/1e12,0.3))*90);
}
function shareHeight(pct){return Math.round(36+164*Math.pow(Math.max(0,Math.min(100,pct))/100,0.75));}

function fwin(ox,oy,ux,uy,vx,vy,cols,rows,key,face,litPct,litColor){
  let s=''; const su=0.60/cols, sv=0.50/rows, hu=su/2, hv=sv/2;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const cu=(i+0.5)/cols, cv=(j+0.5)/rows, cx=ox+ux*cu+vx*cv, cy=oy+uy*cu+vy*cv;
    const pt=(du,dv)=>`${(cx+ux*du+vx*dv).toFixed(1)},${(cy+uy*du+vy*dv).toFixed(1)}`;
    let h=0; for(const c of key+face+i+'x'+j)h=(h*31+c.charCodeAt(0))>>>0;
    const lit=(h%100)<litPct*100;
    s+=`<polygon points="${pt(-hu,-hv)} ${pt(hu,-hv)} ${pt(hu,hv)} ${pt(-hu,hv)}" fill="${lit?litColor:'#1E2733'}" fill-opacity="${lit?0.95:0.55}"/>`;
  }
  return s;
}
function roofIcon(kind,x,y){
  const s='fill="none" stroke="#0A0C10" stroke-width="1.4" stroke-opacity="0.7"';
  if(kind==='chip')return `<g><rect x="${x-6}" y="${y-6}" width="12" height="12" rx="1.5" ${s}/><rect x="${x-2.5}" y="${y-2.5}" width="5" height="5" fill="#0A0C10" fill-opacity="0.55"/></g>`;
  if(kind==='vault')return `<g><circle cx="${x}" cy="${y}" r="6.5" ${s}/><circle cx="${x}" cy="${y}" r="2" fill="#0A0C10" fill-opacity="0.55"/></g>`;
  if(kind==='podium')return `<g><rect x="${x-2}" y="${y-7}" width="4" height="7" ${s}/><line x1="${x-9}" y1="${y+2}" x2="${x+9}" y2="${y+2}" ${s}/></g>`;
  if(kind==='laptop')return `<g><rect x="${x-7}" y="${y-6}" width="14" height="9" rx="1" ${s}/><line x1="${x-9}" y1="${y+5}" x2="${x+9}" y2="${y+5}" ${s}/></g>`;
  if(kind==='play')return `<path d="M${x-4},${y-6} L${x+6},${y} L${x-4},${y+6} Z" ${s}/>`;
  return '';
}
function crane(x,topY,w){
  const c='#E4A93A', mx=x+w*0.35, top=topY-34;
  return `<g stroke="${c}" stroke-width="1.3" fill="none" opacity="0.95">
    <line x1="${mx}" y1="${topY}" x2="${mx}" y2="${top}"/>
    <line x1="${mx-14}" y1="${top}" x2="${mx+26}" y2="${top}"/>
    <line x1="${mx}" y1="${top-6}" x2="${mx-14}" y2="${top}"/><line x1="${mx}" y1="${top-6}" x2="${mx+26}" y2="${top}"/>
    <line x1="${mx+20}" y1="${top}" x2="${mx+20}" y2="${top+12}" stroke-dasharray="1.5 1.5"/>
    <rect x="${mx+17.5}" y="${top+12}" width="5" height="4" fill="${c}"/></g>`;
}
function scaffold(x,y,w,h,H){
  const c='#E4A93A', topY=y-H; let s='';
  for(let k=1;k<5;k++){const yy=y-H*k/5; s+=`<line x1="${x-w}" y1="${yy}" x2="${x}" y2="${yy+h}" stroke="${c}" stroke-width="0.7" opacity="0.7"/><line x1="${x+w}" y1="${yy}" x2="${x}" y2="${yy+h}" stroke="${c}" stroke-width="0.7" opacity="0.7"/>`;}
  s+=`<line x1="${x-w}" y1="${y}" x2="${x-w}" y2="${topY}" stroke="${c}" stroke-width="0.8" opacity="0.7"/><line x1="${x+w}" y1="${y}" x2="${x+w}" y2="${topY}" stroke="${c}" stroke-width="0.8" opacity="0.7"/>`;
  return s;
}
/* one building. o:{x,y,w,h,H,col,litPct,dashed,icon,key,crane,attrs} */
function building(o){
  const {x,y,w,h,H,col}=o, topY=y-H;
  const top=`M${x},${topY-h} L${x+w},${topY} L${x},${topY+h} L${x-w},${topY} Z`;
  const left=`M${x-w},${topY} L${x},${topY+h} L${x},${y+h} L${x-w},${y} Z`;
  const right=`M${x+w},${topY} L${x},${topY+h} L${x},${y+h} L${x+w},${y} Z`;
  const dash=o.dashed?'stroke-dasharray="3 3" stroke="#59606A" stroke-width="1"':'stroke="#0A0C10" stroke-width="0.5"';
  const rows=Math.max(2,Math.min(14,Math.round(H/10)));
  return `<ellipse cx="${x}" cy="${y+h+3}" rx="${w*0.95}" ry="${h*0.5}" fill="#000" fill-opacity="0.22"/>
  <g class="hit" ${o.attrs||''}>
    <path class="f" d="${left}" fill="${col.l}" ${dash}/>
    <path class="f" d="${right}" fill="${col.r}" ${dash}/>

/* ===================== camera ===================== */
let VIEW={x:0,y:0,s:1};
function applyCam(){const g=document.getElementById('cam');if(g)g.setAttribute('transform',`translate(${VIEW.x},${VIEW.y}) scale(${VIEW.s})`);
  const k=Math.max(1,Math.min(1.7,Math.pow(VIEW.s,-0.75))); document.documentElement.style.setProperty('--lk',k.toFixed(3));
  const svg=document.getElementById('svg'); if(svg)svg.classList.toggle('far',VIEW.s<0.8);}
function VB(){const st=document.getElementById('stage');return {w:st.clientWidth||1400,h:st.clientHeight||900};}
function panelReserve(){return document.getElementById('panel').classList.contains('open')&&VB().w>900?Math.min(520,VB().w):0;}
function fit(b,reserve,left){
  const {w:W,h:Hh}=VB(); left=(W>900&&!(reserve>0))?(left||0):0;
  const w=b.x1-b.x0, h=b.y1-b.y0, availW=W-(reserve||0)-left-40, availH=Hh-150;
  const minS=W<700?0.55:0.28;
  const s=Math.max(minS,Math.min(1.5,availW/Math.max(w,1),availH/Math.max(h,1)));
  VIEW.s=s; VIEW.x=left+(W-(reserve||0)-left)/2-s*(b.x0+w/2); VIEW.y=(Hh+30)/2-s*(b.y0+h/2);
}
window.addEventListener('resize',()=>{const {w,h}=VB();document.getElementById('svg').setAttribute('viewBox',`0 0 ${w} ${h}`);route(true);});
(function(){
  const stage=document.getElementById('stage'); let drag=null;
  stage.addEventListener('mousedown',e=>{if(e.target.closest('.hit'))return;drag={x:e.clientX,y:e.clientY,vx:VIEW.x,vy:VIEW.y};});
  window.addEventListener('mousemove',e=>{if(!drag)return;const k=1;VIEW.x=drag.vx+(e.clientX-drag.x)*k;VIEW.y=drag.vy+(e.clientY-drag.y)*k;applyCam();});
  window.addEventListener('mouseup',()=>drag=null);
  stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.05:0.952;const ns=Math.max(0.4,Math.min(3,VIEW.s*f));
    const r=stage.getBoundingClientRect(), k=1, mx=(e.clientX-r.left)*k, my=(e.clientY-r.top)*k;
    VIEW.x=mx-(mx-VIEW.x)*(ns/VIEW.s); VIEW.y=my-(my-VIEW.y)*(ns/VIEW.s); VIEW.s=ns; applyCam();},{passive:false});
  let t0=null;
  stage.addEventListener('touchstart',e=>{if(e.touches.length===1&&!e.target.closest('.hit'))t0={x:e.touches[0].clientX,y:e.touches[0].clientY,vx:VIEW.x,vy:VIEW.y};});
  stage.addEventListener('touchmove',e=>{if(t0&&e.touches.length===1){const k=1;VIEW.x=t0.vx+(e.touches[0].clientX-t0.x)*k;VIEW.y=t0.vy+(e.touches[0].clientY-t0.y)*k;applyCam();}},{passive:true});
  stage.addEventListener('touchend',()=>t0=null);
})();

/* ===================== traffic ===================== */
let trafficRAF=null;
function startTraffic(roads){
  if(trafficRAF)cancelAnimationFrame(trafficRAF);
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cam=document.getElementById('cam'); if(!cam)return;
  const g=document.createElementNS('http://www.w3.org/2000/svg','g'); cam.appendChild(g);
  const cars=[];
  roads.forEach(r=>{
    const len=Math.hypot(r.bx-r.ax,r.by-r.ay), ang=Math.atan2(r.by-r.ay,r.bx-r.ax)*180/Math.PI;
    const n=len>260?3:len>130?2:1;
    for(let k=0;k<n;k++){
      const el=document.createElementNS('http://www.w3.org/2000/svg','rect');
      el.setAttribute('width','3.6');el.setAttribute('height','2.1');el.setAttribute('rx','0.8');
      el.setAttribute('fill',Math.random()<0.5?'#F4DCA6':'#CFE6FF');el.setAttribute('fill-opacity','0.9');
      g.appendChild(el); cars.push({el,r,ang,t:Math.random(),speed:0.02+Math.random()*0.025,dir:Math.random()<0.5?1:-1});
    }
  });
  const place=c=>{const px=c.r.ax+(c.r.bx-c.r.ax)*c.t, py=c.r.ay+(c.r.by-c.r.ay)*c.t;c.el.setAttribute('transform',`translate(${px-1.8},${py-1.05}) rotate(${c.ang},1.8,1.05)`);};
  if(reduce){cars.forEach(place);return;}
  let last=performance.now();
  (function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
    cars.forEach(c=>{c.t+=c.speed*dt*c.dir;if(c.t>1)c.t-=1;if(c.t<0)c.t+=1;place(c);});
    trafficRAF=requestAnimationFrame(frame);})(last);
}

/* ===================== city view ===================== */
/* Layout from the roads themselves: an industry's column is its depth in the
   supply chain (longest supplier path), so the map stays consistent whatever stage
   a run writes. Industries at the same depth share the column, side by side in lanes. */
const LANE=3.0, COL=3;
function cityLayout(){
  const ids=Object.keys(IND), ins={}; ids.forEach(i=>ins[i]=[]);
  (CITY.roads||[]).forEach(r=>{if(IND[r.from]&&IND[r.to]&&IND[r.from].chain===IND[r.to].chain)ins[r.to].push(r.from);});
  const depth={}; ids.forEach(i=>depth[i]=0);
  for(let pass=0;pass<ids.length;pass++){let moved=false;ids.forEach(i=>{ins[i].forEach(s=>{if(depth[s]+1>depth[i]&&depth[s]+1<ids.length){depth[i]=depth[s]+1;moved=true;}});});if(!moved)break;}
  ids.forEach(i=>{if(!ins[i].length&&!(CITY.roads||[]).some(r=>r.from===i&&IND[r.to]&&IND[r.to].chain===IND[i].chain))depth[i]=Math.max(0,IND[i].stage|0);});
  const chains=CITY.chains.filter(ch=>ids.some(i=>IND[i].chain===ch));
  const pos={}, rows=[]; let base=0;
  chains.forEach((ch,r)=>{
    const mine=ids.filter(i=>IND[i].chain===ch), cols={};
    mine.forEach(i=>(cols[depth[i]]=cols[depth[i]]||[]).push(i));
    let lanes=1;
    Object.values(cols).forEach(list=>{list.sort((a,b)=>((IND[b].revenue||{}).value_usd||0)-((IND[a].revenue||{}).value_usd||0));lanes=Math.max(lanes,list.length);list.forEach((id,k)=>pos[id]={gx:depth[id]*COL,gy:base+k*LANE,row:r,lane:k});});
    rows.push({chain:ch,base,lanes,ghostY:base+(lanes-1)*LANE+2.2,maxDepth:Math.max(...mine.map(i=>depth[i]))});
    base+= (lanes-1)*LANE + 6.2;
  });
  // locked plots live in their own strip at the front of the row, never between buildings
  const taken={};
  const ghosts=(CITY.locked||[]).filter(g=>!IND[g.id]&&IND[g.target]).map(g=>{
    const t=pos[g.target], row=rows.find(r=>r.chain===IND[g.target].chain), step=g.rel==='supplier'?-1.6:1.6;
    const used=taken[row.chain]=taken[row.chain]||[], lo=-1.6, hi=row.maxDepth*COL+1.6, ideal=t.gx+step*0.6;
    let gx=ideal;
    for(let k=0;k<40;k++){const c=ideal+(k%2?-1:1)*Math.ceil(k/2)*1.6*Math.sign(step); if(c>=lo&&c<=hi&&!used.some(x=>Math.abs(x-c)<1.55)){gx=c;break;}}
    used.push(gx);
    return {...g,gx,gy:row.ghostY,row:t.row};
  });

}
function renderCity(){
  const {pos,ghosts,rows}=cityLayout(); const parts=[], ROADS=[], BANDPTS=[], TOP=[];
  const maxD=Math.max(4,...rows.map(r=>r.maxDepth));
  // row bands
  rows.forEach(row=>{
    const ch=row.chain;
    const c=chainColor(ch), x0=-2.8, x1=maxD*COL+2.8, y0=row.base-1.9, y1=row.ghostY+1.2; BANDPTS.push(iso(x0,y0),iso(x1,y0),iso(x1,y1),iso(x0,y1));
    const a=iso(x0,y0),b=iso(x1,y0),cc=iso(x1,y1),d=iso(x0,y1);
    parts.push(`<path d="${quad(a,b,cc,d)}" fill="${c.zone}" stroke="${c.top}" stroke-opacity="0.35" stroke-width="1.2"/>`);

    parts.push(`<text class="row-lbl" x="${lp.x-6}" y="${lp.y+4}" fill="${c.lbl}">${esc(ch)}</text>`);
    ROADS.push({ax:a.x,ay:a.y,bx:b.x,by:b.y},{ax:d.x,ay:d.y,bx:cc.x,by:cc.y});
  });

    const p=iso(pos[i.id].gx,pos[i.id].gy), H=heightUSD(i.revenue&&i.revenue.value_usd), c=chainColor(i.chain);

  document.getElementById('hint').textContent='DRAG to pan · SCROLL to zoom · HOVER an industry to light its roads · CLICK to enter its district';
}
function mount(parts,roads){

  document.getElementById('svg').innerHTML=`<defs><radialGradient id="fog" cx="50%" cy="46%" r="66%"><stop offset="60%" stop-color="#0A0C10" stop-opacity="0"/><stop offset="100%" stop-color="#0A0C10" stop-opacity="0.85"/></radialGradient></defs>

/* ===================== district view ===================== */
function sizing(i){
  const ns=i.companies.filter(c=>typeof c.share_pct==='number').length;
  const nr=i.companies.filter(c=>c.revenue_usd>0).length;
  const nk=i.companies.filter(c=>c.rank).length;
  if(ns>0 && ns>=nr) return {basis:'share',label:'Height = share of this market'};
  if(nr>=2 && i.revenue&&i.revenue.value_usd>0) return {basis:'revenue',label:'Height = revenue as a share of the industry total shown'};
  if(nk>0) return {basis:'rank',label:'Height = rank by '+(i.rank_basis||'size')+' (market shares are not public)'};
  return {basis:'none',label:'No size data yet: all buildings drawn at the same height'};
}
function coSize(c,i,sz){
  if(sz.basis==='share'&&typeof c.share_pct==='number')return {pct:c.share_pct,H:shareHeight(c.share_pct)};
  if(sz.basis==='revenue'&&c.revenue_usd>0){const pct=100*c.revenue_usd/i.revenue.value_usd;return {pct,H:shareHeight(pct)};}
  if(sz.basis==='rank'&&c.rank)return {pct:null,H:Math.round(40+90/c.rank)};
  return {pct:null,H:34,unsized:true};
}
function coverage(i,sz){
  if(sz.basis!=='share')return null;
  const sum=i.companies.reduce((a,c)=>a+(typeof c.share_pct==='number'?c.share_pct:0),0);
  return {sum:Math.min(100,sum),rest:Math.max(0,100-sum)};
}
const prodLine=c=>Array.isArray(c.products)&&c.products.length?c.products.slice(0,2).join(' · '):'';
const prodShort=c=>{if(!Array.isArray(c.products)||!c.products.length)return '';const p=c.products[0];return p.length>24?p.slice(0,23)+'…':p;};

  const pts=[a,b,cc,d];
  mount(parts,ROADS);
  fit({x0:Math.min(...pts.map(p=>p.x))-30,x1:Math.max(...pts.map(p=>p.x))+30,y0:Math.min(...pts.map(p=>p.y))-230,y1:Math.max(...pts.map(p=>p.y))+20},DIST_RESERVE,340);
  applyCam();
  document.getElementById('crumb').innerHTML=`${esc(i.name)} <span class="crumb-sub">${esc(sz.label)}</span>`;
  wireHits();
  const nSt=i.companies.filter(studied).length;
  document.getElementById('counter').innerHTML=`<b>${i.companies.length}</b> companies &middot; <b>${nSt}</b> studied &middot; HHI <b>${fmtHHI(i.structure.hhi)}</b> <a href="classic.html">classic map</a>`;
  document.getElementById('hint').textContent='CLICK a building for its card · the staked lot adds a company · heights compare share of market';
}

/* ===================== panels ===================== */
function openPanelHTML(h){document.getElementById('pwrap').innerHTML=`<button class="pclose" onclick="closePanel()" aria-label="Close">&#10005;</button>`+h;const p=document.getElementById('panel');p.classList.add('open');p.scrollTop=0;}
function closePanel(){document.getElementById('panel').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
const srcLink=u=>u?`<div class="src"><a href="${esc(u)}" target="_blank" rel="noopener">source</a></div>`:'';

function industryHTML(i){
  const c=chainColor(i.chain), r=i.revenue||{}, st=i.structure||{};
  let h=`<div class="peyebrow" style="color:${c.lbl}">${esc(i.chain)} &middot; NAICS ${esc(i.naics.code)}</div><div class="ptitle">${esc(i.name)}</div><div class="poneline">${esc(i.one_line)}</div>`;
  h+=`<div class="grid2"><div class="pcell"><div class="k">Industry revenue (sets height)</div><div class="big">${esc(r.display)}</div><div class="note">${esc(r.metric||'')}${r.period?' &middot; '+esc(r.period):''}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:''}${srcLink(r.source_url)}</div>
    <div class="pcell"><div class="k">Market structure</div><div class="big">${esc(st.type)}</div><div class="note">HHI ${fmtHHI(st.hhi)} <span style="color:var(--dim)">(0 = many equal firms, 10,000 = one firm)</span></div><div class="note">${esc(st.why||'')}</div>${st.hhi_note?`<div class="note" style="color:var(--dim)">${esc(st.hhi_note)}</div>`:''}</div></div>`;
  const sz=sizing(i);
  h+=`<div class="psec">Companies <span style="color:var(--dim);letter-spacing:0;text-transform:none">&middot; ${esc(sz.label.toLowerCase())}</span></div>`;
  const cov=coverage(i,sz);
  h+=`<div class="note" style="margin:-4px 0 10px">${cov?`Companies with published shares cover <b style="color:var(--text)">${Math.round(cov.sum*10)/10}%</b> of this market.`:'Market shares are not public for this industry, so coverage is unknown.'}</div>`;
  const q=new Set(queuedFor(i.id).map(x=>norm(x.name)));
  i.companies.forEach((co,idx)=>{
    const s=coSize(co,i,sz), isSt=studied(co), ord=q.has(norm(co.name))&&!isSt;
    const val=s.pct!=null?(Math.round(s.pct*10)/10)+'%':(co.rank?'#'+co.rank:'—');
    const pl=prodLine(co);
    h+=`<button class="co" onclick="openCompany('${esc(i.id)}',${idx})"><span class="n">${esc(co.name)}${isSt?'<span class="badge lit">studied</span>':ord?'<span class="badge ord">ordered</span>':''}${pl?`<span class="prod">${esc(pl)}</span>`:''}</span><span class="v">${esc(val)}</span>${s.pct!=null?`<span class="bar"><span style="width:${Math.min(100,s.pct)}%"></span></span>`:''}</button>`;
  });
  if(cov&&cov.rest>=2.5)h+=`<button class="co" onclick="openOthers('${esc(i.id)}')"><span class="n" style="color:var(--muted)">All others</span><span class="v" style="color:var(--muted)">${Math.round(cov.rest*10)/10}%</span><span class="bar"><span style="width:${cov.rest}%;background:#59606A"></span></span></button>`;
  queuedFor(i.id).filter(x=>!i.companies.some(co=>norm(co.name)===norm(x.name))).forEach(x=>{h+=`<div class="pcell">${esc(x.name)} <span class="badge ord">ordered</span><div class="note">Not listed yet. The next run checks it belongs here, then builds it.</div></div>`;});
  h+=`<div class="btns"><button class="btn ghost" onclick="openAddCompany('${esc(i.id)}')">+ Add a company</button></div>`;
  if(i.industry_teardown&&TEARDOWNS.has(i.industry_teardown)){
    h+=`<div class="psec">Industry teardown</div><div class="pcell">How this whole industry makes money, studied in depth.<div class="btns"><button class="btn" onclick="openIndustryTeardown('${esc(i.id)}','teardown')">Read the teardown</button>${i.industry_buildout&&TEARDOWNS.has(i.industry_buildout)?`<button class="btn ghost" onclick="openIndustryTeardown('${esc(i.id)}','buildout')">Read the buildout</button>`:''}</div></div>`;
  }
  h+=`<div class="psec">How it works</div><div class="pcell"><div class="k">Sells</div>${esc(i.sells)}</div><div class="pcell"><div class="k">Customers</div>${esc(i.customers)}</div><div class="pcell"><div class="k">Suppliers</div>${esc(i.suppliers)}</div>`;
  h+=`<div class="psec">Economics lens</div><div class="pecon">${esc(i.econ)}</div>`;
  const ins=(CITY.roads||[]).filter(r=>r.to===i.id), outs=(CITY.roads||[]).filter(r=>r.from===i.id);
  const lk=(CITY.locked||[]).filter(g=>g.target===i.id&&!IND[g.id]);
  if(ins.length||outs.length||lk.length){
    h+=`<div class="psec">Roads</div>`;
    ins.forEach(r=>h+=`<div class="road">&larr; <b>${esc(IND[r.from]?IND[r.from].name:r.from)}</b><span class="w">supplies ${esc(r.what.toLowerCase())}</span></div>`);
    outs.forEach(r=>h+=`<div class="road">&rarr; <b>${esc(IND[r.to]?IND[r.to].name:r.to)}</b><span class="w">buys ${esc(r.what.toLowerCase())}</span></div>`);
    lk.forEach(g=>h+=`<div class="road">&#128274; <b>${esc(g.name)}</b><span class="w">locked ${esc(g.rel)} &middot; NAICS ${esc(g.naics)}</span></div>`);
  }
  return h;
}
function openIndustry(id){const i=IND[id];if(i)openPanelHTML(industryHTML(i));}

async function openCompany(indId,idx){
  const i=IND[indId], co=i&&i.companies[idx]; if(!co)return;
  const sz=sizing(i), s=coSize(co,i,sz), isSt=studied(co);
  const ord=queuedFor(indId).some(x=>norm(x.name)===norm(co.name));
  let h=`<button class="plink" onclick="openIndustry('${esc(indId)}')">&larr; ${esc(i.name)}</button><div class="peyebrow">${esc(i.name)}</div><div class="ptitle">${esc(co.name)}</div>`;
  h+=`<div class="pcell"><div class="k">Place in this market</div>`;
  if(typeof co.share_pct==='number')h+=`<div class="big">${co.share_pct}%</div><div class="note">${esc(co.share_basis||'')}</div>`;
  else if(co.rank)h+=`<div class="big">#${co.rank}</div>`;
  else h+=`<div class="note">No public share figure found yet.</div>`;
  if(co.revenue_display)h+=`<div class="note">Revenue: ${esc(co.revenue_display)}</div>`;
  if(Array.isArray(co.products)&&co.products.length)h+=`<div class="k" style="margin-top:10px">Known for</div><div class="pmech">${co.products.map(p=>`<span class="pill" style="font-size:11px">${esc(p)}</span>`).join('')}</div>`;
  if(co.note)h+=`<div class="note">${esc(co.note)}</div>`;
  h+=srcLink(co.source_url)+`</div>`;
  if(isSt){
    h+=`<div id="tdslot"><div class="note">Loading teardown…</div></div>`;
    openPanelHTML(h);
    try{const e=await getTeardown(co.teardown);document.getElementById('tdslot').innerHTML=`<div class="psec">Teardown</div>`+renderEntry(e);}catch(_){document.getElementById('tdslot').innerHTML='<div class="note">Could not load the teardown.</div>';}
    return;
  }
  h+=`<div class="psec">Study this company</div>`;
  if(ord)h+=`<div class="pcell"><span class="badge ord">ordered</span> A crane is on site. The next daily run builds it.</div>`;
  else h+=`<div class="pcell">Not studied yet. Order a teardown (how it works) or a buildout (how you'd start one).<div class="btns"><button class="btn" onclick="orderCompany('${esc(indId)}',${idx},'teardown')">Order teardown</button><button class="btn ghost" onclick="orderCompany('${esc(indId)}',${idx},'buildout')">Order buildout</button></div><div class="note">Opens a GitHub issue to confirm, one click.</div></div>`;
  openPanelHTML(h);
}
async function openIndustryTeardown(indId,side){
  const i=IND[indId], slug=side==='buildout'?i.industry_buildout:i.industry_teardown;
  let h=`<button class="plink" onclick="openIndustry('${esc(indId)}')">&larr; ${esc(i.name)}</button><div class="peyebrow">Industry ${esc(side)}</div><div class="ptitle">${esc(i.name)}</div>`;
  if(i.industry_teardown&&i.industry_buildout)h+=`<div class="toggle"><button class="tbtn ${side==='teardown'?'active':''}" onclick="openIndustryTeardown('${esc(indId)}','teardown')">Teardown</button><button class="tbtn ${side==='buildout'?'active':''}" onclick="openIndustryTeardown('${esc(indId)}','buildout')">Buildout</button></div>`;
  h+=`<div id="tdslot"><div class="note">Loading…</div></div>`; openPanelHTML(h);
  try{const e=await getTeardown(slug);document.getElementById('tdslot').innerHTML=renderEntry(e);}catch(_){document.getElementById('tdslot').innerHTML='<div class="note">Could not load it.</div>';}
}
function openLocked(gid){
  const g=(CITY.locked||[]).find(x=>x.id===gid); if(!g)return; const t=IND[g.target];
  const queued=QUEUE.some(q=>q.kind==='industry'&&norm(q.name)===norm(g.name));
  openPanelHTML(`<div class="peyebrow">Locked industry &middot; NAICS ${esc(g.naics)}</div><div class="ptitle">${esc(g.name)}</div>
    <div class="pcell">A ${esc(g.rel)} of <b>${esc(t?t.name:g.target)}</b>. It unlocks when a daily run maps it.</div>
    ${queued?'<div class="pcell"><span class="badge ord">queued</span> Next in line.</div>':`<div class="btns"><button class="btn" onclick="queueIndustry('${esc(g.name).replace(/'/g,"\\'")}')">Queue this industry</button></div>`}`);
}
function openAddCompany(indId){
  const i=IND[indId];
  openPanelHTML(`<button class="plink" onclick="openIndustry('${esc(indId)}')">&larr; ${esc(i.name)}</button><div class="peyebrow">Stake a lot</div><div class="ptitle">Add a company to ${esc(i.name)}</div>
    <div class="pcell">Name a company that belongs here and isn't listed. The next run checks it belongs; if it belongs elsewhere, it says where.</div>
    <input id="addname" class="qinput" style="width:100%;margin:6px 0" placeholder="Company name" aria-label="Company name">
    <div class="btns"><button class="btn" onclick="submitAdd('${esc(indId)}','teardown')">Order teardown</button><button class="btn ghost" onclick="submitAdd('${esc(indId)}','buildout')">Order buildout</button></div>`);
  setTimeout(()=>{const el=document.getElementById('addname');if(el)el.focus();},300);
}
function openOthers(indId){
  const i=IND[indId], cov=coverage(i,sizing(i));
  const unsized=i.companies.filter(c=>typeof c.share_pct!=='number').map(c=>c.name);
  openPanelHTML(`<button class="plink" onclick="openIndustry('${esc(indId)}')">&larr; ${esc(i.name)}</button><div class="peyebrow">Rest of the market</div><div class="ptitle">All others</div>
    <div class="pcell"><div class="big">${(Math.round(cov.rest*10)/10)}%</div><div class="note">The share of ${esc(i.name.toLowerCase())} not held by the companies with published shares above.${unsized.length?' It includes '+esc(unsized.join(', '))+', whose shares aren\'t published.':''}</div><div class="note">A small block means a few firms own the market. A big block means it is spread across many.</div></div>`);
}
function openStaked(indId,name){
  const i=IND[indId];
  openPanelHTML(`<button class="plink" onclick="openIndustry('${esc(indId)}')">&larr; ${esc(i.name)}</button><div class="peyebrow">Ordered</div><div class="ptitle">${esc(name)}</div><div class="pcell"><span class="badge ord">crane on site</span> The next daily run checks it belongs in ${esc(i.name)}, then builds its teardown.</div>`);
}

/* teardown renderer, carried over from v2 (tolerant of drift) */
function renderEntry(e){
  const ident=e.identity||e, en=e.engine||{}, ec=e.economics_lens, r=e.recall||{}; let h='';
  h+=`<div class="pmeta">${ident.sector?`<span>${esc(ident.sector)}</span>`:''}${ident.geography?`<span>${esc(ident.geography)}</span>`:''}${ident.era?`<span>${esc(ident.era)}</span>`:''}</div>`;
  if(e.one_line)h+=`<div class="poneline">${esc(e.one_line)}</div>`;
  if(en.the_spread)h+=`<div class="pband"><div class="eq">${esc(en.the_spread)}</div>${en.leverage_point?`<div class="lev"><b>Leverage:</b> ${esc(en.leverage_point)}</div>`:''}</div>`;
  if(e.why_now)h+=`<div class="psec">Why now</div><div class="pcell">${esc(e.why_now)}</div>`;
  if(e.structural_gap)h+=`<div class="psec">The gap</div><div class="pcell">${esc(e.structural_gap)}</div>`;
  if(Array.isArray(e.money_stack))h+=`<div class="psec">The money stack</div><div class="pcell">`+e.money_stack.map(s=>`<div class="stk"><div class="sl">${esc(s.layer)}</div><div class="sr">${esc(s.price_range||'')}</div></div>`).join('')+`</div>`;
  if(Array.isArray(e.plays)&&e.plays.length)h+=`<div class="psec">The plays</div>`+e.plays.map(p=>`<div class="pplay"><div class="nm">${esc(p.play_name)}</div><div class="tg">${esc(p.tagline||'')}</div><div class="mv">${esc(p.the_move||'')}</div>${Array.isArray(p.mechanics)?`<div class="pmech">${p.mechanics.map(m=>`<span class="pill">${esc(m)}</span>`).join('')}</div>`:''}</div>`).join('');
  if(Array.isArray(e.first_five_moves))h+=`<div class="psec">First moves</div>`+e.first_five_moves.map((m,k)=>`<div class="mv-item"><span class="mv-n">${k+1}</span><span>${esc(m)}</span></div>`).join('');
  if(ec)h+=`<div class="psec">Economics lens</div><div class="pecon"><b>${esc(ec.concept||'')}</b><p style="font-size:13px;color:var(--muted);margin-top:6px">${esc(ec.explain||'')}</p></div>`;
  if(r.glyph_prompt)h+=`<div class="psec">Picture this</div><div class="pglyph"><p>${esc(r.glyph_prompt)}</p></div>`;
  return h;
}

/* ===================== queue ===================== */
function lsGet(){try{return JSON.parse(localStorage.getItem('atlas_queue_v3')||'[]');}catch(_){return[];}}
function lsSet(a){try{localStorage.setItem('atlas_queue_v3',JSON.stringify(a));}catch(_){}}
function parseTitle(t){
  t=(t||'').trim(); let m;
  if((m=t.match(/^queue:\s*company:\s*([^|]+?)\s*\|\s*industry:\s*([^|]+?)\s*(?:\|\s*mode:\s*(\w+))?\s*$/i)))return {kind:'company',name:m[1],industry:m[2].trim(),mode:(m[3]||'teardown').toLowerCase()};
  if((m=t.match(/^queue:\s*industry:\s*(.+)$/i)))return {kind:'industry',name:m[1].trim()};
  if((m=t.match(/^queue:\s*(.+)$/i)))return {kind:'legacy',name:m[1].trim()};
  return null;
}
const titleFor=q=>q.kind==='company'?`queue: company: ${q.name} | industry: ${q.industry} | mode: ${q.mode}`:`queue: industry: ${q.name}`;
async function loadQueue(){
  let issues=[];
  try{const r=await fetch('https://api.github.com/repos/'+REPO+'/issues?state=open&sort=created&direction=asc&per_page=100',{cache:'no-store'});
    if(r.ok){const d=await r.json();issues=d.filter(x=>!x.pull_request).map(x=>parseTitle(x.title)).filter(Boolean).map(q=>({...q,source:'issue'}));}}catch(_){}
  const seen=new Set(issues.map(titleFor));
  const builtCo=(q)=>q.kind==='company'&&IND[q.industry]&&IND[q.industry].companies.some(c=>norm(c.name)===norm(q.name)&&studied(c));
  const builtInd=(q)=>q.kind==='industry'&&Object.values(IND).some(i=>norm(i.name)===norm(q.name));
  const local=lsGet().filter(q=>!seen.has(titleFor(q))&&!builtCo(q)&&!builtInd(q));
  lsSet(local);
  QUEUE=[...issues.filter(q=>!builtCo(q)&&!builtInd(q)),...local.map(q=>({...q,source:'local'}))];
  renderQueueList(); route(true);
}
function renderQueueList(){
  const box=document.getElementById('qlist');
  if(!QUEUE.length){box.innerHTML='<div class="qempty">Nothing queued.</div>';return;}
  box.innerHTML=QUEUE.map(q=>`<span class="qchip">${q.kind==='company'?'&#127959; ':'&#9203; '}${esc(q.name)}${q.kind==='company'&&IND[q.industry]?' <span style="opacity:.6">· '+esc(IND[q.industry].name)+'</span>':''}${q.source==='local'?' <span style="opacity:.55">(confirm on GitHub)</span>':''}</span>`).join('');
}
function fileIssue(q){
  const l=lsGet(); if(!l.some(x=>titleFor(x)===titleFor(q))){l.push(q);lsSet(l);}
  const body=q.kind==='company'?`Requested from the Machine Atlas map: a ${q.mode} of ${q.name} in the ${q.industry} district.`:`Requested from the Machine Atlas map: map the ${q.name} industry next.`;
  const url='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent(titleFor(q))+'&body='+encodeURIComponent(body);
  try{window.open(url,'_blank','noopener');}catch(_){}
  QUEUE.push({...q,source:'local'}); renderQueueList(); route(true);
}
function orderCompany(indId,idx,mode){const co=IND[indId].companies[idx];fileIssue({kind:'company',name:co.name,industry:indId,mode});openCompany(indId,idx);}
function submitAdd(indId,mode){const el=document.getElementById('addname');const n=(el&&el.value||'').trim();if(!n)return;fileIssue({kind:'company',name:n,industry:indId,mode});openStaked(indId,n);}
function queueIndustry(name){fileIssue({kind:'industry',name});closePanel();}
let QMODE='industry';
function setQMode(m){
  QMODE=m; document.getElementById('qm-ind').classList.toggle('active',m==='industry'); document.getElementById('qm-co').classList.toggle('active',m==='company');
  const sel=document.getElementById('qind'); sel.style.display=m==='company'?'block':'none';
  document.getElementById('qinput').placeholder=m==='company'?'Company name, e.g. Intel':'Industry, e.g. Electric power';
  document.getElementById('qnote').textContent=m==='company'?'Orders a teardown. A crane appears on its lot. Opens a GitHub issue to confirm.':'Maps a new industry, its suppliers, customers and top companies. Opens a GitHub issue to confirm.';
}
function submitQueueBox(){
  const inp=document.getElementById('qinput'), t=(inp.value||'').trim(); if(!t)return;
  if(QMODE==='company'){const ind=document.getElementById('qind').value;fileIssue({kind:'company',name:t,industry:ind,mode:'teardown'});}
  else fileIssue({kind:'industry',name:t});
  inp.value='';
}
document.getElementById('qinput').addEventListener('keydown',e=>{if(e.key==='Enter')submitQueueBox();});
function toggleQueueBox(){const b=document.getElementById('queuebox');b.classList.toggle('collapsed');const c=b.classList.contains('collapsed');document.getElementById('qcaret').innerHTML=c?'+':'&minus;';document.getElementById('qtoggle').setAttribute('aria-expanded',String(!c));}

/* ===================== routing ===================== */
let CUR=null, DIST_RESERVE=0;
function goCity(){location.hash='#/';}
function route(keepPanel){
  const m=location.hash.match(/^#\/industry\/([\w-]+)/);
  const id=m&&IND[m[1]]?m[1]:null, changed=CUR!==id; CUR=id;
  document.getElementById('back').style.display=id?'inline-block':'none';
  if(!id)document.getElementById('crumb').textContent='';
  document.getElementById('qind').value=id||document.getElementById('qind').value;
  if(changed&&id)setQMode('company'); else if(changed)setQMode('industry');
  const saved={...VIEW};
  if(id){const willOpen=changed&&!keepPanel&&VB().w>900; DIST_RESERVE=(willOpen||panelReserve())&&VB().w>900?520:0;
    renderDistrict(id); if(willOpen)openIndustry(id); else if(changed)closePanel();}
  else{renderCity(); if(changed)closePanel();}
  if(!changed){VIEW=saved;applyCam();}
}
window.addEventListener('hashchange',()=>route(false));

(async function(){
  try{await loadAll();}catch(err){document.getElementById('svg').innerHTML=`<text x="800" y="500" fill="#8A9099" text-anchor="middle" font-family="monospace">Could not load the map data (${esc(err.message)}).</text>`;return;}
  const sel=document.getElementById('qind');
  sel.innerHTML=Object.values(IND).map(i=>`<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('');
  if(window.innerWidth<700)toggleQueueBox();
  setQMode('industry'); CUR=undefined; route(false); loadQueue();
})();
</script>
