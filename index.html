ook at who's a close second.)", "OpenAI sits at the bottom of the chain nvidia -> coreweave -> openai as the demand everyone above is betting on. Explain 'circular financing' here -- and why it makes that demand look bigger and safer than it may be."]}, "economics_lens": {"concept": "Blitzscaling: loss-leader pricing to capture increasing returns (scale, data, and learning-curve effects) -- and the derived demand (accelerator principle) that keystones a whole supply chain", "micro_or_macro": "both", "explain": "Micro: OpenAI is a textbook loss-leader played at civilizational scale. It prices a product below cost to acquire a winner-take-most market, betting on increasing returns to adoption -- more users produce more data and brand gravity, which improve the product and raise switching costs -- combined with a learning/experience curve where the cost to deliver a unit of capability falls as cumulative output rises. If cost-per-token drops faster than the subsidy compounds, the intertemporal trade works: lose money now to own a toll later. The danger is that inference cost scales with free usage, so adoption itself burns cash until pricing power or efficiency arrives, and if frontier capability commoditizes (cheap open-weight rivals), the moat collapses to distribution alone. Macro: OpenAI is the clearest live example of the accelerator principle and derived demand. Its appetite for compute is the demand that justifies CoreWeave's debt, NVIDIA's margins, and TSMC's capex -- so a change in OpenAI's growth rate is amplified as it propagates up the chain. That linkage is what makes the AI buildout both a flywheel and a potential bubble: when the demand at the bottom is partly validated by the suppliers who also finance it (circular financing), the whole structure can look sturdier than independent end-demand would justify, and a shortfall at OpenAI would run the accelerator backward all the way to the furnace."}, "scale": {"value_usd": 70000000000.0, "display": "~$70B run-rate", "metric": "annualized recurring revenue", "period": "reported Sep 29, 2026", "basis": "company (run-rate, forward-looking)", "confidence": "medium", "source_url": "https://www.thestar.com.my/tech/tech-news/2026/09/29/openai039s-annual-recurring-revenue-nears-70-billion-axios-reports", "note": "Anonymous-source report (Axios, then Reuters). A separate FT report put the run rate nearer $50B, so treat as a range.", "as_of_date": "2026-11-21"}}, {"id": "banking-retail", "name": "Retail Banking", "aka": ["commercial banking", "depository institution"], "sector": "Financial services", "geography": "Global; figures skew US", "era": "Modern form since ~17th c. goldsmith-bankers; deposit banking much older", "mode": "teardown", "date_walked": "2026-07-26", "chain": {"parent_id": null, "relation": "seed", "relation_note": "First entry in the Atlas. The chain grows from here.", "chain_position": 0, "suggested_next": [{"id": "core-banking-software", "relation": "upstream_supplier", "why": "The software rails every bank runs on — who sells the picks and shovels?"}, {"id": "payment-networks", "relation": "symbiote", "why": "Visa/Mastercard sit on the same money flow and run a pure toll-booth."}, {"id": "insurance-underwriting", "relation": "substitute", "why": "Same 'float' mechanic as deposits, different wrapper — the first cross-link."}]}, "one_line": "Buy money cheap from depositors, sell it dear to borrowers, and live on the gap.", "engine": {"inputs": "Deposits — other people's money, entrusted cheaply", "transformation": "Pools deposits, holds a fraction as capital, lends the rest out many times over", "outputs": "Loans — the same money, sold as credit at a higher rate", "money_in": "Interest and fees from borrowers; card, account and overdraft fees", "money_out": "Interest paid to depositors; operating cost; loan losses", "the_spread": "loan rate − deposit rate  (the Net Interest Margin)", "leverage_point": "Hold ~10% as capital, lend the rest — roughly 10× the capital base"}, "unit": {"unit_name": "One dollar of deposits", "unit_economics": "A dollar deposited at ~0.5% funds a loan at ~7%; the ~6.5pt gross spread, minus losses and cost, is the margin. Figures illustrative.", "what_one_unit_produces": "Not just interest — a customer relationship that can be cross-sold cards, mortgages, and advice at higher margin."}, "plays": [{"play_name": "Margin Lag", "tagline": "Raise loan rates fast. Raise deposit rates slow.", "flow": [{"step_title": "Fed hikes", "step_desc": "The central bank raises rates."}, {"step_title": "Speed gap", "step_desc": "Loan rates jump the same day; deposit rates crawl up over months."}, {"step_title": "The lag = profit", "step_desc": "The bank keeps the widening gap before it has to pass raises on."}], "the_move": "Loans reprice at a sprint; deposits reprice at a walk. The delay itself is the money.", "in_the_wild": "In the 2022–23 hiking cycle, US loan yields rose faster than deposit costs — 'loan betas beat deposit betas' — fattening margins until deposit costs caught up.", "watch_out": "Eventually depositors demand their raise. Margins peak, then compress.", "glyph_id": "marginlag", "mechanics": ["spread", "capital-cycle", "arbitrage"]}, {"play_name": "Fee Fortress", "tagline": "Boring rates. The real money leaks in from the sides.", "flow": [{"step_title": "Thin spread", "step_desc": "Headline rates are unremarkable — nothing to see."}, {"step_title": "Fee streams", "step_desc": "Overdraft, account, ATM, card and wire fees pour in from every side."}, {"step_title": "Moat fills", "step_desc": "Non-interest income becomes the profit engine, not the spread."}], "the_move": "Don't win on the spread — win on the fine print. Dozens of small fees fill the moat.", "in_the_wild": "US retail banking has historically drawn a large share of revenue from non-interest income — fees small and frequent enough that customers barely notice them adding up.", "watch_out": "Fee income is politically fragile — regulators love to cap overdraft and 'junk' fees.", "glyph_id": "feefortress", "mechanics": ["toll-booth", "bundling", "information-asymmetry"]}, {"play_name": "Niche Play", "tagline": "Own one narrow lane. Charge a premium for the expertise.", "flow": [{"step_title": "Pick one target", "step_desc": "Auto loans, small-business, equipment leasing — one segment, deeply known."}, {"step_title": "Specialist edge", "step_desc": "Underwrite risk competitors can't read; lend where they won't."}, {"step_title": "Premium rate", "step_desc": "Charge more because you understand the borrower better than anyone."}], "the_move": "Skip the scale war. Go an inch wide and a mile deep, and price the expertise.", "in_the_wild": "Community banks lean on this — accepting higher risk on borrowers they personally know in exchange for higher yield.", "watch_out": "Concentration. If your one lane hits a pothole, the whole book feels it.", "glyph_id": "nicheplay", "mechanics": ["information-asymmetry", "brand-premium", "adverse-selection"]}, {"play_name": "Deposit Rush", "tagline": "Outbid everyone on savings. Pull cash in fast, then deploy.", "flow": [{"step_title": "High-yield magnet", "step_desc": "Post a top-of-market savings or CD rate."}, {"step_title": "Liquidity floods in", "step_desc": "Cash arrives faster than organic growth ever could."}, {"step_title": "Deploy the cash", "step_desc": "Turn funding into higher-yielding loans and earn the spread."}], "the_move": "Buy funding aggressively when you need liquidity now — speed over cost.", "in_the_wild": "Post-pandemic, national high-yield platforms let banks vacuum up deposits with a rate — but that funding is 'hot': it chases the next best rate and leaves as fast.", "watch_out": "Rate-shoppers aren't loyal. Elevated deposit costs squeeze the very margin you chased.", "glyph_id": "depositrush", "mechanics": ["scarcity-manufacture", "capital-cycle", "spread"]}, {"play_name": "Cross-Sell Trap", "tagline": "One shiny product to get you in. Then bundle you in for life.", "flow": [{"step_title": "The lure", "step_desc": "A standout product — a high-yield savings account — gets you through the door."}, {"step_title": "The funnel", "step_desc": "Checking, card, mortgage, investments — bundled with relationship pricing."}, {"step_title": "Stickiness", "step_desc": "Each added product makes leaving costlier; you stop shopping around."}], "the_move": "The rate is bait. The profit is everything they sell you afterward.", "in_the_wild": "A standard tactic: tie every new loan to a household checking account — integrated bundles cut churn and lock in the relationship.", "watch_out": "For the customer: convenience quietly costs the best rate on each individual product. For the bank: aggressive cross-sell can tip into scandal (see Wells Fargo).", "glyph_id": "crosssell", "mechanics": ["loss-leader", "lock-in", "switching-cost", "bundling"]}], "mechanics_summary": [{"tag": "spread", "note": "Profit is the gap between a cheap input price and a dear output price."}, {"tag": "float", "note": "Hold other people's money in the gap between receiving and paying it out."}, {"tag": "capital-cycle", "note": "Leverage a thin capital base into a large asset book; regulated by ratio."}, {"tag": "lock-in", "note": "Make leaving costlier than staying."}, {"tag": "loss-leader", "note": "Lose on the lure to win on everything sold after it."}, {"tag": "toll-booth", "note": "Sit on a flow and charge a small fee each time value passes."}], "history": {"origin": {"who": "London goldsmith-bankers", "when": "17th century", "what_problem_forced_it": "Merchants needed somewhere safe to store gold. Goldsmiths issued paper receipts for deposits; when they noticed not everyone withdrew at once, they began lending out receipts against gold they held — inventing fractional-reserve lending and, with it, the spread."}, "operator": {"name": "A. P. Giannini, Bank of Italy / Bank of America", "what_they_did": "Opened banking to working-class immigrants ignored by elite banks in early-1900s San Francisco; lent on character and small deposits, and famously lent to rebuild after the 1906 earthquake. Turned the 'underserved, not unworthy' niche into the largest bank in the country.", "outcome": "Bank of America became, for a time, the world's largest commercial bank."}, "counterexample": {"name": "Wells Fargo cross-sell scandal (2016)", "what_they_did": "Pushed the Cross-Sell Trap past the line — employees under quota pressure opened millions of accounts customers never authorized.", "why_it_broke": "The play depends on customer trust; manufacturing fake demand destroyed it, drew billions in fines, and capped the bank's growth by regulators for years."}}, "epistemics": {"numbers": [{"label": "Capital ratio (illustrative)", "value": "~10", "unit": "%", "source_url": "https://www.bis.org/bcbs/basel3.htm", "as_of_date": "2026-07-26", "confidence": "ballpark"}, {"label": "Illustrative gross spread", "value": "~6.5", "unit": "pts", "source_url": null, "as_of_date": "2026-07-26", "confidence": "illustrative"}], "confidence": "ballpark", "unknowns": ["Exact current NIM varies widely by bank, year, and rate environment — not pinned here.", "Non-interest income share differs by institution; stated only as 'a large share'.", "Deposit/loan beta figures for 2022–23 are directional, not sourced to a specific filing in this entry."]}, "recall": {"glyph_prompt": "Picture two arrows off the same starting line: the loan arrow shoots up fast, the deposit arrow crawls. The widening wedge between them is the profit.", "three_questions": ["Where does a bank's money come in, and where does it go out?", "What single equation is the whole business? (loan rate − deposit rate)", "Name two ways a bank widens or defends that spread."], "last_reviewed": null, "next_review": null, "ease": null}, "scale": {"value_usd": 1076000000000.0, "display": "~$1.08T", "metric": "net operating revenue of all FDIC-insured US banks", "period": "calendar 2025", "ba /* tolerant accessors */
const ident=e=>(e&&e.identity)?e.identity:(e||{});

const gsec=e=>ident(e).sector||'', ggeo=e=>ident(e).geography||'', gera=e=>ident(e).era||'', gdate=e=>ident(e).date_walked||'';

const bizKey=e=>gname(e).toLowerCase().replace(/\s+/g,' ').trim();

function regionOf(e){
  const s=(gsec(e)+' '+gname(e)).toLowerCase();
  if(/communit|conven|ecosystem|club|social|builder/.test(s)) return 'Community';
  if(/financ|bank|payment|insur|lend|credit/.test(s)) return 'Finance';
  if(/semiconduct|chip|cloud|compute|foundry|gpu|data cent|silicon|\bit\b/.test(s)) return 'Compute & Silicon';
  if(/retail|consumer|commerce|store|marketplace/.test(s)) return 'Commerce';
  if(/media|content|\bad\b|entertain/.test(s)) return 'Media';
  return gsec(e).split('/')[0].trim() || 'Frontier';
}

/* ---- build business nodes: merge teardown+buildout of the same business ---- */
function buildNodes(list){
  const nodes={}, idToKey={};
  list.forEach(e=>{idToKey[gid(e)]=bizKey(e);});
  list.forEach(e=>{
    const k=bizKey(e);
    const n=nodes[k]||(nodes[k]={key:k,name:gname(e),region:regionOf(e),teardown:null,buildout:null,ids:[]});
    if(gmode(e)==='buildout') n.buildout=e; else n.teardown=e;
    n.ids.push(gid(e));
    n.repr=n.teardown||n.buildout;
    n.region=regionOf(n.repr);
  });
  return {nodes:Object.values(nodes), idToKey};
}

/* isometric */
const TW=58, TH=29;
const iso=(gx,gy)=>({x:(gx-gy)*TW,y:(gx+gy)*TH});

function layout(){
  const {nodes,idToKey}=buildNodes(ENTRIES);
  const byRegion={}; nodes.forEach(n=>{(byRegion[n.region]=byRegion[n.region]||[]).push(n);});
  const regNames=Object.keys(byRegion);
  const metaSpots=[[0,0],[8,1],[1,9],[9,10],[16,2],[2,16],[16,16],[8,17]];
  const placed={}, regionBounds={}, ghostPlots=[];
  const existingKeys=new Set(nodes.map(n=>n.key));
  const existingIds=new Set(ENTRIES.map(gid));
  regNames.forEach((rn,ri)=>{
    const [mx,my]=metaSpots[ri%metaSpots.length];
    const items=byRegion[rn]; const cols=Math.ceil(Math.sqrt(items.length));
    const gxs=[],gys=[];
    items.forEach((n,i)=>{const cx=mx+(i%cols)*2, cy=my+Math.floor(i/cols)*2;placed[n.key]={gx:cx,gy:cy,node:n};gxs.push(cx);gys.push(cy);});
    regionBounds[rn]={x0:Math.min(...gxs)-1,y0:Math.min(...gys)-1,x1:Math.max(...gxs)+1,y1:Math.max(...gys)+1,color:regColor(rn)};
  });
  // ghosts: suggested_next targets not yet built
  const seen=new Set();
  ENTRIES.forEach(e=>{
    const fromKey=bizKey(e), sn=(e.chain&&e.chain.suggested_next)||[];
    sn.forEach((s,i)=>{
      if(!s.id||existingIds.has(s.id)||seen.has(s.id))return; seen.add(s.id);
      const p=placed[fromKey]; if(!p)return;
      ghostPlots.push({id:s.id,gx:p.gx+(i===0?2:i===1?0:-2),gy:p.gy+(i===0?2:i===1?3:2),from:fromKey,rel:s.relation||''});
    });
  });
  return {placed,regionBounds,ghostPlots,idToKey,existingKeys};
}

  if(region==='Commerce') // bag
    return `<g><path d="M${x-5},${y-3} L${x+5},${y-3} L${x+6},${y+6} L${x-6},${y+6} Z" ${s}/><path d="M${x-3},${y-3} Q${x-3},${y-7} ${x},${y-7} Q${x+3},${y-7} ${x+3},${y-3}" ${s}/></g>`;
  if(region==='Media') // play
    return `<path d="M${x-4},${y-6} L${x+6},${y} L${x-4},${y+6} Z" ${s}/>`;
  return `<path d="M${x},${y-6} L${x+6},${y} L${x},${y+6} L${x-6},${y} Z" ${s}/>`; // diamond
}

let VIEW={x:0,y:0,s:1};
/* building height = economic stature, bounded [50,140]px.
   1) SCALE drives the skyline (95%): annual revenue from entry.scale.value_usd.
      height ~ revenue^0.3 against a fixed $1T reference, so every 10x in revenue
      roughly doubles the height. Fixed reference = buildings never shrink when a
      bigger one arrives (a true scale model). $1T+ hits the cap.
   2) SOPHISTICATION breaks ties (5%, worth ~4px max): distinct plays (x3) +
      distinct play-level mechanics (capped 30), spread over [4..54]. Enough to
      order near-equal revenues, never enough to overturn a real size gap.
   No scale data -> sophistication only, held to <= ~95px so an unsized entry can
   never outrank a sized giant. Everything clamped; JSON drift cannot break it. */
function scaleUSD(e){
  const s=e&&e.scale;
  if(typeof s==='number'&&s>0) return s;
  if(s&&typeof s==='object'){for(const k of ['value_usd','revenue_usd','annual_revenue_usd','usd']){const v=s[k];if(typeof v==='number'&&v>0)return v;}}
  return 0;
}
function sophistication(e){
  const plays=Array.isArray(e.plays)?e.plays.length:0;
  const mset=new Set();
  (Array.isArray(e.plays)?e.plays:[]).forEach(p=>{(Array.isArray(p.mechanics)?p.mechanics:[]).forEach(m=>{if(typeof m==='string')mset.add(m.toLowerCase());});});
  let mech=mset.size;
  if(mech===0 && Array.isArray(e.mechanics_summary)) mech=e.mechanics_summary.filter(x=>x&&(typeof x==='object'||typeof x==='string')).length;
  return Math.max(0,Math.min(1,(plays*3+Math.min(mech,30)-4)/50));
}
function buildingHeight(e){
  const HMIN=50,HMAX=140,REF=1e12,P=0.3;
  const usd=scaleUSD(e), c=sophistication(e);
  const t = usd>0 ? 0.95*Math.min(1,Math.pow(usd/REF,P)) + 0.05*c : 0.5*c;
  return Math.round(HMIN+Math.max(0,Math.min(1,t))*(HMAX-HMIN));
}
function buildWorld(){
  const svg=document.getElementById('svg');
  const L=layout();
  const parts=[];
  const ROADS=[];
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  const cells=[...Object.values(L.placed).map(p=>({gx:p.gx,gy:p.gy})),...L.ghostPlots];
  cells.forEach(c=>{const {x,y}=iso(c.gx,c.gy);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  const OX=800-(minX+maxX)/2, OY=450-(minY+maxY)/2;
  const P=(gx,gy)=>{const {x,y}=iso(gx,gy);return {x:x+OX,y:y+OY};};

  // territory platforms
  Object.entries(L.regionBounds).forEach(([rn,b])=>{
    const c=b.color, cor=[P(b.x0,b.y0),P(b.x1,b.y0),P(b.x1,b.y1),P(b.x0,b.y1)];
    parts.push(`<path d="M${cor[0].x},${cor[0].y} L${cor[1].x},${cor[1].y} L${cor[2].x},${cor[2].y} L${cor[3].x},${cor[3].y} Z" fill="${c.zone}" stroke="${c.top}" stroke-opacity="0.5" stroke-width="1.5"/>`);
    const ex=10;
    parts.push(`<path d="M${cor[3].x},${cor[3].y} L${cor[2].x},${cor[2].y} L${cor[2].x},${cor[2].y+ex} L${cor[3].x},${cor[3].y+ex} Z" fill="${c.r}" fill-opacity="0.5"/>`);
    const tl=P((b.x0+b.x1)/2,b.y1+0.5);
    parts.push(`<text class="terr-lbl" x="${tl.x}" y="${tl.y+16}" fill="${c.top}">${esc(rn)}</text>`);
    for(let e=0;e<4;e++){const a=cor[e],d=cor[(e+1)%4];ROADS.push({ax:a.x,ay:a.y,bx:d.x,by:d.y});}
  });

  // roads
  function road(aKey,bKey,st){const A=L.placed[aKey],B=L.placed[bKey];if(!A||!B||aKey===bKey)return;const pa=P(A.gx,A.gy),pb=P(B.gx,B.gy);parts.push(`<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="${st.c}" stroke-width="${st.w}" stroke-dasharray="${st.d||''}" stroke-opacity="${st.o||0.6}" stroke-linecap="round"/>`);ROADS.push({ax:pa.x,ay:pa.y,bx:pb.x,by:pb.y});}
  ENTRIES.forEach(e=>{
    const pid=(e.chain||{}).parent_id;
    if(pid&&L.idToKey[pid]) road(L.idToKey[pid],bizKey(e),{c:'#C6F24E',w:3,o:0.5});
    ((e.chain&&e.chain.suggested_next)||[]).forEach(s=>{if(s.id&&L.idToKey[s.id]) road(bizKey(e),L.idToKey[s.id],{c:'#5B8BD4',w:2,d:'2 6',o:0.45});});
  });
  L.ghostPlots.forEach(g=>{const A=L.placed[g.from];if(!A)return;const pa=P(A.gx,A.gy),pb=P(g.gx,g.gy);parts.push(`<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="#59606A" stroke-width="2" stroke-dasharray="2 7" stroke-opacity="0.45"/>`);});

  // ghost plots
  L.ghostPlots.forEach(g=>{const c=P(g.gx,g.gy);parts.push(`<path d="${diamond(c.x,c.y,TW*0.8,TH*0.8)}" fill="#10151C" fill-opacity="0.6" stroke="#3A4250" stroke-width="1.5" stroke-dasharray="4 4"/>`);parts.push(`<text class="lbl lbl-ghost" x="${c.x}" y="${c.y-3}">&#128274; ${esc(g.id)}</text><text class="lbl lbl-ghost" x="${c.x}" y="${c.y+10}" style="font-size:8px">locked</text>`);});

  // buildings (back to front)
  const order=Object.values(L.placed).sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy));
  const dates=ENTRIES.map(gdate).filter(Boolean).sort(); const newest=dates[dates.length-1];
  order.forEach(p=>{
    const n=p.node, c=P(p.gx,p.gy), reg=regColor(n.region);
    const H=buildingHeight(n.repr);                     // bounded [50,140]px, drift-proof
    const bw=TW*0.72, bh=TH*0.72;
    const hasT=!!n.teardown, hasB=!!n.buildout, planOnly=!hasT&&hasB;
    drawBuilding(parts,c.x,c.y,bw,bh,H,reg,planOnly,hasT&&hasB,n.region,n.key);
    parts.push(`<text class="lbl" x="${c.x}" y="${c.y-H-9}">${esc(n.name)}</text>`);
    const nd=Math.max(...n.ids.map(id=>{const e=ENTRIES.find(x=>gid(x)===id);return gdate(e)||'';}));
    if(nd===newest && ENTRIES.length>1) parts.push(`<g class="glow"><rect x="${c.x+8}" y="${c.y-H-32}" width="36" height="14" rx="3" fill="#C6F24E"/><text class="newflag" x="${c.x+26}" y="${c.y-H-22}">NEW</text></g>`);
  });

  svg.innerHTML=`<defs><radialGradient id="fog" cx="50%" cy="44%" r="64%"><stop offset="58%" stop-color="#0A0C10" stop-opacity="0"/><stop offset="100%" stop-color="#0A0C10" stop-opacity="0.9"/></radialGradient></defs>
    <g id="cam">${parts.join('')}</g>
    <rect x="0" y="0" width="1600" height="1000" fill="url(#fog)" pointer-events="none"/>`;
  svg.querySelectorAll('.bld').forEach(g=>g.addEventListener('click',()=>openPanel(g.getAttribute('data-key'))));
  startTraffic(ROADS);
  const nNodes=Object.keys(L.placed).length;
  document.getElementById('counter').innerHTML=`<b>${nNodes}</b> businesses mapped · <b>${L.ghostPlots.length}</b> plots to unlock`;
  applyCam();
}
function diamond(x,y,w,h){return `M${x},${y-h} L${x+w},${y} L${x},${y+h} L${x-w},${y} Z`;}

/* facade windows: tile small quads across an isometric face */
function fwin(ox,oy,ux,uy,vx,vy,cols,rows,key,face,litColor){
  let s=''; const su=0.60/cols, sv=0.50/rows, hu=su/2, hv=sv/2;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const cu=(i+0.5)/cols, cv=(j+0.5)/rows, cx=ox+ux*cu+vx*cv, cy=oy+uy*cu+vy*cv;
    const pt=(du,dv)=>`${(cx+ux*du+vx*dv).toFixed(1)},${(cy+uy*du+vy*dv).toFixed(1)}`;
    let hsh=0; const str=key+face+i+'x'+j; for(const c of str)hsh=(hsh*31+c.charCodeAt(0))>>>0;
    const lit=(hsh%100)<22;
    s+=`<polygon points="${pt(-hu,-hv)} ${pt(hu,-hv)} ${pt(hu,hv)} ${pt(-hu,hv)}" fill="${lit?litColor:'#223247'}" fill-opacity="${lit?0.95:0.5}"/>`;
  }
  return s;
}
let trafficRAF=null;
function startTraffic(roads){
  if(trafficRAF)cancelAnimationFrame(trafficRAF);
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cam=document.getElementById('cam'); if(!cam)return;
  const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('id','traffic'); cam.appendChild(g);
  const cars=[];
  roads.forEach(r=>{
    const len=Math.hypot(r.bx-r.ax,r.by-r.ay); const ang=Math.atan2(r.by-r.ay,r.bx-r.ax)*180/Math.PI;
    const n=len>150?2:1;
    for(let k=0;k<n;k++){
      const el=document.createElementNS('http://www.w3.org/2000/svg','rect');
      el.setAttribute('width','3.6');el.setAttribute('height','2.1');el.setAttribute('rx','0.8');
      el.setAttribute('fill',Math.random()<0.5?'#F4DCA6':'#CFE6FF');el.setAttribute('fill-opacity','0.9');
      g.appendChild(el);
      cars.push({el,r,ang,t:Math.random(),speed:0.028+Math.random()*0.03,dir:Math.random()<0.5?1:-1});
    }
  });
  function place(c){const px=c.r.ax+(c.r.bx-c.r.ax)*c.t, py=c.r.ay+(c.r.by-c.r.ay)*c.t; c.el.setAttribute('transform',`translate(${px-1.8},${py-1.05}) rotate(${c.ang},1.8,1.05)`);}
  if(reduce){cars.forEach(place);return;}
  let last=performance.now();
  function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
    cars.forEach(c=>{c.t+=c.speed*dt*c.dir; if(c.t>1)c.t-=1; if(c.t<0)c.t+=1; place(c);});
    trafficRAF=requestAnimationFrame(frame);
  }
  trafficRAF=requestAnimationFrame(frame);
}

function drawBuilding(parts,x,y,w,h,H,col,planOnly,bothSides,region,key){
  const topY=y-H;
  const top=`M${x},${topY-h} L${x+w},${topY} L${x},${topY+h} L${x-w},${topY} Z`;
  const left=`M${x-w},${topY} L${x},${topY+h} L${x},${y+h} L${x-w},${y} Z`;
  const right=`M${x+w},${topY} L${x},${topY+h} L${x},${y+h} L${x+w},${y} Z`;
  const dash=planOnly?'stroke-dasharray="3 3"':'';
  // soft ground shadow
  parts.push(`<ellipse cx="${x}" cy="${y+h+3}" rx="${w*0.95}" ry="${h*0.5}" fill="#000" fill-opacity="0.22"/>`);
  parts.push(`<g class="bld" data-key="${esc(key)}">
    <path class="b-l" d="${left}" fill="${col.l}" ${dash} stroke="#0A0C10" stroke-width="0.5"/>
    <path class="b-r" d="${right}" fill="${col.r}" ${dash} stroke="#0A0C10" stroke-width="0.5"/>
    ${planOnly?'':fwin(x-w,topY,w,h,0,H,3,Math.max(3,Math.min(11,Math.round(H/10))),key,'L','#F2C15A')}
    ${planOnly?'':fwin(x+w,topY,-w,h,0,H,3,Math.max(3,Math.min(11,Math.round(H/10))),key,'R','#E6B454')}
    <path class="b-top" d="${top}" fill="${col.top}" stroke="#0A0C10" stroke-width="0.6"/>
    ${roofIcon(region,x,topY)}
    ${bothSides?`<circle cx="${x+w-8}" cy="${topY}" r="3.2" fill="#E4A93A" stroke="#0A0C10" stroke-width="0.6"/>`:''}
  </g>`);
}

/* pan/zoom — gentler zoom */
function applyCam(){const g=document.getElementById('cam');if(g)g.setAttribute('transform',`translate(${VIEW.x},${VIEW.y}) scale(${VIEW.s})`);}
(function(){
  const stage=document.getElementById('stage'); let drag=null;
  stage.addEventListener('mousedown',e=>{if(e.target.closest('.bld'))return;drag={x:e.clientX,y:e.clientY,vx:VIEW.x,vy:VIEW.y};});
  window.addEventListener('mousemove',e=>{if(!drag)return;const k=1600/stage.clientWidth;VIEW.x=drag.vx+(e.clientX-drag.x)*k;VIEW.y=drag.vy+(e.clientY-drag.y)*k;applyCam();});
  window.addEventListener('mouseup',()=>drag=null);
  stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.045:0.957;VIEW.s=Math.max(0.5,Math.min(2.6,VIEW.s*f));applyCam();},{passive:false});
  let t0=null;
  stage.addEventListener('touchstart',e=>{if(e.touches.length===1&&!e.target.closest('.bld'))t0={x:e.touches[0].clientX,y:e.touches[0].clientY,vx:VIEW.x,vy:VIEW.y};});
  stage.addEventListener('touchmove',e=>{if(t0&&e.touches.length===1){const k=1600/stage.clientWidth;VIEW.x=t0.vx+(e.touches[0].clientX-t0.x)*k;VIEW.y=t0.vy+(e.touches[0].clientY-t0.y)*k;applyCam();}},{passive:true});
  stage.addEventListener('touchend',()=>t0=null);
})();

/* ---- panel: one business, flip teardown/buildout ---- */
let CURKEY=null;
function nodeByKey(k){return NODES.find(n=>n.key===k);}
function openPanel(key){
  const n=nodeByKey(key); if(!n)return; CURKEY=key;
  const side=n.teardown?'teardown':'buildout';
  renderPanel(n,side);
  document.getElementById('panel').classList.add('open');
}
function switchSide(side){const n=nodeByKey(CURKEY);if(n)renderPanel(n,side);}
function closePanel(){document.getElementById('panel').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});

function renderPanel(n,side){
  const e=(side==='buildout'?n.buildout:n.teardown)||n.repr;
  const both=n.teardown&&n.buildout;
  let h=`<button class="pclose" onclick="closePanel()">&#10005;</button>`;
  h+=`<div class="peyebrow">${esc(n.region)}${gdate(e)?' · '+esc(gdate(e)):''}</div>`;
  h+=`<div class="ptitle">${esc(n.name)}</div>`;
  if(both) h+=`<div class="toggle"><button class="tbtn ${side==='teardown'?'active':''}" onclick="switchSide('teardown')">Teardown</button><button class="tbtn ${side==='buildout'?'active':''}" onclick="switchSide('buildout')">Buildout</button></div>`;
  else if(n.buildout&&!n.teardown) h+=`<div class="peyebrow" style="color:var(--amber);margin-bottom:10px">BUILDOUT · how you'd start one</div>`;
  h+=renderEntry(e);
  document.getElementById('pwrap').innerHTML=h;
  document.getElementById('panel').scrollTop=0;
}

function renderEntry(e){
  const en=e.engine||{}, ec=econOf(e), r=e.recall||{}; let h='';
  h+=`<div class="pmeta">${gsec(e)?`<span>${esc(gsec(e))}</span>`:''}${ggeo(e)?`<span>${esc(ggeo(e))}</span>`:''}${gera(e)?`<span>${esc(gera(e))}</span>`:''}</div>`;
  if(e.one_line) h+=`<div class="poneline">${esc(e.one_line)}</div>`;
  {const sc=e.scale; if(sc&&typeof sc==='object'&&sc.display){h+=`<div class="psec">Scale <span style="font-weight:400;text-transform:none;letter-spacing:0">(sets the height)</span></div><div class="pcell"><b>${esc(sc.display)}</b> &middot; ${esc(sc.metric||'')}${sc.period?` &middot; ${esc(sc.period)}`:''}${sc.note?`<div style="color:var(--muted);font-size:12px;margin-top:4px">${esc(sc.note)}</div>`:''}${sc.source_url?`<div style="font-size:12px;margin-top:4px"><a href="${esc(sc.source_url)}" target="_blank" rel="noopener" style="color:var(--muted)">source</a></div>`:''}</div>`;}}
  if(en.the_spread) h+=`<div class="pband"><div class="eq">${esc(en.the_spread)}</div>${en.leverage_point?`<div class="lev"><b>Leverage:</b> ${esc(en.leverage_point)}</div>`:''}</div>`;
  if(e.why_now) h+=`<div class="psec">Why now</div><div class="pcell">${esc(e.why_now)}</div>`;
  if(e.structural_gap) h+=`<div class="psec">The gap</div><div class="pcell">${esc(e.structural_gap)}</div>`;
  if(Array.isArray(e.money_stack)){h+=`<div class="psec">The money stack</div><div class="pcell" style="padding-top:4px">`+e.money_stack.map(s=>`<div class="stk"><div class="sl">${esc(s.layer)}</div><div class="sr">${esc(s.price_range||'')}</div></div>`).join('')+`</div>`;}
  if(Array.isArray(e.plays)&&e.plays.length){
    h+=`<div class="psec">The plays</div>`+e.plays.map(p=>`<div class="pplay"><div class="nm">${esc(p.play_name)}</div><div class="tg">${esc(p.tagline||'')}</div><div class="mv">${esc(p.the_move||'')}</div>${Array.isArray(p.mechanics)?`<div class="pmech">${p.mechanics.map(m=>`<span class="pill">${esc(m)}</span>`).join('')}</div>`:''}</div>`).join('');
  }
  if(Array.isArray(e.first_five_moves)){h+=`<div class="psec">First moves</div>`+e.first_five_moves.map((m,i)=>`<div class="mv-item"><span class="mv-n">${i+1}</span><span>${esc(m)}</span></div>`).join('');}
  if(ec) h+=`<div class="psec">Economics lens</div><div class="pecon"><div class="c">${esc(ec.concept||'')}</div><p style="font-size:13px;color:var(--muted)">${esc(ec.explain||'')}</p></div>`;
  if(r.glyph_prompt) h+=`<div class="psec">Picture this</div><div class="pglyph"><p>${esc(r.glyph_prompt)}</p></div>`;
  const sn=(e.chain&&e.chain.suggested_next)||[]; const existing=new Set(ENTRIES.map(gid));
  if(sn.length){h+=`<div class="psec">Roads from here</div><div class="proad">`+sn.map(s=>{const lk=!existing.has(s.id);return `<div class="rchip ${lk?'locked':''}"><div class="r ${lk?'lk':''}">${lk?'&#128274; locked · ':''}${esc(s.relation||'')} → ${esc(s.id||'')}</div><div style="color:var(--muted);font-size:11px;margin-top:3px">${esc(s.why||'')}</div></div>`;}).join('')+`</div>`;}
  return h;
}


/* ---- queue: input -> GitHub issue -> daily run builds it next ---- */
const REPO='remllov13/machine-atlas';
function slugify(s){return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function lsGet(){try{return JSON.parse(localStorage.getItem('atlas_queue')||'[]');}catch(_){return[];}}
function lsSet(a){try{localStorage.setItem('atlas_queue',JSON.stringify(a));}catch(_){}}
let QUEUE=[];
async function loadQueue(){
  const builtIds=new Set(ENTRIES.map(gid));
  const builtNames=new Set(ENTRIES.map(e=>gname(e).toLowerCase().trim()));
  const isBuilt=t=>builtIds.has(slugify(t))||builtNames.has(t.toLowerCase().trim());
  let issues=[];
  try{
    const r=await fetch('https://api.github.com/repos/'+REPO+'/issues?state=open&sort=created&direction=asc&per_page=100',{cache:'no-store'});
    if(r.ok){const d=await r.json(); issues=d.filter(x=>!x.pull_request && /^queue:/i.test(x.title||'')).map(x=>({text:(x.title||'').replace(/^queue:\s*/i,'').trim(),source:'issue'}));}
  }catch(_){}
  const issueTexts=new Set(issues.map(i=>i.text.toLowerCase().trim()));
  const local=lsGet().filter(t=>!issueTexts.has(t.toLowerCase().trim())&&!isBuilt(t));
  QUEUE=[...issues.filter(i=>!isBuilt(i.text)), ...local.map(t=>({text:t,source:'local'}))];
  renderQueue();
}
function renderQueue(){
  const box=document.getElementById('qlist'); if(!box)return;
  if(!QUEUE.length){box.innerHTML='<div class="qempty">Nothing queued yet.</div>';return;}
  box.innerHTML=QUEUE.map(q=>'<span class="qchip" title="unlocks next run">&#9203; '+esc(q.text)+(q.source==='local'?' <span style=\'opacity:.55\'>(confirm)</span>':'')+'</span>').join('');
}
function submitQueue(){
  const inp=document.getElementById('qinput'); const t=(inp.value||'').trim(); if(!t)return;
  const local=lsGet(); if(!local.some(x=>x.toLowerCase().trim()===t.toLowerCase().trim())){local.push(t); lsSet(local);}
  inp.value='';
  const url='https://github.com/'+REPO+'/issues/new?labels=queue&title='+encodeURIComponent('queue: '+t)+'&body='+encodeURIComponent('Requested from the Machine Atlas map. Build this next.');
  try{window.open(url,'_blank','noopener');}catch(_){}
  loadQueue();
}

/* load */
async function load(){
  let loaded=null;
  try{const mf=await fetch('data/manifest.json',{cache:'no-store'});if(mf.ok){const {entries}=await mf.json();const arr=await Promise.all(entries.map(async s=>{try{const r=await fetch('data/'+s+'.json',{cache:'no-store'});return r.ok?await r.json():null;}catch(_){return null;}}));const good=arr.filter(Boolean);if(good.length)loaded=good;}}catch(_){}
  ENTRIES=loaded||FALLBACK;
  const {nodes}=buildNodes(ENTRIES); NODES=nodes; NODEBYKEY={}; nodes.forEach(n=>NODEBYKEY[n.key]=n);
  buildWorld();
  loadQueue();
}
load();
