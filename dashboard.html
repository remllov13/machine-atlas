  try{
    const mf = await fetch('data/manifest.json',{cache:'no-store'});
    if(mf.ok){
      const {entries}=await mf.json();
      const arr=await Promise.all(entries.map(async s=>{
        try{const r=await fetch('data/'+s+'.json',{cache:'no-store'});return r.ok?await r.json():null;}catch(e){return null;}
      }));
      const good=arr.filter(Boolean);
      if(good.length) loaded=good;
    }
  }catch(e){}
  ENTRIES = loaded || FALLBACK;
  document.getElementById('foot').textContent='THE MACHINE ATLAS · '+ENTRIES.length+' ENTRIES · SCHEMA-TOLERANT';
  showLibrary();
}

/* ---------- chains ---------- */
function buildChains(list){
  const byId={}; list.forEach(e=>byId[gid(e)]=e);
  const roots=list.filter(e=>{const p=(e.chain||{}).parent_id; return !p || !byId[p];});
  const chains=[];
  roots.forEach(r=>{
    const seen=new Set(), ordered=[];
    (function walk(node){
      if(seen.has(gid(node)))return; seen.add(gid(node)); ordered.push(node);
      list.filter(e=>(e.chain||{}).parent_id===gid(node)).forEach(walk);
    })(r);
    chains.push(ordered);
  });
  return chains;
}
function chainLabel(ordered){
  const counts={}; ordered.forEach(e=>{counts[gname(e)]=(counts[gname(e)]||0)+1;});
  const names=ordered.map(e=>{
    const n=gname(e);
    return (counts[n]>1 && gmode(e)==='buildout') ? n+' (buildout)' : n;
  });
  return names.length>1 ? names.join('  →  ') : names[0];
}

function showLibrary(){
  document.getElementById('detail').style.display='none';
  const lib=document.getElementById('library'); lib.style.display='block';
  document.getElementById('filters').style.display='flex';
  const list=ENTRIES.filter(e=>FILTER==='all'||gmode(e)===FILTER);
  if(!list.length){lib.innerHTML='<div class="empty">No entries yet. The daily run drops them into <code>data/</code>.</div>';return;}
  const chains=buildChains(list);
  lib.innerHTML=chains.map(ordered=>`
    <div class="chain-h">${esc(chainLabel(ordered))}</div>
    <div class="grid">${ordered.map(cardHTML).join('')}</div>`).join('');
}

function cardHTML(e){
  const econ=econOf(e); const mechN=(e.mechanics_summary||[]).length;
  return `<div class="card" onclick="showDetail('${esc(gid(e))}')">
    <span class="mode ${gmode(e)}">${esc(gmode(e))}</span>
    <h3>${esc(gname(e))}</h3>
    <div class="sec">${esc(gsec(e))}${ggeo(e)?' · '+esc(ggeo(e)):''}</div>
    <div class="ol">${esc(e.one_line||'')}</div>
    <div class="foot">
      ${econ?`<span class="pill econ">${esc(econ.concept||'').split('(')[0].trim()}</span>`:''}
      ${mechN?`<span class="pill">${mechN} mechanics</span>`:''}
    </div>
  </div>`;
}

/* ---------- detail ---------- */
function showDetail(id){
  const e=ENTRIES.find(x=>gid(x)===id); if(!e)return;
  document.getElementById('library').style.display='none';
  document.getElementById('filters').style.display='none';
  const d=document.getElementById('detail'); d.style.display='block';
  d.innerHTML=renderDetail(e);
  window.scrollTo({top:0,behavior:'smooth'});
}

function engineHTML(e){
  const en=e.engine||{}; if(!Object.keys(en).length) return '';
  const cell=(k,v)=>{const a=asArr(v); const body=a.length>1?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:esc(a[0]||'');
    return `<div class="cell"><div class="k">${k}</div><div class="v">${body}</div></div>`;};
  let h=`<div class="sec-h">The engine</div><div class="flow3">
    ${cell('Money in',en.money_in)}<div class="chev">&#8594;</div>
    ${cell('Transformation',en.transformation)}<div class="chev">&#8594;</div>
    ${cell('Money out',en.money_out)}</div>`;
  if(en.the_spread||en.leverage_point){
    h+=`<div class="band"><div class="k">The spread — the business in one line</div>
      <div class="eq">${esc(en.the_spread||'')}</div>
      ${en.leverage_point?`<div class="lev"><b>Leverage:</b> ${esc(en.leverage_point)}</div>`:''}</div>`;
  }
  const extra=[];
  if(en.inputs) extra.push(cell('Inputs',en.inputs));
  if(en.outputs) extra.push(cell('Outputs',en.outputs));
  if(extra.length) h+=`<div class="twocol">${extra.join('')}</div>`;
  return h;
}

function unitHTML(e){
  const u=e.unit; if(!u) return '';
  if(typeof u==='object'){
    return `<div class="sec-h">The unit</div><div class="twocol">
      <div class="cell"><div class="k">${esc(u.unit_name||'Unit')}</div><div class="v">${esc(u.unit_economics||'')}</div></div>
      ${u.what_one_unit_produces?`<div class="cell"><div class="k">What one unit really produces</div><div class="v">${esc(u.what_one_unit_produces)}</div></div>`:''}
    </div>`;
  }
  return `<div class="sec-h">The unit</div><div class="cell"><div class="v">${esc(u)}</div></div>`;
}

function buildoutHTML(e){
  let h='';
  if(e.why_now) h+=`<div class="sec-h">Why now</div><div class="cell"><div class="v">${esc(e.why_now)}</div></div>`;
  if(e.structural_gap) h+=`<div class="sec-h">The structural gap</div><div class="cell"><div class="v">${esc(e.structural_gap)}</div></div>`;
  const oue=e.one_unit_economics;
  if(oue){
    h+=`<div class="sec-h">Anatomy of one unit — ${esc(oue.unit_name||'')}</div>`;
    if(Array.isArray(oue.line_items)){
      h+=`<div class="stackrow head"><div class="sl">Line item</div><div class="sp">Covered by</div><div class="spr">Cash</div></div>`;
      h+=oue.line_items.map(li=>`<div class="stackrow"><div class="sl">${esc(li.item)}</div><div class="sp">${esc(li.covered_by||'')}</div><div class="spr">${esc(li.cash||'')}</div></div>`).join('');
    }
    if(oue.detail) h+=`<div class="cell"><div class="v">${esc(oue.detail)}</div></div>`;
    if(oue.summary) h+=`<div class="cell" style="margin-top:8px"><div class="v">${esc(oue.summary)}</div></div>`;
  }
  if(e.operating_model) h+=`<div class="sec-h">Operating model</div><div class="cell"><div class="v">${esc(e.operating_model)}</div></div>`;
  if(Array.isArray(e.money_stack)){
    h+=`<div class="sec-h">The money stack</div>`;
    h+=`<div class="stackrow head"><div class="sl">Layer</div><div class="sp">Phase</div><div class="spr">Range</div></div>`;
    h+=e.money_stack.map(s=>`<div class="stackrow"><div class="sl">${esc(s.layer)}</div><div class="sp">${esc(s.phase||'')}</div><div class="spr">${esc(s.price_range||'')}</div>${s.note?`<div class="snote">${esc(s.note)}</div>`:''}</div>`).join('');
  }
  if(e.players_map && typeof e.players_map==='object'){
    h+=`<div class="sec-h">The players</div><div class="pmap">`;
    h+=Object.entries(e.players_map).map(([k,v])=>`<div class="pg"><div class="pgl">${esc(k.replace(/_/g,' '))}</div>${asArr(v).map(i=>`<div class="pgi">· ${esc(i)}</div>`).join('')}</div>`).join('');
    h+=`</div>`;
  }
  if(Array.isArray(e.launch_cadence)){
    h+=`<div class="sec-h">Launch cadence</div>`;
    h+=e.launch_cadence.map(c=>`<div class="cad"><div class="cw">${esc(c.window||'')}</div><div class="ca">${esc(c.actions||'')}</div></div>`).join('');
  }
  if(e.risks||e.moat){
    h+=`<div class="sec-h">Risks &amp; moat</div><div class="twocol">`;
    const fmt=(arr,key)=>asArr(arr).map(x=>typeof x==='object'?`<p style="margin:7px 0"><strong>${esc(x[key]||'')}.</strong> ${esc(x.note||'')}</p>`:`<p style="margin:7px 0">${esc(x)}</p>`).join('');
    h+=`<div class="cell"><div class="k" style="color:var(--amber)">Failure modes</div>${fmt(e.risks,'risk')}</div>`;
    h+=`<div class="cell"><div class="k" style="color:var(--teal)">The moat</div>${fmt(e.moat,'moat')}</div></div>`;
  }
  if(Array.isArray(e.first_five_moves)){
    h+=`<div class="sec-h">First moves</div><div class="moves">${e.first_five_moves.map(m=>`<div class="mv">${esc(m)}</div>`).join('')}</div>`;
  }
  return h;
}

function playsHTML(e){
  if(!Array.isArray(e.plays)||!e.plays.length) return '';
  const plays=e.plays.map(p=>`
    <div class="play">
      <div class="play-top"><div class="play-name">${esc(p.play_name)}</div><div class="play-tag">${esc(p.tagline||'')}</div></div>
      <div class="play-move">${esc(p.the_move||'')}</div>
      ${Array.isArray(p.flow)?`<div class="steps">${p.flow.map((s,i)=>`<div class="step"><div class="sn">${i+1}</div><div class="st">${esc(s.step_title)}</div><div class="sd">${esc(s.step_desc)}</div></div>`).join('')}</div>`:''}
      ${p.in_the_wild?`<div class="wild"><span class="l">In the wild</span>${esc(wildText(p.in_the_wild))}</div>`:''}
      ${p.watch_out?`<div class="watch"><span class="l">Watch out</span>${esc(p.watch_out)}</div>`:''}
      ${Array.isArray(p.mechanics)?`<div class="mechs">${p.mechanics.map(m=>`<span class="pill">${esc(m)}</span>`).join('')}</div>`:''}
    </div>`).join('');
  return `<div class="sec-h">The plays</div>${plays}`;
}

function historyHTML(e){
  const h=e.history; if(!h) return '';
  let out=`<div class="sec-h">History &amp; people</div>`;
  if(h.origin) out+=`<div class="hcard"><div class="role">Origin</div><div class="who">${esc(h.origin.who||'')}</div>${h.origin.when?`<div class="when">${esc(h.origin.when)}</div>`:''}<p>${esc(h.origin.what_problem_forced_it||'')}</p></div>`;
  if(h.operator) out+=`<div class="hcard"><div class="role">The operator</div><div class="who">${esc(h.operator.name||'')}</div><p>${esc(h.operator.what_they_did||'')}</p>${h.operator.outcome?`<p style="color:var(--muted);margin-top:7px">${esc(h.operator.outcome)}</p>`:''}</div>`;
  if(h.counterexample) out+=`<div class="hcard bad"><div class="role">The counterexample</div><div class="who">${esc(h.counterexample.name||'')}</div><p>${esc(h.counterexample.what_they_did||'')}</p>${h.counterexample.why_it_broke?`<p style="color:var(--muted);margin-top:7px"><b>Why it broke:</b> ${esc(h.counterexample.why_it_broke)}</p>`:''}</div>`;
  return out;
}

function epiHTML(e){
  const ep=e.epistemics; if(!ep) return '';
  let h=`<div class="sec-h">Receipts &amp; honest unknowns</div>`;
  const oc=overallConf(ep); if(oc) h+=`<p style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:10px">Overall confidence: <b style="color:var(--text)">${esc(oc)}</b></p>`;
  (ep.numbers||[]).forEach(n=>{
    const c=(n.confidence||'').toLowerCase();
    h+=`<div class="num"><span class="conf ${c}">${esc(n.confidence||'')}</span><span><b>${esc(numLabel(n))}</b>${n.value?': '+esc(n.value):''}${n.source_url?` — <a href="${esc(n.source_url)}" target="_blank" rel="noopener" style="color:var(--muted)">source</a>`:''}</span></div>`;
  });
  if(Array.isArray(ep.unknowns)&&ep.unknowns.length){
    h+=`<div style="margin-top:12px"><div class="k" style="font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)">What this entry does NOT claim to know</div><ul class="unknowns">${ep.unknowns.map(u=>`<li>${esc(u)}</li>`).join('')}</ul></div>`;
  }
  return h;
}

function recallHTML(e){
  const r=e.recall; if(!r) return '';
  let h=`<div class="sec-h">Recall</div>`;
  if(r.glyph_prompt) h+=`<div class="glyph"><div class="role">Glyph — picture this</div><p>${esc(r.glyph_prompt)}</p></div>`;
  const qs=recallQs(r);
  if(qs.length) h+=`<div class="qbox"><div class="k" style="font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Answer in 30 seconds</div><ol>${qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div>`;
  return h;
}

function econHTML(e){
  const ec=econOf(e); if(!ec) return '';
  return `<div class="sec-h">Economics lens</div><div class="econbox"><div class="role">The concept</div>
    <div class="concept">${esc(ec.concept||'')}</div>
    ${ec.micro_or_macro?`<div class="mm">${esc(ec.micro_or_macro)}economics</div>`:''}
    <p style="margin-top:8px;font-size:14px">${esc(ec.explain||'')}</p></div>`;
}

function chainHTML(e){
  const ch=e.chain||{}; const sn=ch.suggested_next;
  let h='';
  if(ch.relation_note){h+=`<div class="sec-h">Chain</div><div class="cell"><div class="k">${esc(ch.relation||'')}${ch.parent_id?' · from '+esc(ch.parent_id):''}</div><div class="v">${esc(ch.relation_note)}</div></div>`;}
  if(Array.isArray(sn)&&sn.length){
    h+=`<div class="chainfwd" style="margin-top:10px">${sn.map(s=>`<div class="cfwd"><div class="rel">${esc(s.relation||'')} → ${esc(s.id||'')}</div><div class="cwhy">${esc(s.why||'')}</div></div>`).join('')}</div>`;
  }
  return h;
}

function renderDetail(e){
  const seq=(e.chain&&e.chain.chain_position!=null)?' · position '+e.chain.chain_position:'';
  return `<button class="back" onclick="showLibrary()">&#8592; All entries</button>
    <div class="eyebrow">${esc(gmode(e).toUpperCase())}${seq} · ${esc(gdate(e))}</div>
    <h1 class="title">${esc(gname(e))}</h1>
    ${gaka(e).length?`<div class="aka">also: ${esc(gaka(e).join(' · '))}</div>`:''}
    <div class="oneline">${esc(e.one_line||'')}</div>
    <div class="meta">
      ${gsec(e)?`<span>SECTOR <b>${esc(gsec(e))}</b></span>`:''}
      ${ggeo(e)?`<span>GEOGRAPHY <b>${esc(ggeo(e))}</b></span>`:''}
      ${gera(e)?`<span>ERA <b>${esc(gera(e))}</b></span>`:''}
    </div>
    ${engineHTML(e)}
    ${unitHTML(e)}
    ${buildoutHTML(e)}
    ${playsHTML(e)}
    ${econHTML(e)}
    ${historyHTML(e)}
    ${recallHTML(e)}
    ${epiHTML(e)}
    ${chainHTML(e)}`;
}

function setFilter(f){FILTER=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active',b.dataset.f===f));showLibrary();}
load();
</script>
</body>
</html>
