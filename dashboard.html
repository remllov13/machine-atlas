efends that spread."], "last_reviewed": null, "next_review": null, "ease": null}}, {"identity": {"id": "tsmc", "name": "TSMC", "aka": ["Taiwan Semiconductor Manufacturing Company", "TSM", "the foundry", "the world's fab"], "sector": "Semiconductor manufacturing (pure-play foundry)", "geography": "Taiwan (Hsinchu); expanding fabs in Arizona, Japan, and Germany", "era": "1987-present; AI-driven leading-edge dominance 2023-present", "mode": "teardown", "date_walked": "2026-11-17"}, "chain": {"parent_id": "nvidia", "relation": "supplier", "relation_note": "NVIDIA designs chips but owns no factory — TSMC fabricates every NVIDIA data-center GPU and controls the CoWoS advanced packaging that caps how many can exist. The NVIDIA teardown kept calling this the real bottleneck; this entry opens the furnace NVIDIA rents. If NVIDIA sells the shovels, TSMC owns the one forge on Earth that can make the shovel-heads.", "chain_position": 2, "suggested_next": [{"id": "asml", "relation": "supplier", "why": "TSMC cannot climb to the next node without EUV lithography machines, and ASML is the sole company that makes them. The bottleneck beneath the bottleneck — a literal monopoly on the tool that makes advanced chips possible."}, {"id": "apple", "relation": "customer", "why": "TSMC's largest and most important customer. Apple reliably buys out each new node first, effectively bankrolling the leading edge before anyone else — a teardown of how a lead customer finances a supplier's R&D."}, {"id": "intel", "relation": "substitute", "why": "The integrated-device model (design AND manufacture in-house) that TSMC's pure-play model beat, and now a would-be foundry rival. The clearest contrast class for why separating design from fab won."}]}, "one_line": "TSMC designs no chips and sells none of its own — it runs the single most advanced factory on Earth and rents it to everyone, and because that factory costs more and takes longer to build than any one customer could ever justify, no customer can build their own.", "engine": {"inputs": ["Chip designs handed over by fabless customers (NVIDIA, Apple, AMD, Qualcomm, Broadcom)", "EUV lithography machines bought solely from ASML, plus silicon wafers, gases, and chemicals", "Staggering capital — tens of billions a year — plus vast water and electricity", "Decades of accumulated process know-how and yield-learning that cannot be bought"], "transformation": "Turn other companies' blueprints into physical chips at the leading edge, by being the only neutral manufacturer with the scale, yield, and capital to run bleeding-edge process nodes (3nm, 2nm) profitably. Pool the demand of every chip designer so that a $20-billion-plus fab no single customer could justify becomes shared infrastructure they all rent.", "outputs": ["Fabricated wafers and chips at advanced nodes (the frontier the whole industry depends on)", "Advanced packaging (CoWoS) — the specific capacity bottleneck that gates AI-accelerator supply", "A neutral, trusted manufacturing commons that lets rival designers all build without owning a fab"], "money_in": "Per-wafer pricing with a steep premium for leading-edge nodes, plus long-term capacity reservations and customer prepayments that lock in demand years ahead.", "money_out": "Capital expenditure on fabs and EUV tools (tens of billions yearly), heavy depreciation, process R&D, and the power and talent to keep yields climbing.", "the_spread": "A roughly 60% gross margin despite brutal capital intensity — because leading-edge capacity is genuinely scarce, TSMC's yields beat everyone's, and it prices the frontier accordingly.", "leverage_point": "Neutrality plus the compounding node lead. Apple, NVIDIA, AMD, and Qualcomm are bitter rivals who all trust TSMC precisely because it competes with none of them — and each new node is so much harder and costlier that TSMC's yield lead widens instead of eroding."}, "unit": "One wafer (and, at the frontier, one node's worth of scarce capacity). A single leading-edge 3nm wafer sells for roughly $18,000-20,000+; the economics turn on yield (how many good chips per wafer) and on keeping the newest, highest-priced node full.", "plays": [{"play_name": "Pure Play", "tagline": "Make nothing of your own, so every designer can trust you with their crown jewels.", "flow": [{"step_title": "Renounce your own chips", "step_desc": "Commit to never designing or selling a competing product. The factory's only business is building other people's designs."}, {"step_title": "Earn the trust", "step_desc": "Because you will never compete with them, mortal rivals can all hand you their most secret designs without fear you'll copy or favor one."}, {"step_title": "Collect from every side", "step_desc": "Your customer list becomes the entire industry at once — the designers who hate each other all pay the same neutral forge."}], "the_move": "Turn neutrality into a business model. By refusing to compete with your customers, you become the one supplier all of them can safely depend on.", "in_the_wild": {"name": "Apple, NVIDIA, AMD, and Qualcomm — direct competitors across phones, GPUs, and CPUs — all manufacture their leading-edge chips at TSMC simultaneously", "confidence": "high"}, "watch_out": "Neutrality cracks if TSMC ever starts favoring one customer's allocation over another's, or if a customer fears its designs leak. Trust is the whole asset, and it is fragile.", "mechanics": ["neutral-supplier", "trust-as-moat", "shared-infrastructure", "conflict-free"]}, {"play_name": "Pool Demand", "tagline": "Build the fab no single customer could afford by renting it to all of them.", "flow": [{"step_title": "Find the unaffordable fixed cost", "step_desc": "A leading-edge fab costs more than $20 billion — more than any one chip company's volume could justify building alone."}, {"step_title": "Aggregate the orders", "step_desc": "Combine the wafer demand of dozens of fabless companies so the fab runs full, spreading that colossal fixed cost across everyone."}, {"step_title": "Make the build rational", "step_desc": "What is irrational for one buyer becomes obviously rational as shared infrastructure — and once built, it is the cheapest place on Earth to make advanced chips."}], "the_move": "Convert a prohibitive fixed cost into shared infrastructure. Pooling demand is what lets the frontier fab exist at all — and what makes it a near-impossible thing to replicate.", "in_the_wild": {"name": "TSMC's 2025 capital expenditure of about US$40.9 billion funds fabs serving the whole fabless industry at once — a scale no single customer's order book could support", "confidence": "high"}, "watch_out": "Pooled demand is pooled risk. If AI capex turns out to be a bubble, TSMC is left holding the depreciation on fabs built for demand that evaporated.", "mechanics": ["demand-aggregation", "fixed-cost-sharing", "minimum-efficient-scale", "capital-moat"]}, {"play_name": "Climb the Node", "tagline": "Stay one process generation ahead and let the learning curve bury the chasers.", "flow": [{"step_title": "Lead the next shrink", "step_desc": "Be first to a new, smaller process node (3nm, then 2nm) that makes chips faster and more efficient."}, {"step_title": "Ride the yield curve", "step_desc": "Yields (good chips per wafer) improve with cumulative production, so the first mover with the most volume gets good fast and cheap while rivals struggle."}, {"step_title": "Reinvest the lead", "step_desc": "The profits from the frontier node fund the next one, so the gap to Samsung and Intel widens rather than closes."}], "the_move": "Weaponize the experience curve. Because yield improves with volume and volume follows the lead, being ahead compounds into being further ahead.", "in_the_wild": {"name": "In 2025 TSMC earned 74% of wafer revenue from 7nm-and-below nodes (3nm alone was 24%), while rivals remained a generation or more behind at volume", "confidence": "high"}, "watch_out": "The climb is not infinite — physics, EUV tool availability let ENTRIES = [], FILTER = 'all';

/* ---------- tolerant accessors (the umbrella: bend to each entry's shape) ---------- */
const ident = e => (e && e.identity) ? e.identity : (e||{});
const gid   = e => ident(e).id;
const gname = e => ident(e).name || gid(e) || 'Untitled';
const gmode = e => (ident(e).mode || 'teardown').toLowerCase();
const gaka  = e => ident(e).aka || [];
const gsec  = e => ident(e).sector || '';
const ggeo  = e => ident(e).geography || '';
const gera  = e => ident(e).era || '';
const gdate = e => ident(e).date_walked || '';
const asArr = v => Array.isArray(v) ? v : (v==null||v==='' ? [] : [v]);
const wildText = w => (w && typeof w==='object') ? (w.name||w.text||'') : (w||'');
const numLabel = n => n.claim || n.label || n.metric || '';
const recallQs = r => (r && (r.questions || r.three_questions)) || [];
const econOf   = e => e.economics_lens || null;
const overallConf = ep => (ep && (ep.confidence || ep.overall)) || '';
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------- load ---------- */
async function load(){
  let loaded=null;
  try{
    const mf = await fetch('data/manifest.json',{cache:'no-store'});
    if(mf.ok){
      const {entries}=await mf.json();
      const arr=await Promise.all(entries.map(async s=>{
        try{const r=await fetch('data/'+s+'.json',{cache:'no-store'});return r.ok?await r.json():null;}catch(e){return null;}
      }));
      const good=arr.filter(Boolean);
      if(good.length) loaded=good;
    }
  }catch(e){}
  ENTRIES = loaded || FALLBACK;
  document.getElementById('foot').textContent='THE MACHINE ATLAS · '+ENTRIES.length+' ENTRIES · SCHEMA-TOLERANT';
  showLibrary();
}

/* ---------- chains ---------- */
function buildChains(list){
  const byId={}; list.forEach(e=>byId[gid(e)]=e);
  const roots=list.filter(e=>{const p=(e.chain||{}).parent_id; return !p || !byId[p];});
  const chains=[];
  roots.forEach(r=>{
    const seen=new Set(), ordered=[];
    (function walk(node){
      if(seen.has(gid(node)))return; seen.add(gid(node)); ordered.push(node);
      list.filter(e=>(e.chain||{}).parent_id===gid(node)).forEach(walk);
    })(r);
    chains.push(ordered);
  });
  return chains;
}
function chainLabel(ordered){
  const counts={}; ordered.forEach(e=>{counts[gname(e)]=(counts[gname(e)]||0)+1;});
  const names=ordered.map(e=>{
    const n=gname(e);
    return (counts[n]>1 && gmode(e)==='buildout') ? n+' (buildout)' : n;
  });
  return names.length>1 ? names.join('  →  ') : names[0];
}

function showLibrary(){
  document.getElementById('detail').style.display='none';
  const lib=document.getElementById('library'); lib.style.display='block';
  document.getElementById('filters').style.display='flex';
  const list=ENTRIES.filter(e=>FILTER==='all'||gmode(e)===FILTER);
  if(!list.length){lib.innerHTML='<div class="empty">No entries yet. The daily run drops them into <code>data/</code>.</div>';return;}
  const chains=buildChains(list);
  lib.innerHTML=chains.map(ordered=>`
    <div class="chain-h">${esc(chainLabel(ordered))}</div>
    <div class="grid">${ordered.map(cardHTML).join('')}</div>`).join('');
}

function cardHTML(e){
  const econ=econOf(e); const mechN=(e.mechanics_summary||[]).length;
  return `<div class="card" onclick="showDetail('${esc(gid(e))}')">
    <span class="mode ${gmode(e)}">${esc(gmode(e))}</span>
    <h3>${esc(gname(e))}</h3>
    <div class="sec">${esc(gsec(e))}${ggeo(e)?' · '+esc(ggeo(e)):''}</div>
    <div class="ol">${esc(e.one_line||'')}</div>
    <div class="foot">
      ${econ?`<span class="pill econ">${esc(econ.concept||'').split('(')[0].trim()}</span>`:''}
      ${mechN?`<span class="pill">${mechN} mechanics</span>`:''}
    </div>
  </div>`;
}

/* ---------- detail ---------- */
function showDetail(id){
  const e=ENTRIES.find(x=>gid(x)===id); if(!e)return;
  document.getElementById('library').style.display='none';
  document.getElementById('filters').style.display='none';
  const d=document.getElementById('detail'); d.style.display='block';
  d.innerHTML=renderDetail(e);
  window.scrollTo({top:0,behavior:'smooth'});
}

  const en=e.engine||{}; if(!Object.keys(en).length) return '';

  });
  if(Array.isArray(ep.unknowns)&&ep.unknowns.length){
    h+=`<div style="margin-top:12px"><div class="k" style="font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)">What this entry does NOT claim to know</div><ul class="unknowns">${ep.unknowns.map(u=>`<li>${esc(u)}</li>`).join('')}</ul></div>`;
  }
  return h;
}

function recallHTML(e){
  const r=e.recall; if(!r) return '';
  let h=`<div class="sec-h">Recall</div>`;
  if(r.glyph_prompt) h+=`<div class="glyph"><div class="role">Glyph — picture this</div><p>${esc(r.glyph_prompt)}</p></div>`;
  const qs=recallQs(r);
  if(qs.length) h+=`<div class="qbox"><div class="k" style="font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Answer in 30 seconds</div><ol>${qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div>`;
  return h;
}

function econHTML(e){
  const ec=econOf(e); if(!ec) return '';
  return `<div class="sec-h">Economics lens</div><div class="econbox"><div class="role">The concept</div>
    <div class="concept">${esc(ec.concept||'')}</div>
    ${ec.micro_or_macro?`<div class="mm">${esc(ec.micro_or_macro)}economics</div>`:''}
    <p style="margin-top:8px;font-size:14px">${esc(ec.explain||'')}</p></div>`;
}

function chainHTML(e){
  const ch=e.chain||{}; const sn=ch.suggested_next;
  let h='';
  if(ch.relation_note){h+=`<div class="sec-h">Chain</div><div class="cell"><div class="k">${esc(ch.relation||'')}${ch.parent_id?' · from '+esc(ch.parent_id):''}</div><div class="v">${esc(ch.relation_note)}</div></div>`;}
  if(Array.isArray(sn)&&sn.length){
    h+=`<div class="chainfwd" style="margin-top:10px">${sn.map(s=>`<div class="cfwd"><div class="rel">${esc(s.relation||'')} → ${esc(s.id||'')}</div><div class="cwhy">${esc(s.why||'')}</div></div>`).join('')}</div>`;
  }
  return h;
}

function renderDetail(e){
  const seq=(e.chain&&e.chain.chain_position!=null)?' · position '+e.chain.chain_position:'';
  return `<button class="back" onclick="showLibrary()">&#8592; All entries</button>
    <div class="eyebrow">${esc(gmode(e).toUpperCase())}${seq} · ${esc(gdate(e))}</div>
    <h1 class="title">${esc(gname(e))}</h1>
    ${gaka(e).length?`<div class="aka">also: ${esc(gaka(e).join(' · '))}</div>`:''}
    <div class="oneline">${esc(e.one_line||'')}</div>
    <div class="meta">
      ${gsec(e)?`<span>SECTOR <b>${esc(gsec(e))}</b></span>`:''}
      ${ggeo(e)?`<span>GEOGRAPHY <b>${esc(ggeo(e))}</b></span>`:''}
      ${gera(e)?`<span>ERA <b>${esc(gera(e))}</b></span>`:''}
    </div>
    ${engineHTML(e)}
    ${unitHTML(e)}
    ${buildoutHTML(e)}
    ${playsHTML(e)}
    ${econHTML(e)}
    ${historyHTML(e)}
    ${recallHTML(e)}
    ${epiHTML(e)}
    ${chainHTML(e)}`;
}

function setFilter(f){FILTER=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active',b.dataset.f===f));showLibrary();}
load();
</script>
</body>
</html>
