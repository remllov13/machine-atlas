<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>The Machine Atlas</title>
<style>
  :root{
    --ink:#0D0F12; --panel:#15181D; --panel2:#1B2027; --line:#262C34;
    --text:#E9E7E0; --muted:#8A9099; --dim:#596069; --lime:#C6F24E; --amber:#E4A93A;
    --teal:#5DCAA5; --lock:#D4537E; --blue:#5B8BD4; --purple:#8C83E0;
    --serif:Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  .topbar{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,15,18,.9);backdrop-filter:blur(8px);z-index:20}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:14px}
  .brand{font-family:var(--mono);font-size:13px;letter-spacing:3px;color:var(--muted);cursor:pointer}
  .brand b{color:var(--text);font-weight:600}.brand .dot{color:var(--lime)}
  .filters{display:flex;gap:4px}
  .fbtn{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
  .fbtn.active{color:var(--ink);background:var(--lime);border-color:var(--lime);font-weight:600}
  .fbtn:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

  /* library */
  .lib{padding:30px 0 60px}
  .chain-h{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:26px 0 14px;display:flex;align-items:center;gap:10px}
  .chain-h::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .15s,transform .15s;position:relative}
  .card:hover{border-color:var(--dim);transform:translateY(-2px)}
  .card .mode{position:absolute;top:16px;right:16px;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid}
  .mode.teardown{color:var(--teal);border-color:var(--teal)}
  .mode.buildout{color:var(--amber);border-color:var(--amber)}
  .card h3{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.1;margin-right:70px}
  .card .sec{font-family:var(--mono);font-size:10px;letter-spacing:.5px;color:var(--muted);margin:5px 0 10px}
  .card .ol{font-size:13px;color:var(--text);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;padding:3px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .pill.econ{color:var(--purple);border-color:var(--purple)}

  /* detail */
  .detail{padding:28px 0 70px;display:none}
  .back{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 0;margin-bottom:14px}
  .back:hover{color:var(--lime)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  h1.title{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1.02;margin:8px 0 4px}
  .aka{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:14px}
  .oneline{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--amber);line-height:1.4;max-width:800px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .meta b{color:var(--text);font-weight:500}
  .sec-h{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--lime);margin:30px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
  .flow3{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
  @media(max-width:720px){.flow3{grid-template-columns:1fr}.chev{display:none}}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .cell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
  .cell .v{font-size:14px}.cell .v li{margin-left:16px;margin-bottom:3px}
  .chev{align-self:center;color:var(--dim);font-size:18px}
  .band{margin-top:14px;background:linear-gradient(90deg,rgba(228,169,58,.13),rgba(228,169,58,.03));border:1px solid rgba(228,169,58,.4);border-radius:12px;padding:16px 18px}
  .band .k{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--amber)}
  .band .eq{font-family:var(--serif);font-size:22px;color:var(--amber);margin-top:5px}
  .band .lev{font-size:13px;color:var(--muted);margin-top:7px}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  @media(max-width:720px){.twocol{grid-template-columns:1fr}}
  .play{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
  .play-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .play-name{font-family:var(--serif);font-size:21px}
  .play-tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .play-move{margin:11px 0 12px;font-size:15px}
  .steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
  .step{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .step .sn{font-family:var(--mono);font-size:10px;color:var(--lime)}
  .step .st{font-weight:600;font-size:13px;margin:3px 0}.step .sd{font-size:12px;color:var(--muted)}
  .wild,.watch{font-size:13px;margin-top:8px;padding-left:12px;border-left:2px solid var(--line)}
  .wild .l,.watch .l{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px}
  .watch{border-left-color:var(--lock)}
  .mechs{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .hcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:11px}
  .hcard .role{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--lime)}
  .hcard.bad .role{color:var(--lock)}
  .hcard .who{font-family:var(--serif);font-size:19px;margin:5px 0 7px}
  .hcard p{font-size:14px}.hcard .when{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .stackrow{display:grid;grid-template-columns:1.3fr .8fr .7fr;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:7px;align-items:center}
  .stackrow.head{background:transparent;border:none;padding:3px 14px;margin:0}
  .stackrow .sl{font-weight:600;font-size:14px}.stackrow .sp{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .stackrow .spr{font-family:var(--serif);font-size:15px;color:var(--amber);text-align:right}
  .stackrow .snote{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:2px}
  .stackrow.head .sl,.stackrow.head .sp,.stackrow.head .spr{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);font-family:var(--mono);font-weight:400}
  .pmap{display:grid;grid-template-columns:1fr 1fr;gap:11px}@media(max-width:720px){.pmap{grid-template-columns:1fr}}
  .pg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .pg .pgl{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--lime);margin-bottom:7px}
  .pg .pgi{font-size:13px;color:var(--muted);margin:2px 0}
  .cad{background:var(--panel);border-left:3px solid var(--lime);border-radius:0 12px 12px 0;padding:13px 16px;margin-bottom:9px}
  .cad .cw{font-family:var(--serif);font-size:16px;margin-bottom:4px}.cad .ca{font-size:13px;color:var(--muted)}
  .moves{counter-reset:mv;margin-top:4px}
  .mv{display:flex;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:7px;font-size:14px;align-items:flex-start}
  .mv::before{counter-increment:mv;content:counter(mv);flex:none;width:21px;height:21px;border-radius:50%;background:var(--lime);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
  .econbox{background:linear-gradient(180deg,rgba(140,131,224,.1),transparent);border:1px solid rgba(140,131,224,.35);border-radius:14px;padding:18px}
  .econbox .role{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--purple)}
  .econbox .concept{font-family:var(--serif);font-size:19px;margin:6px 0 8px}
  .econbox .mm{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .glyph{background:linear-gradient(180deg,rgba(198,242,78,.08),transparent);border:1px solid rgba(198,242,78,.3);border-radius:14px;padding:18px;margin-bottom:12px}
  .glyph .role{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--lime)}
  .glyph p{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5;margin-top:8px}
  .qbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .qbox ol{margin-left:18px}.qbox li{margin:5px 0;font-size:15px}
  .num{display:flex;align-items:flex-start;gap:9px;font-size:13px;margin:6px 0}
  .conf{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:20px;flex:none;margin-top:2px}
  .conf.high,.conf.verified{color:var(--teal);border:1px solid var(--teal)}
  .conf.medium,.conf.ballpark{color:var(--amber);border:1px solid var(--amber)}
  .conf.illustrative{color:var(--muted);border:1px dashed var(--muted)}
  .unknowns li{font-size:13px;color:var(--muted);margin:5px 0 5px 18px}
  .chainfwd{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .cfwd{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;flex:1;min-width:220px}
  .cfwd .rel{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--blue)}
  .cfwd .cid{font-weight:600;font-size:14px;margin:3px 0}.cfwd .cwhy{font-size:12px;color:var(--muted)}
  footer{border-top:1px solid var(--line);padding:20px 0;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--dim);text-align:center}
  .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:15px}
</style>
</head>

tion": "Turn a commodity (silicon) into a system by wrapping the chip in proprietary software, networking, and reference designs so that buying a GPU means buying into an ecosystem that is expensive to leave. Design the hardware, outsource the hard capital (fabs) to TSMC, and keep the two highest-margin layers: architecture design and the CUDA software stack.", "outputs": ["Data-center AI accelerators (GPUs) sold as chips, boards, and whole racks (GB200 NVL72)", "Networking (NVLink, InfiniBand via the Mellanox acquisition)", "The CUDA software platform and libraries, given away to lock in demand", "Gaming GPUs, pro visualization, and automotive as secondary lines"], "money_in": "Mostly one-time hardware sales to hyperscalers, AI labs, neoclouds, and governments, increasingly as high-ticket integrated systems rather than loose chips.", "money_out": "Wafers and packaging to TSMC, HBM to memory makers, heavy R&D to keep the one-year architecture cadence, and stock-based compensation to retain scarce chip and AI talent.", "the_spread": "A fabless design + software company carrying roughly 71-75% GAAP gross margin. NVIDIA captures the designer's and the platform's margin while TSMC absorbs the capital intensity of actually building chips.", "leverage_point": "CUDA. The hardware is replicable; the fifteen-plus years of developer habit, tooling, and optimized libraries built on CUDA are not. That software lock-in is what lets NVIDIA charge gold-rush prices for silicon."}, "unit": "One AI accelerator (or, increasingly, one rack of them). The relevant unit economics: revenue per GPU at a ~70%+ gross margin, multiplied across millions of units — and the fact that each GPU sold deepens the CUDA install base, lowering the odds the next buyer defects.", "plays": [{"play_name": "Free Map", "tagline": "Give the software away so the hardware stays the only hardware that works.", "flow": [{"step_title": "Seed the standard", "step_desc": "Release a free software platform (CUDA, 2006) and spend years getting universities, researchers, and framework authors to build on it before anyone needs it for AI."}, {"step_title": "Let habits harden", "step_desc": "Every tutorial, PhD thesis, and production pipeline written against CUDA becomes switching cost. A rival chip now has to beat NVIDIA AND re-run a decade of software work."}, {"step_title": "Charge on the hardware", "step_desc": "Because the software is only free on NVIDIA silicon, the lock-in shows up as pricing power on the GPUs people must buy to use what they already know."}], "the_move": "Monetize a hardware moat by giving the complementary software away. The giveaway is not generosity; it is the toll booth relocated one layer up.", "in_the_wild": {"name": "PyTorch and the entire deep-learning research stack were built and optimized CUDA-first, so frontier training runs assume NVIDIA by default", "confidence": "illustrative"}, "watch_out": "If a credible open layer (an OpenAI/Microsoft/Meta-backed software standard, or AMD's ROCm reaching parity) lets buyers keep their code while swapping silicon, the toll booth loses its road.", "mechanics": ["switching-costs", "ecosystem-lock-in", "loss-leader-complement", "network-effects"]}, {"play_name": "Sell Shovels", "tagline": "In a gold rush, be the one store every miner has to visit.", "flow": [{"step_title": "Spot the rush", "step_desc": "When a frenzy begins (deep learning, then generative AI), identify the one input every competitor needs regardless of who wins."}, {"step_title": "Own the input", "step_desc": "Be the default supplier of that input so rival miners fund you no matter which of them strikes gold."}, {"step_title": "Stay neutral and paid", "step_desc": "Avoid picking a winner among customers; sell to all of them, so your revenue is the sum of the whole war, not one army."}], "the_move": "Collect a tax on an entire competitive frenzy by supplying the shared bottleneck instead of competing inside it.", "in_the_wild": {"name": "xAI's 'C ecade of developers' habits into a wall around the hardware. The moat is software, not silicon."}, {"tag": "picks-and-shovels", "note": "Revenue is a tax on an entire competitive frenzy; NVIDIA wins whichever AI lab wins."}, {"tag": "fabless", "note": "Design and software kept in-house; capital-heavy manufacturing pushed to TSMC. That split is the source of the fat margin."}, {"tag": "complement-giveaway", "note": "Make the complement (software) free to protect pricing on the thing you sell (chips)."}, {"tag": "innovation-cadence", "note": "A one-year architecture cycle outruns rivals and the installed base, converting a durable good into a repeat purchase."}, {"tag": "bundling", "note": "Selling racks and networking, not just chips, raises ticket size and deepens lock-in beyond CUDA."}, {"tag": "bottleneck-control", "note": "Owning the one shared input of a boom gives pricing and allocation power over far larger buyers."}, {"tag": "derived-demand", "note": "NVIDIA's sales rise and fall with its customers' belief that more compute buys more capability — a belief, not a contract."}], "history": {"origin": {"who": "Jensen Huang, Chris Malachowsky, and Curtis Priem", "when": "Founded 1993; CUDA launched 2006; the AI inflection arrived 2012 (AlexNet trained on NVIDIA GPUs) and exploded with generative AI from 2022-2023", "what_problem_forced_it": "NVIDIA began selling graphics chips for games. The accidental discovery was that the same parallel hardware built to render pixels was ideal for the matrix math behind neural networks. CUDA (2006) was a bet — years before it paid off — that general-purpose GPU computing would matter. When deep learning arrived, NVIDIA was the only company whose hardware and software were already waiting."}, "operator": {"name": "Jensen Huang (co-founder and CEO, 1993-2026)", "what_they_did": "Ran NVIDIA for its entire life until November 2026, betting the company repeatedly on GPU computing and CUDA long before AI made it obvious, and compressing the product cadence to a yearly beat during the AI boom. Under him NVIDIA briefly became the most valuable company on earth.", "outcome": "Huang resigned as President, CEO, and board member effective November 12, 2026; CFO Colette Kress was named interim CEO while the board searches for a permanent successor, and Harvey C. Jones became the company's first-ever board Chair. The machine Huang built now faces its first test without its architect — a live case study in whether a moat this deep is a company or a person."}, "counterexample": {"name": "Intel", "what_they_did": "Owned the prior era of computing by owning both the chip design AND the factories (the integrated-device model), and dominated CPUs for decades.", "why_it_broke": "Intel bet on its own fabs and its CPU franchise, missed the shift to parallel/GPU compute and the AI workload, and watched a fabless designer pairing with TSMC leapfrog it. Owning the furnace became a weight, not a moat, when the furnace fell behind TSMC's process lead. The lesson NVIDIA's fabless play inverts: in this era, the rent is in design and software, not in the plant."}}, "epistemics": {"numbers": [{"claim": "Full-year FY2026 revenue of $215.9 billion, up 65% year over year", "value": "$215.9B", "as_of_date": "2026-02-25", "source_url": "https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-fourth-quarter-and-fiscal-2026", "confidence": "high"}, {"claim": "Full-year FY2026 Data Center revenue of $193.7 billion, up 68%", "value": "$193.7B", "as_of_date": "2026-02-25", "source_url": "https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-fourth-quarter-and-fiscal-2026", "confidence": "high"}, {"claim": "Full-year FY2026 GAAP gross margin of 71.1%", "value": "71.1%", "as_of_date": "2026-02-25", "source_url": "https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-fourth-quarter-and-fiscal-2026", "confidence": "high"}, {"claim": "Full-year FY2026 GAAP net income of $120.1 sus circular vendor-financed buildout (NVIDIA investing in customers who then buy NVIDIA) is debated and not resolvable here.", "This is educational business analysis, not investment advice. No claim is made about NVIDIA's stock or future financial performance."]}, "recall": {"glyph_prompt": "A gold-rush valley at night, lit by thousands of lamps. Prospectors in muddy coats — their backs stitched with the names OpenAI, Meta, xAI, Google — hack at the dark rock. Every pickaxe, lamp, and shovel is stamped with the same green eye. At the valley's single general store stands a leather-aproned shopkeeper in a black jacket, handing out tools with one hand. In the other hand, held behind his back, is the only map (labeled CUDA) — and none of the shovels dig unless you can read it. Outside the store, a rival peddler offers cheaper shovels to an empty line.", "questions": ["Where does NVIDIA's real moat live — in the silicon or in the software? (If you said silicon, look again at why the map is free.)", "NVIDIA owns zero chip factories. Who actually makes its chips, and why does staying fabless make the margin fat instead of thin?", "In the gold rush, NVIDIA is the ____ seller. Name three 'miners' who are forced to buy from it even while trying to beat each other."]}, "economics_lens": {"concept": "Network effects and switching costs (increasing returns to adoption)", "micro_or_macro": "micro", "explain": "CUDA is a textbook case of increasing returns to adoption: the more developers, tutorials, and production pipelines built on NVIDIA's software, the more valuable NVIDIA hardware becomes and the costlier it is for any buyer to switch, even to a cheaper or faster rival chip. This converts a commodity (silicon) into a product with a durable moat, letting NVIDIA sustain ~70%+ gross margins that competitive markets would normally erode. It also illustrates the complementary-goods logic of a loss leader — giving the software away for free is what protects the pricing power on the thing actually sold."}}, {"identity": {"id": "aws-cloud", "name": "Amazon Web Services (AWS)", "aka": ["AWS", "the cloud", "hyperscale cloud", "IaaS", "the hyperscaler"], "sector": "Cloud computing / IT infrastructure", "geography": "Global (US-headquartered, Seattle)", "era": "2006-present", "mode": "teardown", "date_walked": "2026-11-18"}, "chain": {"parent_id": null, "relation": "root", "relation_note": "First entry in the Atlas. AWS is the substrate machine: most modern software and AI businesses rent their computing here instead of building it, so nearly every later entry will link back to this cost floor.", "chain_position": 1, "suggested_next": [{"id": "nvidia", "relation": "supplies", "why": "The upstream picks-and-shovels seller to the picks-and-shovels seller. AWS is simultaneously Nvidia's largest kind of customer and its rival (via in-house Trainium/Graviton silicon). Tears down the input side of the cloud's cost floor and the economics of selling the one scarce ingredient everyone needs."}, {"id": "snowflake", "relation": "builds-on", "why": "A business that rents AWS by the metered unit and resells it one layer up as a higher-priced managed service. The 'value-added reseller on top of the utility' pattern, and a clean lesson in margin stacking: how a tenant earns a spread on top of the landlord's spread."}, {"id": "coreweave", "relation": "competes-with", "why": "A pure-play AI 'neocloud' renting GPUs at scale. A modern challenger testing whether the hyperscale scale/capex moat still holds when a focused entrant floods one input (GPUs) and skips the rest of the AWS catalog."}]}, "one_line": "Pour billions into data centers once, then rent that capacity back to the world by the metered sip, and let scale push your cost floor below anyone who tries to follow.", "engine": {"inputs": ["Capital (data centers, land, servers, custom silicon)", "Electricity and cooling", "Fiber and networking", "Engineering talent", "Long-term power and real-estate contracts"], "transformation": "Pool enormous, lumpy capital assets into standardized, on-demand infrastructure primitives (compute, storage, database, networking) exposed through APIs, so a customer can summon or release capacity in seconds and be billed only for what they touch.", "outputs": ["On-demand compute (instance-hours, serverless function calls)", "Metered storage (GB-months)", "Managed higher-order services (databases, AI/ML, analytics) billed by usage"], "money_in": "Usage-metered fees, plus reserved/committed-use discounts that pre-sell capacity, plus premium margins on managed services.", "money_out": "Depreciation on data-center capex, electricity, bandwidth, engineering salaries, and in-house chip R&D.", "the_spread": "Average cost per unit falls as utilization of the shared fleet rises. AWS charges a utility price well above its scale-lowered, fully-loaded cost per unit; the bigger the fleet, the lower the floor, the wider the spread. A 34.6% operating margin (Q3 2025) is that spread made visible.", "leverage_point": "Utilization and fixed-cost amortization. Every incremental workload placed on already-built capacity is almost pure margin, and only a fleet this size can justify designing its own cheaper chips, which drops the floor again out of reach of smaller rivals."}, "unit": "One metered unit of consumption, e.g. an EC2 instance-hour or a GB-month of S3 storage, priced above its fully-loaded cost-at-scale. The business is the sum of trillions of these tiny units, each carrying a sliver of margin.", "plays": [{"play_name": "Meter Everything", "tagline": "Turn capital into a tap you bill by the sip.", "flow": [{"step_title": "Build the reservoir", "step_desc": "Sink billions into fixed capacity: data centers, servers, networking, power."}, {"step_title": "Fit tiny meters", "step_desc": "Expose that capacity as small on-demand units via API: instance-hours, GB-months, per-request calls, per-millisecond execution."}, {"step_title": "Bill the drip", "step_desc": "Charge continuously by usage with no upfront commitment, so spend scales automatically with the customer's own growth."}], "the_move": "Convert a customer's lumpy, boardroom-level capex decision into a frictionless opex drip. Adoption needs no approval, and your revenue compounds with their success instead of your sales effort.", "in_the_wild": "AWS Lambda bills per-millisecond of execution and per-request; S3 bills by the GB-month. A startup can run a workload for pennies and only writes a big check once it is already winning.", "watch_out": "Metered pricing hides total cost until the invoice lands. 'Bill shock' and the resulting FinOps/cost-optimization backlash are the predictable blowback of billing by the sip.", "mechanics": ["metered-pricing", "capex-to-opex", "low-friction-adoption", "consumption-growth"]}, {"play_name": "Scale Moat", "tagline": "The biggest fleet has the lowest floor.", "flow": [{"step_title": "Spread the fixed cost", "step_desc": "Amortize an enormous fixed asset base over more usage than anyone else, lowering average cost per unit."}, {"step_title": "Reinvest the margin", "step_desc": "Plow the resulting profit back into still more capacity and custom silicon."}, {"step_title": "Price past rivals", "step_desc": "Set prices at a level where sub-scale competitors lose money, letting capex requirements guard the gate."}], "the_move": "Use scale to push your average cost below any smaller competitor's, then let the sheer capital required to match you do the gatekeeping no marketing could.", "in_the_wild": "HP shut down its Helion public cloud (effective Jan 31, 2016) after concluding it 'made no sense to go head-to-head' with the hyperscalers and lacked the financial resources to match their scale.", "watch_out": "The moat demands relentless capex (Amazon raised 2025 capital spending to roughly $125B); a scale moat also draws antitrust scrutiny, and any demand miss turns that fixed cost into dead weight.", "mechanics": ["economies-of-scale", "fixed-cost-amortization", "capex-barrier-to-entry", "experience-curve"]}, {"play_name": "Own The Silicon", "tagline": "Design the chip only scale can justify.", "flow": [{"step_title": "Reach the volume", "step_desc": "Grow usage until designing custom hardware pays off against buying it at retail."}, {"step_title": "Build in-house chips", "step_desc": "Design your own processors: Graviton (Arm CPUs), Trainium and Inferentia (AI chips)."}, {"step_title": "Keep the markup", "step_desc": "Capture the margin a merchant-silicon buyer would otherwise hand to Intel or Nvidia."}], "the_move": "Vertically integrate down to the transistor. Scale is what makes a multi-year chip program rational, and it drops your cost floor below any rival that must buy compute at list price.", "in_the_wild": "AWS Graviton (Arm-based server CPUs) and Trainium (AI training chips) let AWS offer compute that undercuts equivalent merchant-silicon instances and reduces its dependence on Nvidia pricing.", "watch_out": "Chip R&D is a capital-heavy, multi-year bet. If the architecture loses or software support lags, the investment strands and the cost advantage never arrives.", "mechanics": ["vertical-integration", "scale-enabled-R&D", "input-cost-control"]}, {"play_name": "Lock The Gravity", "tagline": "Cheap to pour in, costly to pull out.", "flow": [{"step_title": "Make entry free", "step_desc": "Keep data ingress and storage cheap so workloads flow in without friction."}, {"step_title": "Let it accumulate", "step_desc": "Allow data, integrations, and service dependencies to pile up over years."}, {"step_title": "Charge the exit", "step_desc": "Price data-transfer-out (egress) and make re-platforming painful, so leaving costs real money and effort."}], "the_move": "Build switching costs out of accumulated data and dependencies, 'data gravity,' so recurring revenue compounds not because the customer re-chooses you but because leaving is harder than staying.", "in_the_wild": "AWS historically capacity is near-pure margin, so utilization is the real profit lever."}, {"tag": "metered-pricing", "note": "Billing by tiny usage units turns a customer's capex into opex, removes the approval friction, and hides total cost until the invoice."}, {"tag": "capex-barrier-to-entry", "note": "Matching scale requires tens of billions per year in data centers and chips, a wall that fences out sub-scale rivals more effectively than any patent."}, {"tag": "vertical-integration", "note": "Scale alone justifies designing in-house silicon, dropping the cost floor below rivals who must buy compute at retail."}, {"tag": "data-gravity", "note": "Accumulated data and dependencies create switching costs, so recurring revenue compounds on inertia rather than repeated re-selling."}, {"tag": "picks-and-shovels", "note": "Renting the scarce input (compute) captures a boom without having to pick the boom's winner."}], "history": {"origin": {"who": "Amazon, with Andy Jassy writing the original business plan", "when": "S3 launched in 2006 and EC2 in August 2006, making AWS first to market with modern cloud infrastructure", "what_problem_forced_it": "Internally, Amazon's projects that should have taken three months were spending that long just standing up database, compute, and storage from scratch, with every team rebuilding the same plumbing. Amazon built common, well-documented infrastructure services so any team could move faster, realized it was unusually good at running infrastructure at scale and low margin, and rented that capability to everyone else. As Jassy put it, 'very quietly around 2000, we became a services company.'"}, "operator": {"name": "Andy Jassy", "what_they_did": "Built AWS from its first business plan into a standalone profit engine, pricing aggressively and reinvesting margin into capacity and custom silicon, then carried that playbook into the Amazon CEO seat in 2021.", "outcome": "AWS generated roughly $11.4B of operating income in Q3 2025, about two-thirds of Amazon's total operating profit, on under a fifth of its revenue. The cloud subsidized the retailer."}, "counterexample": {"name": "HP Helion Public Cloud", "what_they_did": "HP ran a competing OpenStack-based public cloud, then announced in October 2015 it would shut the public cloud down (effective January 31, 2016) and retreat to private and managed offerings.", "why_it_broke": "HP had the technology but not the scale. It concluded it 'made no sense to go head-to-head' with AWS, Azure, and Google, was dropped from Gartner's IaaS Magic Quadrant for insufficient share, and lacked the financial resources to fund competitive capex. Sub-scale, its cost per unit never fell to where it could price and still profit, the exact downside of the scale curve AWS rides up."}}, "economics_lens": {"concept": "Economies of scale (with metered utility pricing)", "micro_or_macro": "micro", "explain": "Cloud infrastructure is a textbook high-fixed-cost, near-zero-marginal-cost business: data centers, fiber, and custom silicon are enormous sunk costs, while serving one more instance-hour costs almost nothing. The firm that spreads the largest fixed base over the most usage has the lowest average total cost, so as output rises its cost curve keeps falling, the declining long-run average cost curve an economics course would draw. AWS's 34.6% operating margin and HP's forced exit are the same curve seen from opposite ends: scale is the moat, and sub-scale is the trap."}, "epistemics": {"numbers": [{"metric": "AWS Q3 2025 revenue", "value": "$33.0B (33.01B), ~20% YoY (Jassy cited 20.2%)", "source_url": "https://ir.aboutamazon.com/news-release/news-release-details/2025/Amazon-com-Announces-Third-Quarter-Results/default.aspx", "as_of_date": "2025-09-30", "confidence": "high"}, {"metric": "AWS Q3 2025 operating income", "value": "$11.43B", "source_url": "https://marketchameleon.com/articles/b/2025/10/31/aws-powers-amazon-growth-ai-q3-2025", "as_of_date": "2025-09-30", "confidence": "high"}, {"metric": "AWS Q3 2025 operating margin", "value": "34.6%", "source_url": "https://marketchameleon.com/articles/b/2025/10/31/aws-powers-amazon-growth-ai-q3-2025", "as_of_date": "2025-09-30", "confidence": "high"}, {"metric": "AWS annualized revenue run rate", "value": "~$132B", "source_url": "https://futurumgroup.com/insights/amazon-q3-fy-2025-earnings-aws-reaccelerates-retail-and-ads-grow/", "as_of_date": "2025-09-30", "confidence": "high"}, {"metric": "Amazon total Q3 2025 operating income (for AWS share comparison)", "value": "$17.4B total; AWS ~66% of it", "source_url": "https://futurumgroup.com/insights/amazon-q3-fy-2025-earnings-aws-reaccelerates-retail-and-ads-grow/", "as_of_date": "2025-09-30", "confidence": "high"}, {"metric": "Global cloud infrastructure market share, Q3 2025 (Synergy Research)", "value": "AWS 29%, Microsoft Azure 20%, Google Cloud 13%; total market ~$107B for the quarter", "source_url": "https://www.theregister.com/2025/11/20/aws_loses_market_share_azure_google/", "as_of_date": "2025-09-30", "confidence": "high"}, {"metric": "Amazon 2025 capital expenditure guidance", "value": "~$125B (raised), led by AWS/AI data centers", "source_url": "https://www.ciodive.com/news/aws-revenue-jumps-33b/804450/", "as_of_date": "2025-10-31", "confidence": "medium"}, {"metric": "AWS launch and first-to-market", "value": "S3 in 2006, EC2 in August 2006", "source_url": "https://techcrunch.com/2016/07/02/andy-jassys-brief-history-of-the-genesis-of-aws/", "as_of_date": "2016-07-02", "confidence": "high"}, {"metric": "HP Helion public cloud shutdown", "value": "Announced Oct 2015, shut down effective Jan 31, 2016", "source_url": "https://www.informationweek.com/cloud/infrastructure-as-a-service/hp-kills-public-cloud-cedes-to-aws-google-microsoft/d/d-id/1322789", "as_of_date": "2015-10-22", "confidence": "high"}], "overall": "high", "unknowns": ["AWS does not publicly break out its true unit cost, utilization rates, or the cost-per-instance-hour, so the exact width of 'the spread' at the unit level is inferred from segment margin, not disclosed.", "The portion of AWS's reported operating margin attributable to custom silicon (Graviton/Trainium) versus scale alone is not separately disclosed.", "The $125B 2025 capex figure is guidance and blends AWS AI buildout with other Amazon spending; the AWS-only share is not cleanly isolated here.", "The 'free egress' / EU Data Act claim is directionally well-reported but the precise scope and effective dates of AWS's egress-fee waivers were not re-verified for this entry and should be confirmed before relying on specifics.", "This is educational analysis of how the business works, not investment, legal, or tax advice; figures are as-of the dates shown and will drift."]}, "recall": {"glyph_prompt": "A single colossal concrete water tower looms over a flat desert plain. From its base run thousands of thin pipes to every building on the horizon, and each pipe is fitted with a spinning coin-meter that clicks softly as water trickles through. The tower's foundation is a mountain of poured concrete; the more pipes that draw from it, the cheaper each drop becomes. On a distant ridge sits a half-built rival tower, scaffolding rusting, abandoned for lack of money.", "questions": ["Why does the biggest cloud have the lowest cost per unit, and why does that gap widen rather than close as it grows?", "How does metered, pay-as-you-go billing change a customer's buying decision compared with purchasing their own servers up front?", "HP had the technology to run a public cloud; name the single thing it could not match, and explain why that one thing is the entire moat."]}}, {"identity": {"id": "frontier-room", "name": "The Frontier Room — AI Builders' Club", "aka": ["Fort Lauderdale AI Builders' Club", "the screened room", "a convening layer", "working title: Current"], "sector": "Community / convening / ecosystem infrastructure", "geography": "Fort Lauderdale / South Florida (Broward, between Miami and Boca)", "era": "2025–present AI boom; the local builder-room gap", "mode": "buildout", "date_walked": "2026-11-17"}, "chain": {"parent_id": null, "relation": "root", "relation_note": "A second root, and the human end of the stack NVIDIA and TSMC sit at the bottom of. The silicon chain ends in GPUs; this is a room full of the people renting those GPUs to build. Where the hardware entries are about owning a scarce physical input, this one is about owning a scarce social input — proximity to the best builders. Same word runs through both: whoever controls the bottleneck everyone must pass through sets the terms.", "chain_position": 1, "suggested_next": [{"id": "ai-tinkerers", "relation": "template", "why": "The exact model being copied — screened, demo-first, no-pitch builder meetups, sponsor-funded. A teardown of the template shows the working machine this buildout borrows from 30 miles south."}, {"id": "coworking-spaces", "relation": "substitute", "why": "The generalist-clubhouse business (WeWork, General Provision) this deliberately is NOT — real estate and rent vs. curation and signal. The clearest contrast class for why asset-light convening is a different business."}, {"id": "venture-capital", "relation": "customer", "why": "The capital layer the room sells deal-flow access to. A teardown of how a VC fund makes money explains why a convener's 'first look' seat converts to scout fees and carry — the room's real prize."}]}, "one_line": "Own the room the region's best AI builders choose to stand in, and you own the gravity — you never pay for real estate, you charge sponsors to stand near the talent, and your real pay is being the first person every deal and hire passes through.", "why_now": "South Florida's capital is here and AI-hungry — roughly $2B of venture flowed into the region in H1 2025 — but the builder infrastructure outside Miami's Wynwood core hasn't caught up. Serious Fort Lauderdale AI talent currently commutes ~37 minutes south to Miami and hands its energy to that scene. There is no screened, demo-first AI builders' room anchored in Broward. The window: AI is in its 'third inning' where winners are deep verticalized B2B companies, exactly the serious builders a screened room selects for — and the category name in Fort Lauderdale is unclaimed.", "structural_gap": "Fort Lauderdale has the talent, the capital nearby (Las Olas VC and others are headquartered in the city itself), and institutional anchors (NSU's Levan Center, FAU Tech Runway) — but no screened, demo-first AI builders' room of its own. The serious builder energy leaks south to Miami because there is nowhere local worth staying for. The gap is not a missing building; it is a missing standard.", "engine": {"inputs": ["A screened cohort of 40–80 active AI builders (the scarce social input)", "A borrowed venue for one evening a month (General Provision, NSU Levan, FAU)", "One infrastructure/cloud sponsor covering food and space", "A 60-second screening form and a between-meetups channel (Slack/Discord)", "The convener's own time and judgment — the standard is held, never delegated"], "transformation": "Convert a venue's idle evening and a sponsor's marketing budget into concentrated proximity — a screened room where running code earns the floor. Filter hard so the conversation stays builder-to-builder, run live demos instead of pitches, and let density pull talent, talent pull demos, demos pull capital, and capital pull more talent. The convener stands at the hub, informed first and trusted most.", "outputs": ["A recurring, screened room of active AI builders (the compounding relationship asset)", "Demo videos that recruit next month's cohort at $0 ad spend", "A deal-flow and talent information edge sold to sponsors and capital", "The convener's seat: first look at the region's talent, tools, and raises"], "money_in": "Event sponsorship (launch-day revenue), annual partner tiers, optional member dues, talent/recruiting access fees, and — the uncapped layer — capital-side upside (scout fees, advisory equity, syndicate carry) on companies seen first.", "money_out": "Near-zero cash: food and venue are sponsor- and partner-covered; tooling runs ~$30/month. The real cost is sweat and the discipline to protect the standard.", "the_spread": "A night costs ~$650–1,200 to run and a single event sponsor pays $1,500–3,000 — so the room is cash-positive or break-even from night one, but the actual spread is non-cash: reputation and a deal-flow seat bought cheaply now, cashed out later as scout fees and equity.", "leverage_point": "Asset-light curation. Because the product is the room and not the real estate, the convener borrows every physical input and keeps the two things that compound and cannot be bought: the screening relationship (trust) and the standing as 'the room' (reputation)."}, "unit": "One monthly ~50-person meetup. The whole model is legible in a single night: ~$650–1,200 cash cost, covered by one $1,500–3,000 sponsor for a net of +$300 to +$1,800; and the real yield — ~5 demo videos, ~50 screened relationships, 1 convener's information edge, and 1–2 standout builders worth championing to capital (the seed of the uncapped upside).", "one_unit_economics": {"unit_name": "One ~50-person meetup night", "line_items": [{"item": "Venue (~50 cap, 3 hrs)", "cash": "$0 (market $800–1,500)", "covered_by": "Venue partner", "confidence": "illustrative"}, {"item": "Food + drinks (50 people)", "cash": "$600–900", "covered_by": "Event sponsor", "confidence": "illustrative"}, {"item": "A/V (screen + mic)", "cash": "$0", "covered_by": "Venue", "confidence": "illustrative"}, {"item": "Video capture of demos", "cash": "$0–300", "covered_by": "Volunteer / sponsor", "confidence": "illustrative"}, {"item": "Tools (Luma + Discord + form)", "cash": "~$30/mo", "covered_by": "You", "confidence": "illustrative"}, {"item": "Sponsor pays", "cash": "$1,500–3,000", "covered_by": "1 sponsor", "confidence": "illustrative"}], "summary": "Total cash needed ~$650–1,200; one sponsor covers it; net cash +$300 to +$1,800 per night. The cash is a rounding error — the point is the relationships and demo content the night produces. Figures are the playbook's own illustrative ranges, to validate locally with real sponsors."}, "operating_model": "A screened, monthly, demo-first room of 40–80 active AI builders — NOT a coworking space, a lease, a 'tech networking' mixer, a recruiting floor, or a lecture series. Borrow venues rather than build; a 60-second application protects signal density (admit people actively shipping AI, decline spectators and recruiters). Running code earns the floor: ~3 hours, two sets of 5-minute live demos, technical Q&A, Wednesday evenings. It is a cadence, not an event — monthly to start, with a quarterly hack night and an annual flagship 'Demo Day.' The convener owns the moderation voice from night one: correct the behavior, keep the person; protect signal over growth.", "money_stack": [{"layer": "Event sponsorship", "phase": "Launch (1→)", "price_range": "$1.5–3k / night", "note": "Covers food + logo + 60-sec intro. Parallel: Agentuity @ AI Tinkerers Miami."}, {"layer": "Annual partner tiers", "phase": "Cadence (2→)", "price_range": "$7.5–25k / yr", "note": "Founding $15–25k, Core $7.5–12k. Recurring sponsor packages: logo, demo intro slot, hiring access."}, {"layer": "Member dues (optional)", "phase": "Cadence (2→)", "price_range": "$25–40 / mo", "note": "40 members × $30 ≈ $14k/yr. Gate Core perks, not access."}, {"layer": "Talent / recruiting", "phase": "Cadence→Compound (2–3→)", "price_range": "$5–15k / hire", "note": "Hiring-access add-on; the screened room is the filter employers pay for."}, {"layer": "Capital-side upside (illiquid)", "phase": "Compound (3→)", "price_range": "scout / equity / carry", "note": "Scout fees $5–25k per funded deal, advisory equity 0.25–1%, micro-syndicate 10–20% carry. Where convening → deal flow → wealth. The uncapped prize."}], "players_map": {"conveners_to_study": ["AI Tinkerers Miami (the direct template)", "Refresh Miami (16k+ members, best distribution)", "eMerge Americas", "Miami Hack Week"], "capital": ["Las Olas Venture Capital (Fort Lauderdale, Mark Volchek)", "Fuel Venture Capital", "1001 VC", "DeepWork Capital", "Blumberg Capital"], "anchors": ["NSU Alan B. Levan Center of Innovation", "FAU Tech Runway", "General Provision (primary venue)", "Tech Lauderdale"], "sponsors": ["Agentuity (warmest first call)", "PostHog", "Replit", "AWS / Google Cloud / Azure credit programs", "Model labs: Anthropic, OpenAI, Google dev-rel"], "builders": ["Pillar", "FirmPilot", "Prescient AI", "Exowatt", "Guardz", "Mytaverse", "1PLTFRM"]}, "plays": [{"play_name": "Borrow the Room", "tagline": "Bring the builders; let someone else own the walls.", "flow": [{"step_title": "Find idle venues", "step_desc": "Partners who already want builder foot traffic — a founder clubhouse, a university innovation center — have empty evenings worth $800–1,500."}, {"step_title": "Trade the crowd for the space", "step_desc": "You bring ~50 vetted builders, brand, photos, and programming they don't have to create; they give you the room at $0 cash."}, {"step_title": "Rotate, don't lease", "step_desc": "Keep several venues in rotation so you never sign a lease, never carry rent, and can flex through lean months."}], "the_move": "Never buy the asset that depreciates. Convert a venue's idle evening into your platform, and keep your balance sheet empty on purpose.", "in_the_wild": {"name": "The LAB Miami built its brand partly by hosting the AI builder scene, and AI Tinkerers Miami runs on a borrowed venue (The LAB) with a sponsor (Agentuity) covering costs — a working asset-light room 30 miles south", "confidence": "medium"}, "watch_out": "A borrowed room means a borrowed standard. If a venue starts dictating who gets in or turns the night into its own showcase, the signal dies — the convener must hold the admission decision, always.", "mechanics": ["asset-light", "value-exchange", "venue-arbitrage", "no-lease-resilience"]}, {"play_name": "Screen Hard", "tagline": "The filter is the product, not the gate.", "flow": [{"step_title": "Ask one real question", "step_desc": "'What are you building or shipping with AI right now?' plus a link. Sixty seconds of friction is the whole filter."}, {"step_title": "Admit builders, decline spectators", "step_desc": "Auto-admit hands-on builders; ratio-cap adjacent roles; decline pure sales, recruiters, and the 'AI-curious.'"}, {"step_title": "Cap the room", "step_desc": "A hard seat cap manufactures demand — scarcity plus screening makes admission mean something."}], "the_move": "Curation is not gatekeeping — it is the asset. A screened room of fifty people shipping AI beats a thousand badge-scanners, so you filter hard and never apologize for it.", "in_the_wild": {"name": "AI Tinkerers caps some meetups at ~30 builders and screens for active builders only; the scarcity and screening are exactly what make the room worth being admitted to", "confidence": "medium"}, "watch_out": "Signal dilution is the fastest way to die — admitting non-builders to grow the headcount turns the room into 'just another mixer,' and the moat evaporates the night a spectator gets the floor.", "mechanics": ["curation-as-moat", "scarcity-power", "signal-density", "adverse-selection-defense"]}, {"play_name": "Demos Beat Decks", "tagline": "Running code earns the floor; nobody pitches.", "flow": [{"step_title": "Set the standard", "step_desc": "Live demos only — no slides, no vendors, no recruiters working the edges. What you shipped this week is the only credential."}, {"step_title": "Film everything", "step_desc": "Every 5-minute demo is captured on video, turning one night into a library of proof."}, {"step_title": "Let the clips recruit", "step_desc": "Published demo clips are the marketing that pulls next month's cohort — at $0 ad spend."}], "the_move": "Make the content produce its own distribution. By demanding real, shipped work on stage, the room generates the exact artifacts that recruit the next, better cohort for free.", "in_the_wild": {"name": "AI Tinkerers' demo-first, no-pitch format is the direct template — monthly screened builder nights of roughly 150 attendees built on running code, not decks", "confidence": "medium"}, "watch_out": "The moment a sponsor is allowed to pitch from the stage, the room stops being builder-to-builder. Vendor capture is a slow poison — the standard has to be held hardest exactly when the money asks to bend it.", "mechanics": ["content-flywheel", "proof-of-work", "zero-cac-marketing", "standard-as-product"]}, {"play_name": "Layer the Money", "tagline": "Keep the lights on with sponsors; get rich on the seat.", "flow": [{"step_title": "Start with one sponsor", "step_desc": "An infra or cloud sponsor covers food and space per night — launch-day revenue that makes the room cash-neutral immediately."}, {"step_title": "Stack recurring layers", "step_desc": "Add annual partner tiers, optional dues, and paid hiring access as the room proves value."}, {"step_title": "Hold the option", "step_desc": "The real return is the convener's seat — first look at talent and deals that converts to scout fees, advisory equity, and carry."}], "the_move": "Treat cash sponsorship as the floor and the deal-flow seat as the ceiling. Layers 1–4 might total $40–100k a year — real but capped; Layer 5 is uncapped, because one scouted deal in a company you saw first can dwarf every cash line combined.", "in_the_wild": {"name": "Agentuity sponsored nearly every recent AI Tinkerers Miami event and The LAB provided the venue — a proven sponsor-plus-venue revenue base in this exact market, 30 miles away", "confidence": "medium"}, "watch_out": "Chasing the capped cash (more dues, more tiers) while neglecting the uncapped seat is the classic error — the money that changes your life is the equity position, and it only accrues if the room's signal stays worth a first look.", "mechanics": ["revenue-layering", "optionality", "convener-information-edge", "deferred-upside"]}, {"play_name": "Stand at the Hub", "tagline": "Convene the flywheel; don't just watch it spin.", "flow": [{"step_title": "Concentrate density", "step_desc": "A screened room puts the best AI builders in one place, repeatedly."}, {"step_title": "Let density produce signal", "step_desc": "Density produces demos and the region's earliest news, which pulls investors and infra money toward the room."}, {"step_title": "Compound the cohort", "step_desc": "Capital and reputation attract the next, better cohort — and each turn makes the next easier."}], "the_move": "Sit at the hub, not outside it. The convener who stands at the center of the loop is informed first and trusted most, and that position compounds into the most valuable seat in the regional scene.", "in_the_wild": {"name": "Refresh Miami grew into the region's largest tech community (16,000+ members) and its #MiamiTech newsletter became the best distribution channel in South Florida — the convener's-seat flywheel, proven at scale", "confidence": "medium"}, "watch_out": "The fuel is curation and cadence, not real estate — skip months (cadence collapse) or burn out as a solo organizer and the wheel stops. Distribute to a Core team early, or the hub you built collapses onto one exhausted person.", "mechanics": ["network-effects", "flywheel", "first-mover", "cadence-trust"]}], "mechanics_summary": [{"tag": "asset-light", "note": "The product is the room, not the real estate — borrow every physical input and carry no lease, so the model flexes and survives lean months."}, {"tag": "curation-as-moat", "note": "The screening relationship is trust that compounds and cannot be bought by a competitor. The filter is the asset, not the gate."}, {"tag": "network-effects", "note": "Density pulls talent, talent pulls demos, demos pull capital, capital pulls more talent — a flywheel where each turn makes the next easier."}, {"tag": "content-flywheel", "note": "Filmed demos become the zero-cost marketing that recruits the next cohort; the room generates its own distribution."}, {"tag": "convener-information-edge", "note": "Standing at the hub means knowing who and what is moving first — the seat that converts to scout fees, advisory, and reputation."}, {"tag": "optionality", "note": "Capped cash layers keep the lights on; the uncapped prize is an equity/scout option on the region's best startups, seen first."}, {"tag": "first-mover", "note": "No screened AI builders' club is anchored in Broward yet — reputation is slow to build and hard to copy, so owning the category name early is the moat."}], "history": {"origin": {"who": "The convener (Andrew), modeling on Refresh Miami and AI Tinkerers", "when": "Conceived 2025–2026 against the South Florida AI capital boom", "what_problem_forced_it": "Serious Fort Lauderdale AI builders had nowhere local to convene and defaulted to a ~37-minute drive to Miami's scene, bleeding the region's talent energy south. The playbook's insight: Fort Lauderdale is not the periphery but the geographic midpoint between Boca's FAU Tech Runway (~20 mi north) and Miami (~30 mi south) — a room here lowers the access cost from both directions and pulls the center of gravity into open territory."}, "operator": {"name": "AI Tinkerers Miami + The LAB Miami (the template operators)", "what_they_did": "Ran the exact unit — screened, demo-first, no-pitch builder nights, free to attendees, with food and venue covered by a sponsor (Agentuity) and a host (The LAB). Proved that an asset-light convening layer works in this specific market.", "outcome": "A durable, sponsor-funded monthly room of ~150 builders 30 miles south — the working machine this buildout copies rather than invents. 'Good artists copy; great artists steal what works.'"}, "counterexample": {"name": "The generalist clubhouse (e.g. a WeWork-style coworking lease)", "what_they_did": "Sells space and broad community — rent from memberships, dedicated desks, private offices — with high capital needs (long lease, build-out, staffed campus) and a moat of location plus hospitality.", "why_it_broke": "That moat is replicable with capital; the convener is a landlord of a network, not the hub of its deal flow. The lesson this buildout inverts: in a curation-and-trust business, signing a lease to grow headcount is the move that converts a high-margin reputation asset into a low-margin real-estate business exposed to every empty desk."}}, "epistemics": {"numbers": [{"claim": "Roughly $2B of venture capital into South Florida in H1 2025", "value": "~$2B", "as_of_date": "2026-11-17", "source_url": null, "confidence": "illustrative"}, {"claim": "Fastest observed Fort Lauderdale → Miami AI-scene drive ~37 min; typical mid-week ~60 min", "value": "37–60 min", "as_of_date": "2026-11-17", "source_url": null, "confidence": "illustrative"}, {"claim": "Miami ranked No. 22 globally and No. 10 among US metros (2025 Global Startup Ecosystem Report)", "value": "#10 US / #22 global", "as_of_date": "2026-11-17", "source_url": null, "confidence": "illustrative"}, {"claim": "One meetup: ~$650–1,200 cash cost, $1,500–3,000 sponsor, net +$300 to +$1,800", "value": "net +$300–1,800/night", "as_of_date": "2026-11-17", "source_url": null, "confidence": "illustrative"}, {"claim": "Screening funnel per event: ~150 applications → 70 admitted → 50 attend → 5 demo → 1–2 standouts", "value": "150→70→50→5→1-2", "as_of_date": "2026-11-17", "source_url": null, "confidence": "illustrative"}], "overall": "illustrative", "unknowns": ["Every figure here comes from Andrew's own Frontier Room playbook as an illustrative planning range — none were independently re-verified in this session against primary sources (VC totals, the Global Startup Ecosystem Report, drive times).", "The revenue stack (sponsor tiers, scout fees, carry) is a plan to pressure-test with real South Florida sponsors, not booked revenue.", "Whether Fort Lauderdale's builder density is actually sufficient to sustain a monthly screened room is the core untested assumption.", "This is educational business analysis and a founder's own planning document, not investment or legal advice; convening, sponsorship, and any syndicate/scout activity carry regulatory and tax considerations to check locally."]}, "recall": {"glyph_prompt": "A single lit room on the ground floor of a borrowed building, halfway up a dark coastline between two city glows — Boca's lights to the north, Miami's brighter blaze to the south. Inside, fifty people crowd around a laptop on a stool where someone is running live code; no stage, no slides, no lanyard-scanners. At the doorway stands the convener, not charging admission but checking a single question on a phone — 'what are you building?' — and quietly turning away the suits with pitch decks. Through the window, investors and sponsors press their faces to the glass, trying to get in. The room owns no walls, pays no rent, and is the most valuable address in the region.", "questions": ["What is the actual product — the venue, the coffee, the membership, or the room itself? (And why does owning no real estate make the moat stronger, not weaker?)", "The cash from one night is a rounding error. So what is the convener really being paid in, and when does it pay out?", "Name the one admission decision the convener can never delegate, and what dies the night they get it wrong."]}, "economics_lens": {"concept": "Network effects and two-sided markets (increasing returns to density)", "micro_or_macro": "micro", "explain": "The room is a two-sided market: builders want to be where the other best builders and the capital are, and sponsors/investors want to be where the screened builders are — each side's value rises with the other's participation, a direct Metcalfe-style network effect. Curation is the mechanism that keeps the externality positive: admitting non-builders would be a congestion/adverse-selection effect that dilutes the signal every member came for, so the screen is really externality management. And because reputation and trust compound while real estate depreciates, the business tends toward increasing returns for the first credible convener — the same winner-take-most logic that makes NVIDIA's developer ecosystem hard to dislodge, here running on people instead of silicon."}}, {"id": "payment-networks", "name": "Payment Networks", "aka": ["card networks", "card schemes", "Visa/Mastercard rails"], "sector": "Financial services", "geography": "Global; figures skew US", "era": "Modern form since BankAmericard (1958) → Visa (1970s); still dominant", "mode": "teardown", "date_walked": "2026-07-27", "chain": {"parent_id": "banking-retail", "relation": "symbiote", "relation_note": "Networks sit on the same money flow as banks: banks issue the cards and lend, the network moves the authorization and clips a toll. Neither works without the other.", "chain_position": 1, "suggested_next": [{"id": "payment-processors", "relation": "downstream_customer", "why": "Stripe, Adyen, Square — the layer merchants actually touch, sitting on top of the network rails."}, {"id": "card-issuing-banks", "relation": "symbiote", "why": "The side that collects the fat interchange the network directs to it — the other half of the two-sided machine."}, {"id": "real-time-payment-rails", "relation": "substitute", "why": "FedNow, account-to-account, and stablecoins aim to move money without the card toll — the modern threat to the rails."}]}, "one_line": "Own the rails money rides on, clip a thin toll off every trip — and never touch the money itself.", "engine": {"inputs": "A tap or a swipe — a request to move money between a shopper's bank and a merchant's bank", "transformation": "Route the authorization across the network, set the fee schedule, and guarantee the transaction settles", "outputs": "A cleared payment, and a stream of tiny per-transaction fees", "money_in": "Network assessment/service fees (~0.13–0.14% of volume), per-transaction data-processing fees, and premium cross-border fees", "money_out": "Running the rails, fraud/security, incentives paid to banks to issue the network's cards", "the_spread": "a tiny % of an enormous volume  (fee-per-swipe × trillions in flow)", "leverage_point": "Asset-light: the network owns no cash and no receivables — it taxes movement, so revenue scales with total spend at near-zero marginal cost"}, "unit": {"unit_name": "One card transaction", "unit_economics": "On a $100 US credit purchase the merchant loses ~$2–3 total. Almost all of that (~86% of the merchant's cost) is interchange that goes to the shopper's BANK, not the network. The network itself keeps only its thin assessment (~$0.13–0.14) plus small data-processing fees. Figures ballpark; vary by card type and geography.", "what_one_unit_produces": "Data on the transaction, one more reason every merchant must accept the network, and one more reason every bank wants to issue its cards — the flywheel tightening by one turn."}, "plays": [{"play_name": "The Toll", "tagline": "Don't hold the money. Tax the movement.", "flow": [{"step_title": "Sit on the flow", "step_desc": "Own the rails every card payment must cross."}, {"step_title": "Clip a sliver", "step_desc": "Take a fraction of a percent of each transaction — too small to fight, on every purchase."}, {"step_title": "Scale with spend", "step_desc": "Revenue rises with total volume at almost no extra cost, because you own no balance sheet."}], "the_move": "A tiny toll is invisible per-swipe and colossal across trillions. Own the road, not the cars.", "in_the_wild": "In fiscal 2025 Visa processed roughly $14 trillion in payments volume across ~258 billion transactions and reported about $40 billion in net revenue; Mastercard handled around $9.2 trillion in gross dollar volume.", "watch_out": "The toll is a regulatory target. Caps and antitrust settlements can compress the take rate you rely on.", "glyph_id": "thetoll", "mechanics": ["toll-booth", "asset-light", "platform-tax"]}, {"play_name": "Pay the Issuer", "tagline": "Route the fat fee to the banks so they push your card.", "flow": [{"step_title": "Set the interchange", "step_desc": "The network SETS the ~2% interchange fee — but doesn't keep it."}, {"step_title": "Hand it to the bank", "step_desc": "That fat fee flows to the bank that issued the shopper's card."}, {"step_title": "Banks push your rails", "step_desc": "Rich interchange makes every issuer want to hand out YOUR cards, not a rival's."}], "the_move": "Give away the big fee to align the banks; keep the small, unstoppable one for yourself.", "in_the_wild": "Interchange makes up the large majority of the merchant's swipe cost — combined US credit interchange averaged about 2.36% in 2025 — and it funds the rewards programs banks use to compete for cardholders.", "watch_out": "This is what regulators attack: the US Durbin Amendment capped debit interchange, gutting that slice for issuers overnight.", "glyph_id": "payissuer", "mechanics": ["two-sided-network", "commoditize-your-complement", "bundling"]}, {"play_name": "Border Toll", "tagline": "The fattest margin lives at the border.", "flow": [{"step_title": "Wait for a foreigner", "step_desc": "A cardholder pays outside their home country."}, {"step_title": "Stack premium fees", "step_desc": "Cross-border and currency-conversion fees apply on top of the normal toll."}, {"step_title": "Bank the spread", "step_desc": "These are among the network's most profitable transactions."}], "the_move": "Same rails, higher toll — charge a premium exactly where travelers have no alternative.", "in_the_wild": "Cross-border is a disproportionately profitable line for both Visa and Mastercard, though its volume growth has decelerated for three straight years into 2025.", "watch_out": "Cross-border volume tracks travel and trade — it slumps in downturns and pandemics, taking the premium with it.", "glyph_id": "bordertoll", "mechanics": ["arbitrage", "brand-premium", "scarcity-manufacture"]}, {"play_name": "Two-Sided Lock", "tagline": "Every cardholder pulls a merchant; every merchant pulls a cardholder.", "flow": [{"step_title": "Win both sides", "step_desc": "Get cards into wallets AND terminals into stores."}, {"step_title": "Make refusal costly", "step_desc": "A merchant can't decline the network everyone carries; a shopper wants the card accepted everywhere."}, {"step_title": "Compound the moat", "step_desc": "Each new cardholder makes acceptance more essential, and vice versa — a self-tightening loop."}], "the_move": "Don't out-feature rivals — out-network them. Ubiquity itself becomes the product no one can copy.", "in_the_wild": "Visa and Mastercard together account for more than 80% of US credit card transaction volume; challengers struggle to break a moat built on universal acceptance.", "watch_out": "The same ubiquity draws antitrust scrutiny — and new rails can bootstrap their own network effect from a big platform's user base.", "glyph_id": "twosidedlock", "mechanics": ["two-sided-network", "economies-of-scale", "lock-in"]}, {"play_name": "Beyond the Swipe", "tagline": "Once you own the rails, sell services on top of them.", "flow": [{"step_title": "Start with the toll", "step_desc": "The core transaction fee funds everything."}, {"step_title": "Layer on services", "step_desc": "Fraud scoring, tokenization, data analytics, consulting, real-time-payment products."}, {"step_title": "Diversify the take", "step_desc": "Value-added services grow faster than the toll and hedge against interchange pressure."}], "the_move": "Turn the rails into a platform — sell the tools everyone riding them needs.", "in_the_wild": "Both networks have pushed hard into value-added services and acquisitions to grow revenue beyond pure transaction fees as regulatory pressure on interchange rises.", "watch_out": "Services revenue is more competitive and less moat-protected than the toll — it's a real market, not a tollgate.", "glyph_id": "beyondswipe", "mechanics": ["data-flywheel", "bundling", "platform-tax"]}], "mechanics_summary": [{"tag": "toll-booth", "note": "Sit on a flow and charge a small fee each time value passes — the purest version of this mechanic."}, {"tag": "two-sided-network", "note": "Cardholders and merchants each make the other side more valuable; the loop is the moat."}, {"tag": "asset-light", "note": "The network owns no money and no credit risk — it taxes movement, so it scales almost for free."}, {"tag": "platform-tax", "note": "Take a cut of transactions you host without being party to them."}, {"tag": "commoditize-your-complement", "note": "Route the fat interchange to banks so issuance (your complement) is abundant and loyal to you."}, {"tag": "regulatory-moat", "note": "Cuts both ways — scale deters entrants, but the same dominance invites caps and antitrust."}], "history": {"origin": {"who": "Bank of America (BankAmericard) and the banks behind Interbank / Master Charge", "when": "1958 (BankAmericard); networks formalized through the 1960s–70s", "what_problem_forced_it": "A single bank's card was only useful at merchants that bank had signed. Merchants and banks needed a universal system so ANY bank's card would work at ANY merchant — the network was the shared switchboard that made cards interoperable, and the toll paid for running it."}, "operator": {"name": "Dee Hock, founder of Visa", "what_they_did": "Reorganized BankAmericard into a member-owned cooperative (Visa) in the 1970s — a deliberately decentralized structure owned by the banks that used it, so competitors could cooperate on shared rails while competing for cardholders.", "outcome": "Visa grew into the largest payment network on earth; the cooperative later went public as a for-profit company worth hundreds of billions."}, "counterexample": {"name": "The Durbin Amendment (2010) and interchange litigation", "what_they_did": "US regulators ears before the spread outruns the burn.", "engine": {"inputs": "Founder capital + regulatory approval + a deposit base", "transformation": "Convert equity capital into a charter, then leverage deposits ~10x into a loan book", "outputs": "A regulated balance sheet that earns the spread", "money_in": "Net interest income once loans are on the book; fees later", "money_out": "Charter/legal spend, core-system build, staff, and interest paid to win deposits", "the_spread": "loan yield − (deposit cost + operating cost + loan losses)", "leverage_point": "The charter itself — it's the license to run ~10x leverage legally; everything before it is pure cost"}, "unit": {"unit_name": "The de novo formation (one new bank)", "unit_economics": "~$10–50M initial capital (community banks ~$10–20M; regional 50M+); ~1–3 yrs to charter; roughly break-even for years 0–2 while deposits build. Figures illustrative — validate with counsel.", "what_one_unit_produces": "A perpetual, regulated money-machine and a balance sheet that compounds — plus a moat competitors need years and regulators to replicate."}, "plays": [{"play_name": "Niche Charter", "tagline": "Don't out-scale the big banks. Serve who they price out.", "flow": [{"step_title": "Pick the underserved", "step_desc": "A segment big banks decline — a local trade, an immigrant community, a specific small-business type."}, {"step_title": "Underwrite what you know", "step_desc": "Lend on relationship and local knowledge competitors can't read from a spreadsheet."}, {"step_title": "Own the category", "step_desc": "Become the default bank for that niche before anyone else notices it."}], "the_move": "The charter is expensive, so aim it at a lane where you already have an edge — not the open market.", "in_the_wild": "A.P. Giannini built Bank of Italy (later Bank of America) by banking working-class immigrants elite banks ignored in early-1900s San Francisco.", "watch_out": "Concentration risk — regulators scrutinize a book that's all on unding-short.", "glyph_id": "depositfirst", "mechanics": ["scarcity-manufacture", "capital-cycle", "spread"]}], "mechanics_summary": [{"tag": "regulatory-moat", "note": "The charter is a license competitors need years and regulators to replicate — a moat you buy with time, not just money."}, {"tag": "capital-cycle", "note": "Thin equity leveraged into a large book, governed by ratio; the whole game is surviving to where leverage pays."}, {"tag": "asset-light", "note": "The BaaS path avoids the balance sheet and the charter entirely — rent the rails."}, {"tag": "spread", "note": "Same core as the teardown — the buildout is just the cost of getting to the point where you earn it."}], "why_now": "Rate environments and the rise of Banking-as-a-Service have split the path in two: the classic charter route (slow, expensive, durable moat) and the rented-rails route (fast, cheap, no moat). A founder today actually chooses which business they're in — that choice is the whole strategy.", "structural_gap": "Big banks price out entire segments (thin-file borrowers, niche small businesses, specific communities). Those segments still need credit and a place to bank. The gap is a lane where relationship underwriting beats algorithmic underwriting — exactly where a focused de novo (or a niche neobank on rented rails) can win.", "one_unit_economics": {"line_items": [{"item": "Initial capital (community-scale)", "cash": "$10–20M", "note": "Regulators set the floor; more for regional ambitions", "confidence": "ballpark"}, {"item": "Charter/legal/compliance to approval", "cash": "$1–5M", "note": "Lawyers, consultants, application process", "confidence": "illustrative"}, {"item": "Core banking system + tech build", "cash": "$2–5M", "note": "The rails, or a big chunk of a BaaS fee if renting", "confidence": "illustrative"}, {"item": "Leadership + compliance staff (annual)", "cash": "$1–2M/yr", "note": "Experienced bankers regulators trust", "confidence": "illustrative"}, {"item": "Deposit acquisition (rate + marketing)", "cash": "millions, ongoing", "note": "The cost of winning trust with money", "confidence": "illustrative"}], "summary": "Years 0–2 are cash-negative by design — you're buying a charter and a deposit base before the spread turns positive. The prize is a compounding regulated balance sheet."}, "operating_model": "Assemble an experienced team first (regulators fund people, not just money) → file the charter with a clear niche thesis → raise capital from a consortium (rarely one person) → build or rent the core system → win a deposit base with competitive rates → lend conservatively to protect credit quality → scale the book as the spread compounds.", "money_stack": [{"layer": "Net interest income", "phase": "core", "price_range": "the spread × the book", "note": "The engine — grows with the balance sheet."}, {"layer": "Fee income", "phase": "2", "price_range": "account/card/overdraft/wire", "note": "Non-interest income; politically fragile but real."}, {"layer": "Loan origination / servicing", "phase": "2–3", "price_range": "per loan", "note": "Especially in a niche-lending model."}, {"layer": "Equity value of the charter", "phase": "3+", "price_range": "acquisition / franchise value", "note": "Many de novos are ultimately acquired — the charter itself is the asset."}], "launch_cadence": [{"window": "Year -1 → 0 (pre-charter)", "actions": "Assemble the team, write the niche thesis, line up capital commitments, file the charter application."}, {"window": "Charter approval (~1–3 yrs)", "actions": "Survive the regulatory process; build or contract the core system; hire compliance."}, {"window": "Year 0–1 (launch)", "actions": "Open deposit products with a competitive rate; build the funding base; begin conservative lending."}, {"window": "Year 1–3 (scale)", "actions": "Grow the loan book, protect credit quality, layer in fee income; the spread turns net-positive."}], "players_map": {"regulators": ["OCC / state banking dept (charter)", "F illustrative"}, {"label": "Cash-negative window", "value": "~0–2", "unit": "yrs", "source_url": null, "as_of_date": "2026-07-26", "confidence": "illustrative"}], "confidence": "ballpark", "unknowns": ["Exact capital minimums vary by state, charter type, and business plan — not pinned here.", "BaaS economics (revenue split with the partner bank) vary widely by provider and deal.", "Approval timelines swing with the regulatory climate; de novo activity has ebbed and flowed sharply.", "This is an educational model, not legal or financial advice — a real formation needs banking counsel."]}, "recall": {"glyph_prompt": "Picture a long uphill ramp of pure cost — legal, tech, staff, deposit-buying — leading to a single gate marked 'CHARTER'. Only past the gate does the ground tilt downhill and the spread start paying. The whole buildout is getting to the gate with cash still in the tank.", "three_questions": ["What are the two routes to run a bank, and what does each trade off?", "Why are years 0–2 cash-negative by design, and what flips it positive?", "What is the real moat — and why can't a competitor just buy it?"], "last_reviewed": null, "next_review": null, "ease": null}}, {"id": "banking-retail", "name": "Retail Banking", "aka": ["commercial banking", "depository institution"], "sector": "Financial services", "geography": "Global; figures skew US", "era": "Modern form since ~17th c. goldsmith-bankers; deposit banking much older", "mode": "teardown", "date_walked": "2026-07-26", "chain": {"parent_id": null, "relation": "seed", "relation_note": "First entry in the Atlas. The chain grows from here.", "chain_position": 0, "suggested_next": [{"id": "core-banking-software", "relation": "upstream_supplier", "why": "The software rails every bank runs on — who sells the picks and shovels?"}, {"id": "payment-networks", "relation": "symbiote", "why": "Visa/Mastercard sit on the same money flow and run a pure toll-booth."}, {"id": "insurance-underwriting", "relation": "substitute
