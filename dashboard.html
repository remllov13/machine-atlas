grade contracts at a higher rate", "value": "DDTL 4.0 $8.5B; DDTL 5.0 $3.1B", "as_of_date": "2026-05-01", "source_url": "https://io-fund.com/ai-stocks/nvidia-coreweave-nebius-circular-financing-gpu-boom", "confidence": "medium"}], "unknowns": ["Current single-customer concentration. Microsoft was >60% of 2024 revenue per the S-1, but CoreWeave has since shifted weight toward OpenAI and others and no longer discloses a clean single-customer percentage -- so today's concentration is inferred, not reported.", "The true economic useful life of the GPUs. CoreWeave depreciates them over a set schedule (reported around six years), but how long an accelerator earns top-dollar GPU-hour rates before a newer NVIDIA generation collapses its price is the central, unresolved assumption of the whole model.", "How much of the $132.5B backlog is firm, cash-good demand versus commitments from a few counterparties (some of them loss-making AI labs) that could be renegotiated or missed if the AI capex cycle cools.", "The exact NVIDIA ownership percentage and the full terms of the backstop, which are drawn from secondary reporting of SEC filings rather than a single clean primary figure here."], "disclaimer": "Educational teardown for pattern-recognition, not investment advice. CoreWeave is a volatile, heavily-indebted, recently-public company and the figures here are snapshots that age quickly."}, "recall": {"glyph_prompt": "The same gold-rush valley at night. Between the green-eyed general store (NVIDIA) and the muddy prospectors stands a sharp-suited middleman at a rented stall. He has no shovels of his own -- he buys armfuls from the store on a line of credit, each shovel tagged with a paper IOU, and hands them out to miners who've signed long paper leases pinned to the stall. Behind him, a banker weighs the stack of signed leases and the shovels themselves on a scale marked COLLATERAL, then slides him more credit. The green-eyed shopkeeper has quietly dropped a coin in the middleman's own tip jar (an equity stake) and promised to buy back any shovel no miner rents. But the shovels are visibly rusting in the rain -- a newer, shinier model glints in the store window -- and the IOUs keep ticking.", "questions": ["CoreWeave rents GPUs, but its real product is financial. What is it actually manufacturing out of scarce chips -- and why do investors price its backlog instead of its earnings?", "Adjusted EBITDA margin is ~62% but the company loses money. Name the two costs that live in the gap, and explain why one of them is a ticking clock.", "Why does NVIDIA both invest in CoreWeave AND agree to buy its unsold capacity? What does the shovel-seller get from financing its own reseller -- and why do critics call it circular?"]}, "economics_lens": {"concept": "Economic rent from a rationed input (intermediation arbitrage), carried on operating leverage", "micro_or_macro": "micro", "explain": "When a seller rations a good -- allocating it rather than letting price rise until supply meets demand -- a gap opens between the controlled price and what buyers would actually pay. Whoever secures an allocation can resell access and pocket that gap: an economic rent that exists only because the market isn't allowed to clear. NVIDIA rations GPUs (it allocates scarce chips to favored buyers instead of auctioning them to the highest bidder), and CoreWeave's entire business is capturing the resulting rent at industrial scale -- it is the 'middleman who exists only to resell scarce silicon.' Two further forces shape the machine. First, operating leverage and extreme capital intensity: nearly all the cost is fixed (depreciation on the chips and interest on the debt that bought them), so above the breakeven utilization each extra GPU-hour is almost pure margin -- which is why cash margins look huge while the bottom line is thin. Second, the rent is self-erasing: a rent that comes from scarcity disappears as the scarcity does. As NVIDIA supply catches up and each GPU generation makes the last one cheap, the premium on access shrinks -- yet the debt and the fixed contracts remain. CoreWeave is thus a vivid lesson in why rents from rationing are real but perishable, and why financing a perishable rent with long, heavy leverage is where the fragility lives."}}, {"identity": {"id": "frontier-room", "name": "The Frontier Room — AI Builders' Club", "aka": ["Fort Lauderdale AI Builders' Club", "the screened room", "a convening layer", "working title: Current"], "sector": "Community / convening / ecosystem infrastructure", "geography": "Fort Lauderdale / South Florida (Broward, between Miami and Boca)", "era": "2025–present AI boom; the local builder-room gap", "mode": "buildout", "date_walked": "2026-11-17"}, "chain": {"parent_id": null, "relation": "root", "relation_note": "A second root, and the human end of the stack NVIDIA and TSMC sit at the bottom of. The silicon chain ends in GPUs; this is a room full of the people renting those GPUs to build. Where the hardware entries are about owning a scarce physical input, this one is about owning a scarce social input — proximity to the best builders. Same word runs through both: whoever controls the bottleneck everyone must pass through sets the terms.", "chain_position": 1, "suggested_next": [{"id": "ai-tinkerers", "relation": "template", "why": "The exact model being copied — screened, demo-first, no-pitch builder meetups, sponsor-funded. A teardown of the template shows the working machine this buildout borrows from 30 miles south."}, {"id": "coworking-spaces", "relation": "substitute", "why": "The generalist-clubhouse business (WeWork, General Provision) this deliberately is NOT — real estate and rent vs. curation and signal. The clearest contrast class for why asset-light convening is a different business."}, {"id": "venture-capital", "relation": "customer", "why": "The capital layer the room sells deal-flow access to. A teardown of how a VC fund makes money explains why a convener's 'first look' seat converts to scout fees and carry — the room's real prize."}]}, "one_line": "Own the room the region's best AI builders choose to stand in, and you own the gravity — you never pay for real estate, you charge sponsors to stand near the talent, and your real pay is being the first person every deal and hire passes through.", "why_now": "South Florida's capital is here and AI-hungry — roughly $2B of venture flowed into the region in H1 2025 — but the builder infrastructure outside Miami's Wynwood core hasn't caught up. Serious Fort Lauderdale AI talent currently commutes ~37 minutes south to Miami and hands its energy to that scene. There is no screened, demo-first AI builders' room anchored in Broward. The window: AI is in its 'third inning' where winners are deep verticalized B2B companies, exactly the serious builders a screened room selects for — and the category name in Fort Lauderdale is unclaimed.", "structural_gap": "Fort Lauderdale has the talent, the capital nearby (Las Olas VC and others are headquartered in the city itself), and institutional anchors (NSU's Levan Center, FAU Tech Runway) — but no screened, demo-first AI builders' room of its own. The serious builder energy leaks south to Miami because there is nowhere local worth staying for. The gap is not a missing building; it is a missing standard.", "engine": {"inputs": ["A screened cohort of 40–80 active AI builders (the scarce social input)", "A borrowed venue for one evening a month (General Provision, NSU Levan, FAU)", "One infrastructure/cloud sponsor covering food and space", "A 60-second screening form and a between-meetups channel (Slack/Discord)", "The convener's own time and judgment — the standard is held, never delegated"], "transformation": "Convert a venue's idle evening and a sponsor's marketing budget into concentrated proximity — a screened room where running code earns the floor. Filter hard so the conversation stays builder-to-builder, run live demos instead of pitches, and let density pull talent, talent pull demos, demos pull capital, and capital pull more talent. The convener stands at the hub, informed first and trusted most.", "outputs": ["A recurring, screened room of active AI builders (the compounding relationship asset)", "Demo videos that recruit next month's cohort at $0 ad spend", "A deal-flow and talent information edge sold to sponsors and capital", "The convener's seat: first look at the region's talent, tools, and raises"], "money_in": "Event sponsorship (launch-day revenue), annual partner tiers, optional member dues, talent/recruiting access fees, and — the uncapped layer — capital-side upside (scout fees, advisory equity, syndicate carry) on companies seen first.", "money_out": "Near-zero cash: food and venue are sponsor- and partner-covered; tooling runs ~$30/month. The real cost is sweat and the discipline to protect the standard.", "the_spread": "A night costs ~$650–1,200 to run and a single event sponsor pays $1,500–3,000 — so the room is cash-positive or break-even from night one, but the actual spread is non-cash: reputation and a deal-flow seat bought cheaply now, cashed out later as scout fees and equity.", "leverage_point": "Asset-light curation. Because the product is the room and not the real estate, the convener borrows every physical input and keeps the two things that compound and cannot be bought: the screening relationship (trust) and the standing as 'the room' (reputation)."}, "unit": "One monthly ~50-person meetup. The whole model is legible in a single night: ~$650–1,200 cash cost, covered by one $1,500–3,000 sponsor for a net of +$300 to +$1,800; and the real yield — ~5 demo videos, ~50 screened relationships, 1 convener's information edge, and 1–2 standout builders worth championing to capital (the seed of the uncapped upside).", "one_unit_economics": {"unit_name": "One ~50-person meetup night", "line_items": [{"item": "Venue (~50 cap, 3 hrs)", "cash": "$0 (market $800–1,500)", "covered_by": "Venue partner", "confidence": "illustrative"}, {"item": "Food + drinks (50 people)", "cash": "$600–900", "covered_by": "Event sponsor", "confidence": "illustrative"}, {"item": "A/V (screen + mic)", "cash": "$0", "covered_by": "Venue", "confidence": "illustrative"}, {"item": "Video capture of demos", "cash": "$0–300", "covered_by": "Volunteer / sponsor", "confidence": "illustrative"}, {"item": "Tools (Luma + Discord + form)", "cash": "~$30/mo", "covered_by": "You", "confidence": "illustrative"}, {"item": "Sponsor pays", "cash": "$1,500–3,000", "covered_by": "1 sponsor", "confidence": "illustrative"}], "summary": "Total cash needed ~$650–1,200; one sponsor covers it; net cash +$300 to +$1,800 per night. The cash is a rounding error — the point is the relationships and demo content the night produces. Figures are the playbook's own illustrative ranges, to validate locally with real sponsors."}, "operating_model": "A screened, monthly, demo-first room of 40–80 active AI builders — NOT a coworking space, a lease, a 'tech networking' mixer, a recruiting floor, or a lecture series. Borrow venues rather than build; a 60-second application protects signal density (admit people actively shipping AI, decline spectators and recruiters). Running code earns the floor: ~3 hours, two sets of 5-minute live demos, technical Q&A, Wednesday evenings. It is a cadence, not an event — monthly to start, with a quarterly hack night and an annual flagship 'Demo Day.' The convener owns the moderation voice from night one: correct the behavior, keep the person; protect signal over growth.", "money_stack": [{"layer": "Event sponsorship", "phase": "Launch (1→)", "price_range": "$1.5–3k / night", "note": "Covers food + logo + 60-sec intro. Parallel: Agentuity @ AI Tinkerers Miami."}, {"layer": "Annual partner tiers", "phase": "Cadence (2→)", "price_range": "$7.5–25k / yr", "note": "Founding $15–25k, Core $7.5–12k. Recurring sponsor packages: logo, demo intro slot, hiring access."}, {"layer": "Member dues (optional)", "phase": "Cadence (2→)", "price_range": "$25–40 / mo", "note": "40 members × $30 ≈ $14k/yr. Gate Core perks, not access."}, {"layer": "Talent / recruiting", "phase": "Cadence→Compound (2–3→)", "price_range": "$5–15k / hire", "note": "Hiring-access add-on; the screened room is the filter employers pay for."}, {"layer": "Capital-side upside (illiquid)", "phase": "Compound (3→)", "price_range": "scout / equity / carry", "note": "Scout fees $5–25k per funded deal, advisory equity 0.25–1%, micro-syndicate 10–20% carry. Where convening → deal flow → wealth. The uncapped prize."}], "players_map": {"conveners_to_study": ["AI Tinkerers Miami (the direct template)", "Refresh Miami (16k+ members, best distribution)", "eMerge Americas", "Miami Hack Week"], "capital": ["Las Olas Venture Capital (Fort Lauderdale, Mark Volchek)", "Fuel Venture Capital", "1001 VC", "DeepWork Capital", "Blumberg Capital"], "anchors": ["NSU Alan B. Levan Center of Innovation", "FAU Tech Runway", "General Provision (primary venue)", "Tech Lauderdale"], "sponsors": ["Agentuity (warmest first call)", "PostHog", "Replit", "AWS / Google Cloud / Azure credit programs", "Model labs: Anthropic, OpenAI, Google dev-rel"], "builders": ["Pillar", "FirmPilot", "Prescient AI", "Exowatt", "Guardz", "Mytaverse", "1PLTFRM"]}, "plays": [{"play_name": "Borrow the Room", "tagline": "Bring the builders; let someone else own the walls.", "flow": [{"step_title": "Find idle venues", "step_desc": "Partners who already want builder foot traffic — a founder clubhouse, a university innovation center — have empty evenings worth $800–1,500."}, {"step_title": "Trade the crowd for the space", "step_desc": "You bring ~50 vetted builders, brand, photos, and programming they don't have to create; they give you the room at $0 cash."}, {"step_title": "Rotate, don't lease", "step_desc": "Keep several venues in rotation so you never sign a lease, never carry rent, and can flex through lean months."}], "the_move": "Never buy the asset that depreciates. Convert a venue's idle evening into your platform, and keep your balance sheet empty on purpose.", "in_the_wild": {"name": "The LAB Miami built its brand partly by hosting the AI builder scene, and AI Tinkerers Miami runs on a borrowed venue (The LAB) with a sponsor (Agentuity) covering costs — a working asset-light room 30 miles south", "confidence": "medium"}, "watch_out": "A borrowed room means a borrowed standard. If a venue starts dictating who gets in or turns the night into its own showcase, the signal dies — the convener must hold the admission decision, always.", "mechanics": ["asset-light", "value-exchange", "venue-arbitrage", "no-lease-resilience"]}, {"play_name": "Screen Hard", "tagline": "The filter is the product, not the gate.", "flow": [{"step_title": "Ask one real question", "step_desc": "'What are you building or shipping with AI right now?' plus a link. Sixty seconds of friction is the whole filter."}, {"step_title": "Admit builders, decline spectators", "step_desc": "Auto-admit hands-on builders; ratio-cap adjacent roles; decline pure sales, recruiters, and the 'AI-curious.'"}, {"step_title": "Cap the room", "step_desc": "A hard seat cap manufactures demand — scarcity plus screening makes admission mean something."}], "the_move": "Curation is not gatekeeping — it is the asset. A screened room of fifty people shipping AI beats a thousand badge-scanners, so you filter hard and never apologize for it.", "in_the_wild": {"name": "AI Tinkerers caps some meetups at ~30 builders and screens for active builders only; the scarcity and screening are exactly what make the room worth being admitted to", "confidence": "medium"}, "watch_out": "Signal dilution is the fastest way to die — admitting non-builders to grow the headcount turns the room into 'just another mixer,' and the moat evaporates the night a spectator gets the floor.", "mechanics": ["curation-as-moat", "scarcity-power", "signal-density", "adverse-selection-defense"]}, {"play_name": "Demos Beat Decks", "tagline": "Running code earns the floor; nobody pitches.", "flow": [{"step_title": "Set the standard", "step_desc": "Live demos only — no slides, no vendors, no recruiters working the edges. What you shipped this week is the only credential."}, {"step_title": "Film everything", "step_desc": "Every 5-minute demo is captured on video, turning one night into a library of proof."}, {"step_title": "Let the clips recruit", "step_desc": "Published demo clips are the marketing that pulls next month's cohort — at $0 ad spend."}], "the_move": "Make the content produce its own distribution. By demanding real, shipped work on stage, the room generates the exact artifacts that recruit the next, better cohort for free.", "in_the_wild": {"name": "AI Tinkerers' demo-first, no-pitch format is the direct template — monthly screened builder nights of roughly 150 attendees built on running code, not decks", "confidence": "medium"}, "watch_out": "The moment a sponsor is allowed to pitch from the stage, the room stops being builder-to-builder. Vendor capture is a slow poison — the standard has to be held hardest exactly when the money asks to bend it.", "mechanics": ["content-flywheel", "proof-of-work", "zero-cac-marketing", "standard-as-product"]}, {"play_name": "Layer the Money", "tagline": "Keep the lights on with sponsors; get rich on the seat.", "flow": [{"step_title": "Start with one sponsor", "step_desc": "An infra or cloud sponsor covers food and space per night — launch-day revenue that makes the room cash-neutral immediately."}, {"step_title": "Stack recurring layers", "step_desc": "Add annual partner tiers, optional dues, and paid hiring access as the room proves value."}, {"step_title": "Hold the option", "step_desc": "The real return is the convener's seat — first look at talent and deals that converts to scout fees, advisory equity, and carry."}], "the_move": "Treat cash sponsorship as the floor and the deal-flow seat as the ceiling. Layers 1–4 might total $40–100k a year — real but capped; Layer 5 is uncapped, because one scouted deal in a company you saw first can dwarf every cash line combined.", "in_the_wild": {"name": "Agentuity sponsored nearly every recent AI Tinkerers Miami event and The LAB provided the venue — a proven sponsor-plus-venue revenue base in this exact market, 30 miles away", "confidence": "medium"}, "watch_out": "Chasing the capped cash (more dues, more tiers) while neglecting the uncapped seat is the classic error — the money that changes your life is the equity position, and it only accrues if the room's signal stays worth a first look.", "mechanics": ["revenue-layering", "optionality", "convener-information-edge", "deferred-upside"]}, {"play_name": "Stand at the Hub", "tagline": "Convene the flywheel; don't just watch it spin.", "flow": [{"step_title": "Concentrate density", "step_desc": "A screened room puts the best AI builders in one place, repeatedly."}, {"step_title": "Let density produce signal", "step_desc": "Density produces demos and the region's earliest news, which pulls investors and infra money toward the room."}, {"step_title": "Compound the cohort", "step_desc": "Capital and reputation attract the next, better cohort — and each turn makes the next easier."}], "the_move": "Sit at the hub, not outside it. The convener who stands at the center of the loop is informed first and trusted most, and that position compounds into the most valuable seat in the regional scene.", "in_the_wild": {"name": "Refresh Miami grew into the region's largest tech community (16,000+ members) and its #MiamiTech newsletter became the best distribution channel in South Florida — the convener's-seat flywheel, proven at scale", "confidence": "medium"}, "watch_out": "The fuel is curation and cadence, not real estate — skip months (cadence collapse) or burn out as a solo organizer and the wheel stops. Distribute to a Core team early, or the hub you built collapses onto one exhausted person.", "mechanics": ["network-effects", "flywheel", "first-mover", "cadence-trust"]}], "mechanics_summary": [{"tag": "asset-light", "note": "The product is the room, not the real estate — borrow every physical input and carry no lease, so the model flexes and survives lean months."}, {"tag": "curation-as-moat", "note": "The screening relationship is trust that compounds and cannot be bought by a competitor. The filter is the asset, not the gate."}, {"tag": "network-effects", "note": "Density pulls talent, talent pulls demos, demos pull capital, capital pulls more talent — a flywheel where each turn makes the next easier."}, {"tag": "content-flywheel", "note": "Filmed demos become the zero-cost marketing that recruits the next cohort; the room generates its own distribution."}, {"tag": "convener-information-edge", "note": "Standing at the hub means knowing who and what is moving first — the seat that converts to scout fees, advisory, and reputation."}, {"tag": "optionality", "note": "Capped cash layers keep the lights on; the uncapped prize is an equity/scout option on the region's best startups, seen first."}, {"tag": "first-mover", "note": "No screened AI builders' club is anchored in Broward yet — reputation is slow to build and hard to copy, so owning the category name early is the moat."}], "history": {"origin": {"who": "The convener (Andrew), modeling on Refresh Miami and AI Tinkerers", "when": "Conceived 2025–2026 against the South Florida AI capital boom", "what_problem_forced_it": "Serious Fort Lauderdale AI builders had nowhere local to convene and defaulted to a ~37-minute drive to Miami's scene, bleeding the region's talent energy south. The playbook's insight: Fort Lauderdale is not the periphery but the geographic midpoint between Boca's FAU Tech Runway (~20 mi north) and Miami (~30 mi south) — a room here lowers the access cost from both directions and pulls the center of gravity into open territory."}, "operator": {"name": "AI Tinkerers Miami + The LAB Miami (the template operators)", "what_they_did": "Ran the exact unit — screened, demo-first, no-pitch builder nights, free to attendees, with food and venue covered by a sponsor (Agentuity) and a host (The LAB). Proved that an asset-light convening layer works in this specific market.", "outcome": "A durable, sponsor-funded monthly room of ~150 builders 30 miles south — the working machine this buildout copies rather than invents. 'Good artists copy; great artists steal what works.'"}, "counterexample": {"name": "The generalist clubhouse (e.g. a WeWork-style coworking lease)", "what_they_did": "Sells space and broad community — rent from memberships, dedicated desks, private offices — with high capital needs (long lease, build-out, staffed campus) and a moat of location plus hospitality.", "why_it_broke": "That moat is replicable with capital; the convener is a landlord of a network, not the hub of its deal flow. The lesson this buildout inverts: in a curation-and-trust business, signing a lease to grow headcount is the move that converts a high-margin reputation asset into a low-margin real-estate business exposed to every empty desk."}}, "epistemics": {"numbers": [{"claim": "Roughly $2B of venture capital into South Florida in H1 2025", "value": "~$2B", "as_of_date": "2026-11-17", "source_url": null, "confidence": "illustrative"}, {"claim": "Fastest observed Fort Lauderdale → Miami AI-scene drive ~37 min; typical mid-week ~60 min", "value": "37–60 min", "as_of_date": "2026-11-17", "source_url": null, "confidence": "illustrative"}, {"claim": "Miami ranked No. 22 globally and No. 10 among US metros (2025 Global Startup Ecosystem Report)", "value": "#10 US / #22 global", "as_of_date": "2026-11-17", "source_url": null, "confidence": "illustrative"}, {"claim": "One meetup: ~$650–1,200 cash cost, $1,500–3,000 sponsor, net +$300 to +$1,800", "value": "net +$300–1,800/night", "as_of_date": "2026-11-17", "source_url": null, "confidence": "illustrative"}, {"claim": "Screening funnel per event: ~150 applications → 70 admitted → 50 attend → 5 demo → 1–2 standouts", "value": "150→70→50→5→1-2", "as_of_date": "2026-11-17", "source_url": null, "confidence": "illustrative"}], "overall": "illustrative", "unknowns": ["Every figure here comes from Andrew's own Frontier Room playbook as an illustrative planning range — none were independently re-verified in this session against primary sources (VC totals, the Global Startup Ecosystem Report, drive times).", "The revenue stack (sponsor tiers, scout fees, carry) is a plan to pressure-test with real South Florida sponsors, not booked revenue.", "Whether Fort Lauderdale's builder density is actually sufficient to sustain a monthly screened room is the core untested assumption.", "This is educational business analysis and a founder's own planning document, not investment or legal advice; convening, sponsorship, and any syndicate/scout activity carry regulatory and tax considerations to check locally."]}, "recall": {"glyph_prompt": "A single lit room on the ground floor of a borrowed building, halfway up a dark coastline between two city glows — Boca's lights to the north, Miami's brighter blaze to the south. Inside, fifty people crowd around a laptop on a stool where someone is running live code; no stage, no slides, no lanyard-scanners. At the doorway stands the convener, not charging admission but checking a single question on a phone — 'what are you building?' — and quietly turning away the suits with pitch decks. Through the window, investors and sponsors press their faces to the glass, trying to get in. The room owns no walls, pays no rent, and is the most valuable address in the region.", "questions": ["What is the actual product — the venue, the coffee, the membership, or the room itself? (And why does owning no real estate make the moat stronger, not weaker?)", "The cash from one night is a rounding error. So what is the convener really being paid in, and when does it pay out?", "Name the one admission decision the convener can never delegate, and what dies the night they get it wrong."]}, "economics_lens": {"concept": "Network effects and two-sided markets (increasing returns to density)", "micro_or_macro": "micro", "explain": "The room is a two-sided market: builders want to be where the other best builders and the capital are, and sponsors/investors want to be where the screened builders are — each side's value rises with the other's participation, a direct Metcalfe-style network effect. Curation is the mechanism that keeps the externality positive: admitting non-builders would be a congestion/adverse-selection effect that dilutes the signal every member came for, so the screen is really externality management. And because reputation and trust compound while real estate depreciates, the business tends toward increasing returns for the first credible convener — the same winner-take-most logic that makes NVIDIA's developer ecosystem hard to dislodge, here running on people instead of silicon."}}, {"id": "payment-networks", "name": "Payment Networks", "aka": ["card networks", "card schemes", "Visa/Mastercard rails"], "sector": "Financial services", "geography": "Global; figures skew US", "era": "Modern form since BankAmericard (1958) → Visa (1970s); still dominant", "mode": "teardown", "date_walked": "2026-07-27", "chain": {"parent_id": "banking-retail", "relation": "symbiote", "relation_note": "Networks sit on the same money flow as banks: banks issue the cards and lend, the network moves the authorization and clips a toll. Neither works without the other.", "chain_position": 1, "suggested_next": [{"id": "payment-processors", "relation": "downstream_customer", "why": "Stripe, Adyen, Square — the layer merchants actually touch, sitting on top of the network rails."}, {"id": "card-issuing-banks", "relation": "symbiote", "why": "The side that collects the fat interchange the network directs to it — the other half of the two-sided machine."}, {"id": "real-time-payment-rails", "relation": "substitute", "why": "FedNow, account-to-account, and stablecoins aim to move money without the card toll — the modern threat to the rails."}]}, "one_line": "Own the rails money rides on, clip a thin toll off every trip — and never touch the money itself.", "engine": {"inputs": "A tap or a swipe — a request to move money between a shopper's bank and a merchant's bank", "transformation": "Route the authorization across the network, set the fee schedule, and guarantee the transaction settles", "outputs": "A cleared payment, and a stream of tiny per-transaction fees", "money_in": "Network assessment/service fees (~0.13–0.14% of volume), per-transaction data-processing fees, and premium cross-border fees", "money_out": "Running the rails, fraud/security, incentives paid to banks to issue the network's cards", "the_spread": "a tiny % of an enormous volume  (fee-per-swipe × trillions in flow)", "leverage_point": "Asset-light: the network owns no cash and no receivables — it taxes movement, so revenue scales with total spend at near-zero marginal cost"}, "unit": {"unit_name": "One card transaction", "unit_economics": "On a $100 US credit purchase the merchant loses ~$2–3 total. Almost all of that (~86% of the merchant's cost) is interchange that goes to the shopper's BANK, not the network. The network itself keeps only its thin assessment (~$0.13–0.14) plus small data-processing fees. Figures ballpark; vary by card type and geography.", "what_one_unit_produces": "Data on the transaction, one more reason every merchant must accept the network, and one more reason every bank wants to issue its cards — the flywheel tightening by one turn."}, "plays": [{"play_name": "The Toll", "tagline": "Don't hold the money. Tax the movement.", "flow": [{"step_title": "Sit on the flow", "step_desc": "Own the rails every card payment must cross."}, {"step_title": "Clip a sliver", "step_desc": "Take a fraction of a percent of each transaction — too small to fight, on every purchase."}, {"step_title": "Scale with spend", "step_desc": "Revenue rises with total volume at almost no extra cost, because you own no balance sheet."}], "the_move": "A tiny toll is invisible per-swipe and colossal across trillions. Own the road, not the cars.", "in_the_wild": "In fiscal 2025 Visa processed roughly $14 trillion in payments volume across ~258 billion transactions and reported about $40 billion in net revenue; Mastercard handled around $9.2 trillion in gross dollar volume.", "watch_out": "The toll is a regulatory target. Caps and antitrust settlements can compress the take rate you rely on.", "glyph_id": "thetoll", "mechanics": ["toll-booth", "asset-light", "platform-tax"]}, {"play_name": "Pay the Issuer", "tagline": "Route the fat fee to the banks so they push your card.", "flow": [{"step_title": "Set the interchange", "step_desc": "The network SETS the ~2% interchange fee — but doesn't keep it."}, {"step_title": "Hand it to the bank", "step_desc": "That fat fee flows to the bank that issued the shopper's card."}, {"step_title": "Banks push your rails", "step_desc": "Rich interchange makes every issuer want to hand out YOUR cards, not a rival's."}], "the_move": "Give away the big fee to align the banks; keep the small, unstoppable one for yourself.", "in_the_wild": "Interchange makes up the large majority of the merchant's swipe cost — combined US credit interchange averaged about 2.36% in 2025 — and it funds the rewards programs banks use to compete for cardholders.", "watch_out": "This is what regulators attack: the US Durbin Amendment capped debit interchange, gutting that slice for issuers overnight.", "glyph_id": "payissuer", "mechanics": ["two-sided-network", "commoditize-your-complement", "bundling"]}, {"play_name": "Border Toll", "tagline": "The fattest margin lives at the border.", "flow": [{"step_title": "Wait for a foreigner", "step_desc": "A cardholder pays outside their home country."}, {"step_title": "Stack premium fees", "step_desc": "Cross-border and currency-conversion fees apply on top of the normal toll."}, {"step_title": "Bank the spread", "step_desc": "These are among the network's most profitable transactions."}], "the_move": "Same rails, higher toll — charge a premium exactly where travelers have no alternative.", "in_the_wild": "Cross-border is a disproportionately profitable line for both Visa and Mastercard, though its volume growth has decelerated for three straight years into 2025.", "watch_out": "Cross-border volume tracks travel and trade — it slumps in downturns and pandemics, taking the premium with it.", "glyph_id": "bordertoll", "mechanics": ["arbitrage", "brand-premium", "scarcity-manufacture"]}, {"play_name": "Two-Sided Lock", "tagline": "Every cardholder pulls a merchant; every merchant pulls a cardholder.", "flow": [{"step_title": "Win both sides", "step_desc": "Get cards into wallets AND terminals into stores."}, {"step_title": "Make refusal costly", "step_desc": "A merchant can't decline the network everyone carries; a shopper wants the card accepted everywhere."}, {"step_title": "Compound the moat", "step_desc": "Each new cardholder makes acceptance more essential, and vice versa — a self-tightening loop."}], "the_move": "Don't out-feature rivals — out-network them. Ubiquity itself becomes the product no one can copy.", "in_the_wild": "Visa and Mastercard together account for more than 80% of US credit card transaction volume; challengers struggle to break a moat built on universal acceptance.", "watch_out": "The same ubiquity draws antitrust scrutiny — and new rails can bootstrap their own network effect from a big platform's user base.", "glyph_id": "twosidedlock", "mechanics": ["two-sided-network", "economies-of-scale", "lock-in"]}, {"play_name": "Beyond the Swipe", "tagline": "Once you own the rails, sell services on top of them.", "flow": [{"step_title": "Start with the toll", "step_desc": "The core transaction fee funds everything."}, {"step_title": "Layer on services", "step_desc": "Fraud scoring, tokenization, data analytics, consulting, real-time-payment products."}, {"step_title": "Diversify the take", "step_desc": "Value-added services grow faster than the toll and hedge against interchange pressure."}], "the_move": "Turn the rails into a platform — sell the tools everyone riding them needs.", "in_the_wild": "Both networks have pushed hard into value-added services and acquisitions to grow revenue beyond pure transaction fees as regulatory pressure on interchange rises.", "watch_out": "Services revenue is more competitive and less moat-protected than the toll — it's a real market, not a tollgate.", "glyph_id": "beyondswipe", "mechanics": ["data-flywheel", "bundling", "platform-tax"]}], "mechanics_summary": [{"tag": "toll-booth", "note": "Sit on a flow and charge a small fee each time value passes — the purest version of this mechanic."}, {"tag": "two-sided-network", "note": "Cardholders and merchants each make the other side more valuable; the loop is the moat."}, {"tag": "asset-light", "note": "The network owns no money and no credit risk — it taxes movement, so it scales almost for free."}, {"tag": "platform-tax", "note": "Take a cut of transactions you host without being party to them."}, {"tag": "commoditize-your-complement", "note": "Route the fat interchange to banks so issuance (your complement) is abundant and loyal to you."}, {"tag": "regulatory-moat", "note": "Cuts both ways — scale deters entrants, but the same dominance invites caps and antitrust."}], "history": {"origin": {"who": "Bank of America (BankAmericard) and the banks behind Interbank / Master Charge", "when": "1958 (BankAmericard); networks formalized through the 1960s–70s", "what_problem_forced_it": "A single bank's card was only useful at merchants that bank had signed. Merchants and banks needed a universal system so ANY bank's card would work at ANY merchant — the network was the shared switchboard that made cards interoperable, and the toll paid for running it."}, "operator": {"name": "Dee Hock, founder of Visa", "what_they_did": "Reorganized BankAmericard into a member-owned cooperative (Visa) in the 1970s — a deliberately decentralized structure owned by the banks that used it, so competitors could cooperate on shared rails while competing for cardholders.", "outcome": "Visa grew into the largest payment network on earth; the cooperative later went public as a for-profit company worth hundreds of billions."}, "counterexample": {"name": "The Durbin Amendment (2010) and interchange litigation", "what_they_did": "US regulators capped debit-card interchange, and a long-running antitrust fight forced credit interchange concessions and settlements into the 2020s.", "why_it_broke": "The model's dependence on interchange is also its exposure: when the fee that aligns banks is capped by law, the flywheel's fuel is rationed — proof that a regulatory moat can become a regulatory ceiling."}}, "epistemics": {"numbers": [{"label": "Visa FY2025 payments volume", "value": "~14", "unit": "T USD", "source_url": "https://www.spark.money/research/card-network-economics-visa-mastercard", "as_of_date": "2026-07-27", "confidence": "ballpark"}, {"label": "Visa FY2025 net revenue", "value": "~40", "unit": "B USD", "source_url": "https://www.spark.money/research/card-network-economics-visa-mastercard", "as_of_date": "2026-07-27", "confidence": "ballpark"}, {"label": "Mastercard FY2025 gross dollar volume", "value": "~9.2", "unit": "T USD", "source_url": "https://www.spark.money/research/card-network-economics-visa-mastercard", "as_of_date": "2026-07-27", "confidence": "ballpark"}, {"label": "Network assessment fee (Visa)", "value": "~0.13–0.14", "unit": "% of volume", "source_url": "https://chargebacks911.com/visa-interchange-fees/", "as_of_date": "2026-07-27", "confidence": "ballpark"}, {"label": "Combined US credit interchange avg (2025)", "value": "~2.36", "unit": "%", "source_url": "https://www.fool.com/money/research/average-credit-card-processing-fees-costs-america/", "as_of_date": "2026-07-27", "confidence": "ballpark"}, {"label": "Visa+MC share of US credit volume", "value": ">80", "unit": "%", "source_url": "https://www.fool.com/money/research/average-credit-card-processing-fees-costs-america/", "as_of_date": "2026-07-27", "confidence": "ballpark"}], "confidence": "ballpark", "unknowns": ["Exact split of the network's own take between assessment, data-processing, and cross-border fees is not broken out here.", "Figures come from secondary sources citing company filings, not read directly from the 10-Ks in this entry.", "Interchange rates and settlement terms are actively changing through ongoing litigation — treat 2025 figures as a moving target.", "Non-US economics differ sharply (e.g. EU interchange is capped far lower) — these numbers skew US."]}, "recall": {"glyph_prompt": "A tollbooth straddling a massive highway of money. Trillions of cars stream through and the network clips a single coin off each one — without ever owning a car. The fat toll doesn't stay in the booth: it's handed to the banks that sent the drivers, so the banks keep sending more.", "three_questions": ["On a $100 swipe, who actually keeps most of the ~$2–3 fee — the network or the bank? (the bank, via interchange; the network keeps a thin assessment)", "Why do issuing banks want to hand out Visa/Mastercard cards specifically?", "What is the network's real moat, and what two forces threaten it? (two-sided network effect; interchange regulation and real-time/stablecoin rails)"], "last_reviewed": null, "next_review": null, "ease": null}}, {"id": "banking-retail-buildout", "name": "Retail Banking", "aka": ["de novo bank", "starting a bank", "bank charter"], "sector": "Financial services", "geography": "US framing (charter + FDIC)", "era": "De novo formation, present day", "mode": "buildout", "date_walked": "2026-07-26", "chain": {"parent_id": "banking-retail", "relation": "same_business_inverse", "relation_note": "The buildout half of the golden pair — same machine as the teardown, viewed from the founder's side.", "chain_position": 0, "suggested_next": [{"id": "core-banking-software", "relation": "upstream_supplier", "why": "You can't launch without a core system — the first vendor you'd shop, and a business in its own right."}, {"id": "banking-as-a-service", "relation": "substitute", "why": "The modern shortcut: rent a chartered bank's rails instead of getting your own charter."}]}, "one_line": "Raise ~$20M of capital, win a charter, buy deposits cheap and lend them dear — then survive the years before the spread outruns the burn.", "engine": {"inputs": "Founder capital + regulatory approval + a deposit base", "transformation": "Convert equity capital into a charter, then leverage deposits ~10x into a loan book", "outputs": "A regulated balance sheet that earns the spread", "money_in": "Net interest income once loans are on the book; fees later", "money_out": "Charter/legal spend, core-system build, staff, and interest paid to win deposits", "the_spread": "loan yield − (deposit cost + operating cost + loan losses)", "leverage_point": "The charter itself — it's the license to run ~10x leverage legally; everything before it is pure cost"}, "unit": {"unit_name": "The de novo formation (one new bank)", "unit_economics": "~$10–50M initial capital (community banks ~$10–20M; regional 50M+); ~1–3 yrs to charter; roughly break-even for years 0–2 while deposits build. Figures illustrative — validate with counsel.", "what_one_unit_produces": "A perpetual, regulated money-machine and a balance sheet that compounds — plus a moat competitors need years and regulators to replicate."}, "plays": [{"play_name": "Niche Charter", "tagline": "Don't out-scale the big banks. Serve who they price out.", "flow": [{"step_title": "Pick the underserved", "step_desc": "A segment big banks decline — a local trade, an immigrant community, a specific small-business type."}, {"step_title": "Underwrite what you know", "step_desc": "Lend on relationship and local knowledge competitors can't read from a spreadsheet."}, {"step_title": "Own the category", "step_desc": "Become the default bank for that niche before anyone else notices it."}], "the_move": "The charter is expensive, so aim it at a lane where you already have an edge — not the open market.", "in_the_wild": "A.P. Giannini built Bank of Italy (later Bank of America) by banking working-class immigrants elite banks ignored in early-1900s San Francisco.", "watch_out": "Concentration risk — regulators scrutinize a book that's all one segment; you need diversification on the horizon.", "glyph_id": "nichecharter", "mechanics": ["regulatory-moat", "information-asymmetry", "brand-premium"]}, {"play_name": "Rails, Rented", "tagline": "Skip the charter. Rent someone else's.", "flow": [{"step_title": "Partner a chartered bank", "step_desc": "Use a Banking-as-a-Service provider that already holds the license."}, {"step_title": "Own the customer + product", "step_desc": "You build the app and brand; they hold the regulated balance sheet."}, {"step_title": "Launch in months, not years", "step_desc": "Trade a slice of economics for speed and near-zero charter cost."}], "the_move": "If the charter is the cost center, don't buy it — rent it, and put your capital into distribution instead.", "in_the_wild": "Most modern neobanks (Chime, Cash App banking features) run on partner-bank rails rather than their own charter.", "watch_out": "You don't own the moat — the partner does. Regulators have tightened BaaS oversight; the rails can change under you.", "glyph_id": "railsrented", "mechanics": ["asset-light", "platform-tax", "commoditize-your-complement"]}, {"play_name": "Deposit-First Launch", "tagline": "Win the funding before you chase the loans.", "flow": [{"step_title": "Lead with a rate", "step_desc": "Open with a competitive high-yield account to build a deposit base fast."}, {"step_title": "Prove liquidity to regulators", "step_desc": "A stable funding base is what lets you lend and satisfies examiners."}, {"step_title": "Deploy conservatively", "step_desc": "Lend the base out slowly, keeping credit quality pristine while you scale."}], "the_move": "Solve the chicken-and-egg (need deposits to lend, need loans to attract deposits) by buying deposits first.", "in_the_wild": "De novo and online banks routinely launch with a top-of-market savings rate to bootstrap a funding base before building the loan book.", "watch_out": "Hot money — rate-shopper deposits flee when a competitor outbids you, leaving you funding-short.", "glyph_id": "depositfirst", "mechanics": ["scarcity-manufacture", "capital-cycle", "spread"]}], "mechanics_summary": [{"tag": "regulatory-moat", "note": "The charter is a license competitors need years and regulators to replicate — a moat you buy with time, not just money."}, {"tag": "capital-cycle", "note": "Thin equity leveraged into a large book, governed by ratio; the whole game is surviving to where leverage pays."}, {"tag": "asset-light", "note": "The BaaS path avoids the balance sheet and the charter entirely — rent the rails."}, {"tag": "spread", "note": "Same core as the teardown — the buildout is just the cost of getting to the point where you earn it."}], "why_now": "Rate environments and the rise of Banking-as-a-Service have split the path in two: the classic charter route (slow, expensive, durable moat) and the rented-rails route (fast, cheap, no moat). A founder today actually chooses which business they're in — that choice is the whole strategy.", "structural_gap": "Big banks price out entire segments (thin-file borrowers, niche small businesses, specific communities). Those segments still need credit and a place to bank. The gap is a lane where relationship underwriting beats algorithmic underwriting — exactly where a focused de novo (or a niche neobank on rented rails) can win.", "one_unit_economics": {"line_items": [{"item": "Initial capital (community-scale)", "cash": "$10–20M", "note": "Regulators set the floor; more for regional ambitions", "confidence": "ballpark"}, {"item": "Charter/legal/compliance to approval", "cash": "$1–5M", "note": "Lawyers, consultants, application process", "confidence": "illustrative"}, {"item": "Core banking system + tech build", "cash": "$2–5M", "note": "The rails, or a big chunk of a BaaS fee if renting", "confidence": "illustrative"}, {"item": "Leadership + compliance staff (annual)", "cash": "$1–2M/yr", "note": "Experienced bankers regulators trust", "confidence": "illustrative"}, {"item": "Deposit acquisition (rate + marketing)", "cash": "millions, ongoing", "note": "The cost of winning trust with money", "confidence": "illustrative"}], "summary": "Years 0–2 are cash-negative by design — you're buying a charter and a deposit base before the spread turns positive. The prize is a compounding regulated balance sheet."}, "operating_model": "Assemble an experienced team first (regulators fund people, not just money) → file the charter with a clear niche thesis → raise capital from a consortium (rarely one person) → build or rent the core system → win a deposit base with competitive rates → lend conservatively to protect credit quality → scale the book as the spread compounds.", "money_stack": [{"layer": "Net interest income", "phase": "core", "price_range": "the spread × the book", "note": "The engine — grows with the balance sheet."}, {"layer": "Fee income", "phase": "2", "price_range": "account/card/overdraft/wire", "note": "Non-interest income; politically fragile but real."}, {"layer": "Loan origination / servicing", "phase": "2–3", "price_range": "per loan", "note": "Especially in a niche-lending model."}, {"layer": "Equity value of the charter", "phase": "3+", "price_range": "acquisition / franchise value", "note": "Many de novos are ultimately acquired — the charter itself is the asset."}], "launch_cadence": [{"window": "Year -1 → 0 (pre-charter)", "actions": "Assemble the team, write the niche thesis, line up capital commitments, file the charter application."}, {"window": "Charter approval (~1–3 yrs)", "actions": "Survive the regulatory process; build or contract the core system; hire compliance."}, {"window": "Year 0–1 (launch)", "actions": "Open deposit products with a competitive rate; build the funding base; begin conservative lending."}, {"window": "Year 1–3 (scale)", "actions": "Grow the loan book, protect credit quality, layer in fee income; the spread turns net-positive."}], "players_map": {"regulators": ["OCC / state banking dept (charter)", "FDIC (deposit insurance)", "Federal Reserve (holding co)"], "capital": ["Bank-focused private equity", "Consortium of local investors", "Experienced-banker founders"], "vendors": ["Core banking system providers", "Banking-as-a-Service platforms (rented-rails route)", "Compliance/KYC tooling"], "talent": ["Ex-regional-bank executives", "Chief credit + chief compliance officers", "Relationship lenders in the niche"]}, "risks": ["Regulatory rejection or years of delay — the charter is not guaranteed.", "The chicken-and-egg: deposits vs. loans, burning cash while you solve it.", "Credit quality slips while scaling — one bad loan cohort can sink a young book.", "Hot-money deposits flee when out-bid, creating a funding hole.", "On the BaaS path: partner-bank or regulatory changes pull the rails out from under you."], "moat": ["The charter itself — slow and hard to obtain, a durable regulatory moat (classic route).", "Relationship underwriting in a niche competitors can't read.", "First mover as the default bank for an underserved segment.", "Regulated trust — once examiners and depositors trust you, that standing compounds."], "first_five_moves": ["Choose the route: your own charter (durable moat, slow/expensive) or rented BaaS rails (fast/cheap, no moat).", "Write the niche thesis — exactly which underserved segment and why you can underwrite it better.", "Recruit an experienced banking team regulators will trust; this precedes the money.", "Line up consortium capital against that thesis (~$10–20M community-scale).", "File the charter (or sign the BaaS partner) and stand up the deposit product to start the funding base."], "epistemics": {"numbers": [{"label": "Initial capital, community-scale", "value": "$10–20", "unit": "M", "source_url": "https://www.fdic.gov/resources/bankers/de-novo-banks/", "as_of_date": "2026-07-26", "confidence": "ballpark"}, {"label": "Time to charter", "value": "~1–3", "unit": "yrs", "source_url": null, "as_of_date": "2026-07-26", "confidence": "illustrative"}, {"label": "Cash-negative window", "value": "~0–2", "unit": "yrs", "source_url": null, "as_of_date": "2026-07-26", "confidence": "illustrative"}], "confidence": "ballpark", "unknowns": ["Exact capital minimums vary by state, charter type, and business plan — not pinned here.", "BaaS economics (revenue split with the partner bank) vary widely by provider and deal.", "Approval timelines swing with the regulatory climate; de novo activity has ebbed and flowed sharply.", "This is an educational model, not legal or financial advice — a real formation needs banking counsel."]}, "recall": {"glyph_prompt": "Picture a long uphill ramp of pure cost — legal, tech, staff, deposit-buying — leading to a single gate marked 'CHARTER'. Only past the gate does the ground tilt downhill and the spread start paying. The whole buildout is getting to the gate with cash still in the tank.", "three_questions": ["What are the two routes to run a bank, and what does each trade off?", "Why are years 0–2 cash-negative by design, and what flips it positive?", "What is the real moat — and why can't a competitor just buy it?"], "last_reviewed": null, "next_review": null, "ease": null}}, {"identity": {"id": "openai", "name": "OpenAI", "aka": ["ChatGPT", "OpenAI Group PBC", "the frontier lab", "the demand side of the AI stack"], "sector": "Frontier AI research & products (foundation models, consumer + enterprise AI)", "geography": "United States (San Francisco, CA); compute via global data-center partners", "era": "2015-present; nonprofit founding 2015, ChatGPT launch Nov 2022, for-profit recapitalization 2025", "mode": "teardown", "date_walked": "2026-11-18"}, "chain": {"parent_id": "coreweave", "relation": "customer", "relation_note": "The CoreWeave teardown ended by pointing here: OpenAI is CoreWeave's largest and most strategic tenant, the signed demand that makes CoreWeave's debt-fueled backlog look safe. Walk one step further down the demand stack and you reach the lab whose appetite for compute underwrites the whole chain -- nvidia -> coreweave -> openai. NVIDIA called OpenAI 'the archetypal miner buying the shovels'; CoreWeave rents OpenAI the racked-up shovels on multi-year leases. This entry tears down the buyer at the bottom of the AI supply chain: the one whose demand is the reason every machine above it got built. If OpenAI is the engine of derived demand, every supplier's capex is a bet on this lab's revenue arriving on schedule.", "chain_position": 4, "suggested_next": [{"id": "anthropic", "relation": "substitute", "why": "The closest frontier-lab rival and the cleanest contrast class: a different safety posture, a different cloud patron (Amazon/Google rather than Microsoft), and a different accounting of 'revenue.' Tearing it down shows which parts of OpenAI's machine are the category and which are just OpenAI."}, {"id": "microsoft", "relation": "patron", "why": "OpenAI's largest shareholder (~27%), its early compute landlord, and the distribution giant that puts the models in front of a billion Office/Windows users. A teardown of the patron explains how a hyperscaler buys a call option on AGI without building the lab itself."}, {"id": "ai-capex-bubble", "relation": "template", "why": "OpenAI's ~$1.4T of compute commitments, financed circularly by its own suppliers, is the keystone of the AI capex boom. Tearing down 'the bubble question' as a pattern -- derived demand, circular financing, and the accelerator principle -- ties nvidia, tsmc, coreweave, and openai into one macro machine."}]}, "one_line": "OpenAI gives away superhuman intelligence at or below cost to 1.2 billion people, burning tens of billions a year, betting that scale, data, and a falling cost-per-token will turn today's subsidy into tomorrow's toll -- and that the demand it promises is big enough to justify the trillion-dollar supply chain built to serve it.", "engine": {"inputs": ["Enormous quantities of rented compute (GPUs from clouds like CoreWeave, Microsoft, Oracle; ~$1.4T of multi-year commitments)", "Capital -- tens of billions in equity from Microsoft, SoftBank, Nvidia, sovereign funds, raised faster than almost any company in history", "Data: public web text, licensed corpora, and a feedback flywheel from 1.2B weekly users' interactions", "Scarce research talent and the brand that lets it recruit and retain them", "A free-to-use consumer funnel (ChatGPT) that doubles as distribution and as a data/eval engine"], "transformation": "Spend capital and compute to train frontier models, then give most people access free or cheap to win a winner-take-most market before unit costs fall. The bet is a learning curve: each generation of model is cheaper to serve per token and the brand/scale lead compounds, so a business that loses ~$20B a year today becomes a high-margin toll on intelligence once adoption is locked and compute costs per unit of capability keep dropping. Convert research breakthroughs into (1) a consumer habit (ChatGPT) and (2) an enterprise/API platform others build on.", "outputs": ["ChatGPT (free + paid consumer tiers) -- the fastest-adopted consumer product in history", "The API/platform that developers and enterprises build products on top of", "Frontier models (the GPT line and successors) licensed and embedded via Microsoft and direct enterprise deals", "A standing claim on ~30 GW of future compute -- an asset and a liability at once"], "money_in": "Consumer subscriptions (~50M paying consumers), enterprise and API usage (enterprise was >40% of revenue by early 2026), and licensing. Annualized revenue run-rate reached ~$50B by late 2026, up from $3.7B of revenue in 2024.", "money_out": "Staggering compute and training costs, model-serving (inference) costs that scale with every free user, research headcount, and the beginnings of ~$1.4T in contracted infrastructure spend. OpenAI posted an operating loss around $21B in 2025 and projects deeply negative free cash flow for years.", "the_spread": "Negative today by design. Gross margin on paid usage can be healthy, but it is swamped by the cost of serving 1.2B weekly users mostly for free and by the capex ramp. The 'spread' OpenAI is underwriting is intertemporal: lose money now to own the demand, and harvest the toll later -- if the learning curve and the demand both show up.", "leverage_point": "Distribution + the data/brand flywheel. The model weights are increasingly replicable (rivals are close), but 1.2B weekly users, the 'ChatGPT' brand that became a verb, the Microsoft distribution channel, and the feedback loop that improves the product are not easily copied. That demand-side moat -- not a secret algorithm -- is what the whole valuation and the whole supply chain rest on."}, "unit": {"what": "One user interaction (a ChatGPT query or an API call). Each one costs real compute to serve. For free users that cost is pure subsidy; for paid users it is a thin margin over inference cost. The unit economics turn on cost-per-token falling (better chips, better models, cheaper inference) faster than usage grows.", "the_math": "The model only closes if (lifetime value of a captured user, once habits and switching costs set in) > (cumulative subsidy spent acquiring and serving them) AND cost-per-unit-of-capability keeps dropping. OpenAI is betting the learning curve is steep enough and the market winner-take-most enough that running the largest loss in corporate history now buys a durable toll booth later. The risk: inference costs scale with free usage, so popularity itself is a cash drain until pricing power or efficiency catches up."}, "plays": [{"play_name": "Give Away the Intelligence", "tagline": "Subsidize the thing everyone wants until using anything else feels like a downgrade.", "flow": [{"step_title": "Ship it free and astonishing", "step_desc": "Launch ChatGPT free to consumers (Nov 2022). It reaches 100M users in two months and 1.2B weekly by 2026 -- the fastest-adopted product ever, and a data/eval engine that improves the model."}, {"step_title": "Eat the loss on purpose", "step_desc": "Serve most users below cost, accepting ~$20B+ annual losses. The spend is the strategy: buy the habit and the brand before rivals can, while cost-per-token keeps falling."}, {"step_title": "Monetize the locked-in", "step_desc": "Convert the funnel into paid consumer tiers, an enterprise platform (>40% of revenue), and API usage others build on -- turning a free habit into a metered toll once leaving feels costly."}]}, {"play_name": "Play the Patrons Against Each Other", "tagline": "If no one company can fund the AGI bet, make several compete to.", "flow": [{"step_title": "Anchor with one giant", "step_desc": "Take Microsoft's capital and Azure compute early; give Microsoft a large stake (~27%) and distribution rights. One patron de-risks the first act."}, {"step_title": "Widen the bidding", "step_desc": "Then raise from Nvidia, SoftBank, sovereign funds, and others, and sign compute deals with Oracle, CoreWeave, and Amazon -- so no single supplier or funder can dictate terms, and each fears being left out."}, {"step_title": "Commit to demand you must grow into", "step_desc": "Sign ~$1.4T of multi-year compute commitments (~30 GW). The commitments signal confidence and lock supply -- but also force OpenAI to grow revenue fast enough to pay for them, binding its suppliers' fate to its own."}]}], "mechanics_summary": "OpenAI is a blitzscaling loss-leader: it sells frontier intelligence at or below cost to the largest audience it can reach, financing the shortfall with the biggest capital raises in history, on the bet that increasing returns (scale, data, brand, and a falling cost-per-token learning curve) will convert today's subsidy into tomorrow's toll. Its moat is demand-side -- 1.2B weekly users, a verb-status brand, and Microsoft distribution -- not a secret model, since rivals are close behind. Zoom out and OpenAI is the keystone of the whole Atlas AI chain: it is the derived demand that justifies CoreWeave's debt, NVIDIA's margins, and TSMC's furnaces. That is also the fragility. OpenAI has promised ~$1.4T of compute it cannot yet pay for from current revenue, and much of that demand is validated by suppliers who also fund it (Nvidia invests, clouds extend credit) -- circular financing that makes the demand signal look bigger and firmer than independent buyers alone would make it. If OpenAI's revenue arrives on schedule, the whole stack is a flywheel. If it stalls, the accelerator runs in reverse all the way back up to the furnace.", "history": {"origin": {"who": "Founded by Sam Altman, Elon Musk, Ilya Sutskever, Greg Brockman, and others", "when": "Founded 2015 as a nonprofit research lab; capped-profit arm added 2019; ChatGPT launched November 2022; recapitalized into OpenAI Group PBC in 2025", "what_problem_forced_it": "OpenAI began as a nonprofit meant to ensure AGI 'benefits all of humanity,' explicitly structured to NOT be driven by profit. But frontier AI turned out to be extraordinarily capital- and compute-intensive -- far beyond what donations could fund. The capped-profit structure (2019) and then the 2025 conversion to a public benefit corporation were forced by a single economic fact: training frontier models costs tens of billions, and only equity capital at that scale could pay for it. The mission didn't change; the balance sheet demanded a structure that could absorb the world's largest private capital raises."}, "operator": {"name": "Sam Altman (CEO)", "what_they_did": "Turned a research nonprofit into the demand engine of the AI economy by doing three things at once: shipping a free consumer product that became a global habit, raising and committing capital at unprecedented scale, and playing every major infrastructure provider (Microsoft, Nvidia, Oracle, SoftBank, Amazon, sovereign funds) against each other to fund the buildout. Survived a dramatic board ouster and reinstatement in November 2023 that underlined how much the machine is identified with him.", "outcome": "By late 2026 OpenAI ran at a ~$50B annualized revenue run-rate against ~$21B (2025) operating losses, was valued at $500B in the October 2025 recapitalization and reportedly higher in later rounds, and sat on ~$1.4T of compute commitments. It is simultaneously the most valuable private company of the era and the single largest open question in it: whether demand for intelligence is deep enough to pay for the supply chain OpenAI has summoned into existence."}, "counterexample": {"name": "DeepSeek (and the open-weight model wave)", "what_they_did": "A Chinese lab that showed in early 2025 that a competitive frontier-ish model could be trained and served at a small fraction of the assumed cost, and released open weights. It is the contrast class that threatens OpenAI's core bet: if frontier capability commoditizes and cost-per-token collapses for everyone, the moat shifts entirely to distribution and brand, and the trillion-dollar capex thesis -- that only a few well-funded labs can afford to play -- weakens. The counterexample is not 'a better model'; it is 'the same capability for far less money,' which is exactly what a learning-curve bet both needs and fears."}}, "epistemics": {"numbers": [{"claim": "Annualized revenue run-rate of about $50B as of October 2026 (up from $13.07B of revenue in 2025 and $3.7B in 2024)", "value": "~$50B run-rate", "as_of_date": "2026-10-01", "source_url": "https://explodingtopics.com/blog/openai-revenue", "confidence": "medium"}, {"claim": "Full-year 2025 revenue of $13.07B and a 2025 operating loss of about $20.9B (from leaked/audited accounts reported by Fortune)", "value": "$13.07B rev / -$20.9B op loss (2025)", "as_of_date": "2026-01-01", "source_url": "https://explodingtopics.com/blog/openai-revenue", "confidence": "medium"}, {"claim": "About 1.2 billion weekly active ChatGPT users as of September 2026; roughly 50 million paying consumer subscribers (Feb 2026); enterprise was over 40% of revenue by early 2026", "value": "1.2B weekly users", "as_of_date": "2026-09-01", "source_url": "https://explodingtopics.com/blog/openai-revenue", "confidence": "medium"}, {"claim": "October 2025 recapitalization into OpenAI Group PBC valued the entity at $500B; the OpenAI Foundation (nonprofit) controls it and holds a 26% stake (~$130B); Microsoft holds ~27%", "value": "$500B; Foundation 26% / Microsoft 27%", "as_of_date": "2025-10-28", "source_url": "https://www.axios.com/2025/10/28/openai-completes-recapitalization", "confidence": "high"}, {"claim": "A March 2026 round raised ~$122B at an $852B valuation, with a later round reportedly discussed near a ~$1.4T valuation", "value": "$122B raised @ $852B (Mar 2026)", "as_of_date": "2026-03-01", "source_url": "https://explodingtopics.com/blog/openai-revenue", "confidence": "medium"}, {"claim": "OpenAI has committed to roughly $1.4 trillion of compute/infrastructure over ~8 years (~30 GW), including an ~$300B Oracle deal and large Nvidia, AMD, Amazon, and CoreWeave arrangements; Altman has said OpenAI wants to reach ~$1T/year in infrastructure spend", "value": "~$1.4T compute commitments / ~30 GW", "as_of_date": "2025-10-28", "source_url": "https://www.axios.com/2025/10/28/openai-1-trillion-altman", "confidence": "medium"}, {"claim": "Company/FT projections cited ~$36B of 2026 revenue, ~$856B of 2026-2030 compute and infrastructure spending, and ~$278B of cumulative negative free cash flow over 2026-2030", "value": "~$856B compute spend 2026-30 (proj.)", "as_of_date": "2026-01-01", "source_url": "https://explodingtopics.com/blog/openai-revenue", "confidence": "low"}], "unknowns": ["The true single revenue run-rate. Reported figures range from ~$50B (OpenAI's method) to ~$70B (a different accounting method), and OpenAI is private, so audited, reconciled numbers are not public -- several figures here come from leaks and secondary reporting, not filings.", "Whether the ~$1.4T of compute commitments are firm obligations, options, or framework agreements that can be renegotiated. The distinction is the whole bull/bear case and is not cleanly disclosed.", "How much of OpenAI's demand is independent versus circular -- validated by the same suppliers (Nvidia, clouds) who also fund or extend credit to it. The degree of circularity determines how real the demand signal is.", "Unit economics per user: OpenAI has not disclosed clean inference cost per query or gross margin by tier, so the central 'does the learning curve outrun the subsidy' question is inferred, not reported.", "The path and timing to positive free cash flow, and whether an IPO (widely speculated) happens before or because of the cash need."], "disclaimer": "Educational teardown for pattern-recognition, not investment advice. OpenAI is a private company whose figures are largely unaudited-public and change fast; treat all numbers as dated snapshots from secondary sources."}, "recall": {"glyph_prompt": "Return to the gold-rush valley, but pull the camera back to the town square at the valley's mouth, where ALL the miners actually live. A charismatic figure stands on a crate handing out magic lanterns -- free, to an endless line of 1.2 billion townsfolk stretching to the horizon -- that light up any dark question instantly. He is paying for the lantern oil out of a bottomless sack of borrowed gold, and the sack is refilled by a ring of financiers (one wearing NVIDIA's green eye, one labeled Microsoft, one a sovereign crown) who stand in a circle, each handing gold to the next. Behind the crate, a vast IOU pinned to the sky reads '$1.4 TRILLION IN SHOVELS ORDERED.' Everyone upstream -- the shovel-renter, the shovel-seller, the furnace-keeper -- is watching this one square, because if the townsfolk ever stop needing the lanterns, every furnace in the valley goes cold.", "questions": ["OpenAI loses roughly $20B a year on purpose. What exactly is it buying with that loss, and what two things must be true for the subsidy to turn into a toll?", "Why is OpenAI's real moat its 1.2 billion users and the ChatGPT brand rather than the model itself? (Hint: look at who's a close second.)", "OpenAI sits at the bottom of the chain nvidia -> coreweave -> openai as the demand everyone above is betting on. Explain 'circular financing' here -- and why it makes that demand look bigger and safer than it may be."]}, "economics_lens": {"concept": "Blitzscaling: loss-leader pricing to capture increasing returns (scale, data, and learning-curve effects) -- and the derived demand (accelerator principle) that keystones a whole supply chain", "micro_or_macro": "both", "explain": "Micro: OpenAI is a textbook loss-leader played at civilizational scale. It prices a product below cost to acquire a winner-take-most market, betting on increasing returns to adoption -- more users produce more data and brand gravity, which improve the product and raise switching costs -- combined with a learning/experience curve where the cost to deliver a unit of capability falls as cumulative output rises. If cost-per-token drops faster than the subsidy compounds, the intertemporal trade works: lose money now to own a toll later. The danger is that inference cost scales with free usage, so adoption itself burns cash until pricing power or efficiency arrives, and if frontier capability commoditizes (cheap open-weight rivals), the moat collapses to distribution alone. Macro: OpenAI is the clearest live example of the accelerator principle and derived demand. Its appetite for compute is the demand that justifies CoreWeave's debt, NVIDIA's margins, and TSMC's capex -- so a change in OpenAI's growth rate is amplified as it propagates up the chain. That linkage is what makes the AI buildout both a flywheel and a potential bubble: when the demand at the bottom is partly validated by the suppliers who also finance it (circular financing), the whole structure can look sturdier than independent end-demand would justify, and a shortfall at OpenAI would run the accelerator backward all the way to the furnace."}}, {"id": "banking-retail", "name": "Retail Banking", "aka": ["commercial banking", "depository institution"], "sector": "Financial services", "geography": "Global; figures skew US", "era": "Modern form since ~17th c. goldsmith-bankers; deposit banking much older", "mode": "teardown", "date_walked": "2026-07-26", "chain": {"parent_id": null, "relation": "seed", "relation_note": "First entry in the Atlas. The chain grows from here.", "chain_position": 0, "suggested_next": [{"id": "core-banking-software", "relation": "upstream_supplier", "why": "The software rails every bank runs on — who sells the picks and shovels?"}, {"id": "payment-networks", "relation": "symbiote", "why": "Visa/Mastercard sit on the same money flow and run a pure toll-booth."}, {"id": "insurance-underwriting", "relation": "substitute", "why": "Same 'float' mechanic as deposits, different wrapper — the first cross-link."}]}, "one_line": "Buy money cheap from depositors, sell it dear to borrowers, and live on the gap.", "engine": {"inputs": "Deposits — other people's money, entrusted cheaply", "transformation": "Pools deposits, holds a fraction as capital, lends the rest out many times over", "outputs": "Loans — the same money, sold as credit at a higher rate", "money_in": "Interest and fees from borrowers; card, account and overdraft fees", "money_out": "Interest paid to depositors; operating cost; loan losses", "the_spread": "loan rate − deposit rate  (the Net Interest Margin)", "leverage_point": "Hold ~10% as capital, lend the rest — roughly 10× the capital base"}, "unit": {"unit_name": "One dollar of deposits", "unit_economics": "A dollar deposited at ~0.5% funds a loan at ~7%; the ~6.5pt gross spread, minus losses and cost, is the margin. Figures illustrative.", "what_one_unit_produces": "Not just interest — a customer relationship that can be cross-sold cards, mortgages, and advice at higher margin."}, "plays": [{"play_name": "Margin Lag", "tagline": "Raise loan rates fast. Raise deposit rates slow.", "flow": [{"step_title": "Fed hikes", "step_desc": "The central bank raises rates."}, {"step_title": "Speed gap", "step_desc": "Loan rates jump the same day; deposit rates crawl up over months."}, {"step_title": "The lag = profit", "step_desc": "The bank keeps the widening gap before it has to pass raises on."}], "the_move": "Loans reprice at a sprint; deposits reprice at a walk. The delay itself is the money.", "in_the_wild": "In the 2022–23 hiking cycle, US loan yields rose faster than deposit costs — 'loan betas beat deposit betas' — fattening margins until deposit costs caught up.", "watch_out": "Eventually depositors demand their raise. Margins peak, then compress.", "glyph_id": "marginlag", "mechanics": ["spread", "capital-cycle", "arbitrage"]}, {"play_name": "Fee Fortress", "tagline": "Boring rates. The real money leaks in from the sides.", "flow": [{"step_title": "Thin spread", "step_desc": "Headline rates are unremarkable — nothing to see."}, {"step_title": "Fee streams", "step_desc": "Overdraft, account, ATM, card and wire fees pour in from every side."}, {"step_title": "Moat fills", "step_desc": "Non-interest income becomes the profit engine, not the spread."}], "the_move": "Don't win on the spread — win on the fine print. Dozens of small fees fill the moat.", "in_the_wild": "US retail banking has historically drawn a large share of revenue from non-interest income — fees small and frequent enough that customers barely notice them adding up.", "watch_out": "Fee income is politically fragile — regulators love to cap overdraft and 'junk' fees.", "glyph_id": "feefortress", "mechanics": ["toll-booth", "bundling", "information-asymmetry"]}, {"play_name": "Niche Play", "tagline": "Own one narrow lane. Charge a premium for the expertise.", "flow": [{"step_title": "Pick one target", "step_desc": "Auto loans, small-business, equipment leasing — one segment, deeply known."}, {"step_title": "Specialist edge", "step_desc": "Underwrite risk competitors can't read; lend where they won't."}, {"step_title": "Premium rate", "step_desc": "Charge more because you understand the borrower better than anyone."}], "the_move": "Skip the scale war. Go an inch wide and a mile deep, and price the expertise.", "in_the_wild": "Community banks lean on this — accepting higher risk on borrowers they personally know in exchange for higher yield.", "watch_out": "Concentration. If your one lane hits a pothole, the whole book feels it.", "glyph_id": "nicheplay", "mechanics": ["information-asymmetry", "brand-premium", "adverse-selection"]}, {"play_name": "Deposit Rush", "tagline": "Outbid everyone on savings. Pull cash in fast, then deploy.", "flow": [{"step_title": "High-yield magnet", "step_desc": "Post a top-of-market savings or CD rate."}, {"step_title": "Liquidity floods in", "step_desc": "Cash arrives faster than organic growth ever could."}, {"step_title": "Deploy the cash", "step_desc": "Turn funding into higher-yielding loans and earn the spread."}], "the_move": "Buy funding aggressively when you need liquidity now — speed over cost.", "in_the_wild": "Post-pandemic, national high-yield platforms let banks vacuum up deposits with a rate — but that funding is 'hot': it chases the next best rate and leaves as fast.", "watch_out": "Rate-shoppers aren't loyal. Elevated deposit costs squeeze the very margin you chased.", "glyph_id": "depositrush", "mechanics": ["scarcity-manufacture", "capital-cycle", "spread"]}, {"play_name": "Cross-Sell Trap", "tagline": "One shiny product to get you in. Then bundle you in for life.", "flow": [{"step_title": "The lure", "step_desc": "A standout product — a high-yield savings account — gets you through the door."}, {"step_title": "The funnel", "step_desc": "Checking, card, mortgage, investments — bundled with relationship pricing."}, {"step_title": "Stickiness", "step_desc": "Each added product makes leaving costlier; you stop shopping around."}], "the_move": "The rate is bait. The profit is everything they sell you afterward.", "in_the_wild": "A standard tactic: tie every new loan to a household checking account — integrated bundles cut churn and lock in the relationship.", "watch_out": "For the customer: convenience quietly costs the best rate on each individual product. For the bank: aggressive cross-sell can tip into scandal (see Wells Fargo).", "glyph_id": "crosssell", "mechanics": ["loss-leader", "lock-in", "switching-cost", "bundling"]}], "mechanics_summary": [{"tag": "spread", "note": "Profit is the gap between a cheap input price and a dear output price."}, {"tag": "float", "note": "Hold other people's money in the gap between receiving and paying it out."}, {"tag": "capital-cycle", "note": "Leverage a thin capital base into a large asset book; regulated by ratio."}, {"tag": "lock-in", "note": "Make leaving costlier than staying."}, {"tag": "loss-leader", "note": "Lose on the lure to win on everything sold after it."}, {"tag": "toll-booth", "note": "Sit on a flow and charge a small fee each time value passes."}], "history": {"origin": {"who": "London goldsmith-bankers", "when": "17th century", "what_problem_forced_it": "Merchants needed somewhere safe to store gold. Goldsmiths issued paper receipts for deposits; when they noticed not everyone withdrew at once, they began lending out receipts against gold they held — inventing fractional-reserve lending and, with it, the spread."}, "operator": {"name": "A. P. Giannini, Bank of Italy / Bank of America", "what_they_did": "Opened banking to working-class immigrants ignored by elite banks in early-1900s San Francisco; lent on character and small deposits, and famously lent to rebuild after the 1906 earthquake. Turned the 'underserved, not unworthy' niche into the largest bank in the country.", "outcome": "Bank of America became, for a time, the world's largest commercial bank."}, "counterexample": {"name": "Wells Fargo cross-sell scandal (2016)", "what_they_did": "Pushed the Cross-Sell Trap past the line — employees under quota pressure opened millions of accounts customers never authorized.", "why_it_broke": "The play depends on customer trust; manufacturing fake demand destroyed it, drew billions in fines, and capped the bank's growth by regulators for years."}}, "epistemics": {"numbers": [{"label": "Capital ratio (illustrative)", "value": "~10", "unit": "%", "source_url": "https://www.bis.org/bcbs/basel3.htm", "as_of_date": "2026-07-26", "confidence": "ballpark"}, {"label": "Illustrative gross spread", "value": "~6.5", "unit": "pts", "source_url": null, "as_of_date": "2026-07-26", "confidence": "illustrative"}], "confidence": "ballpark", "unknowns": ["Exact current NIM varies widely by bank, year, and rate environment — not pinned here.", "Non-interest income share differs by institution; stated only as 'a large share'.", "Deposit/loan beta figures for 2022–23 are directional, not sourced to a specific filing in this entry."]}, "recall": {"glyph_prompt": "Picture two arrows off the same starting line: the loan arrow shoots up fast, the deposit arrow crawls. The widening wedge between them is the profit.", "three_questions": ["Where does a bank's money come in, and where does it go out?", "What single equation is the whole business? (loan rate − deposit rate)", "Name two ways a bank widens or d
